<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Pure CSS 3D Perspective Tilt Card"
  >

  <title>3D Perspective Tilt Card</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <section class="card-showcase" aria-label="3D perspective tilt card demo">

      <article class="tilt-card">

        <div class="card-glow" aria-hidden="true"></div>

        <div class="card-content">

          <div class="card-icon" aria-hidden="true">
            ✦
          </div>

          <p class="card-label">
            EASEMOTION CSS
          </p>

          <h1>
            3D Perspective
            <span>Tilt</span>
          </h1>

          <p class="card-description">
            A smooth CSS-only card interaction using perspective,
            transforms, layered shadows, and subtle motion.
          </p>

          <div class="card-footer">

            <span class="card-tag">
              Pure CSS
            </span>

            <span class="card-arrow" aria-hidden="true">
              ↗
            </span>

          </div>

        </div>

      </article>

    </section>

  </main>

</body>
</html>
