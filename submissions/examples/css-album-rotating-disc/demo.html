<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Album Rotating Disc | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <article class="demo-card">
      <header class="header-section">
        <h1 class="header-title">Midnight Waves</h1>
        <p class="header-subtitle">EaseMotion Audio Track • Pure CSS Player</p>
      </header>

      <!-- Pure CSS State Toggle -->
      <input type="checkbox" id="album-toggle" class="play-state-checkbox" aria-label="Toggle album disc spin animation">

      <label for="album-toggle" class="play-control-btn">
        <svg class="icon-play" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        <svg class="icon-pause" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
        <span class="btn-text"></span>
      </label>

      <section class="album-player" aria-label="Interactive rotating album vinyl disc display">
        <div class="disc-wrapper">
          <div class="vinyl-disc" role="img" aria-label="Vinyl record spinning disc with grooves"></div>
        </div>
      </section>
    </article>
  </main>
</body>
</html>
