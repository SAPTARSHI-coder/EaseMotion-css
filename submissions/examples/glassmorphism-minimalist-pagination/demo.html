<!-- submissions/examples/glassmorphism-minimalist-pagination/demo.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glassmorphism Pagination | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo-container">
    
    <!-- Semantic Pagination Nav -->
    <nav aria-label="Pagination Navigation">
      <ul class="ease-glass-pagination">
        
        <!-- Disabled Previous Button -->
        <li class="ease-glass-page-item">
          <a href="#" class="ease-glass-page-link disabled" aria-disabled="true" aria-label="Previous page">
            <span aria-hidden="true">&laquo; Prev</span>
          </a>
        </li>
        
        <!-- Active Page -->
        <li class="ease-glass-page-item active" aria-current="page">
          <a href="#" class="ease-glass-page-link">1</a>
        </li>
        
        <!-- Inactive Pages -->
        <li class="ease-glass-page-item">
          <a href="#" class="ease-glass-page-link">2</a>
        </li>
        <li class="ease-glass-page-item">
          <a href="#" class="ease-glass-page-link">3</a>
        </li>
        <li class="ease-glass-page-item">
          <span class="ease-glass-page-link disabled" aria-hidden="true">...</span>
        </li>
        <li class="ease-glass-page-item">
          <a href="#" class="ease-glass-page-link">10</a>
        </li>
        
        <!-- Active Next Button -->
        <li class="ease-glass-page-item">
          <a href="#" class="ease-glass-page-link" aria-label="Next page">
            <span aria-hidden="true">Next &raquo;</span>
          </a>
        </li>
        
      </ul>
    </nav>

  </main>

</body>
</html>
