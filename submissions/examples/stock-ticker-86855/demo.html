<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Market Stock Ticker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="market">
      <header>
        <div>
          <p class="eyebrow">Live markets</p>
          <h1>Closing bell</h1>
        </div>
        <span class="status"><i aria-hidden="true"></i> Market open</span>
      </header>

      <section class="ticker" tabindex="0" aria-label="Live stock prices">
        <div class="ticker__track">
          <div class="quote quote--up">
            <strong>NVDA</strong><span>$182.46</span><em>&#8593; 2.84%</em>
          </div>
          <div class="quote quote--down">
            <strong>TSLA</strong><span>$349.91</span><em>&#8595; 1.12%</em>
          </div>
          <div class="quote quote--up">
            <strong>MSFT</strong><span>$521.30</span><em>&#8593; 0.76%</em>
          </div>
          <div class="quote quote--up">
            <strong>AAPL</strong><span>$241.18</span><em>&#8593; 1.43%</em>
          </div>
          <div class="quote quote--down">
            <strong>AMZN</strong><span>$229.64</span><em>&#8595; 0.38%</em>
          </div>
          <div class="quote quote--up" aria-hidden="true">
            <strong>NVDA</strong><span>$182.46</span><em>&#8593; 2.84%</em>
          </div>
          <div class="quote quote--down" aria-hidden="true">
            <strong>TSLA</strong><span>$349.91</span><em>&#8595; 1.12%</em>
          </div>
          <div class="quote quote--up" aria-hidden="true">
            <strong>MSFT</strong><span>$521.30</span><em>&#8593; 0.76%</em>
          </div>
          <div class="quote quote--up" aria-hidden="true">
            <strong>AAPL</strong><span>$241.18</span><em>&#8593; 1.43%</em>
          </div>
          <div class="quote quote--down" aria-hidden="true">
            <strong>AMZN</strong><span>$229.64</span><em>&#8595; 0.38%</em>
          </div>
        </div>
      </section>

      <footer>
        <span>S&amp;P 500</span><strong>6,442.18</strong
        ><span class="positive">+0.61%</span>
      </footer>
    </main>
  </body>
</html>
