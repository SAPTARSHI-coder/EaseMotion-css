<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Product Color Variant Selector demo">
  <title>Product Color Variant Selector</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="demo-container">

    <section class="product-card" aria-labelledby="product-title">

      <div class="product-image-wrapper">
        <div class="product-image" aria-label="Product preview">
          <span class="product-shape"></span>
        </div>
      </div>

      <div class="product-info">

        <p class="product-category">Premium Collection</p>

        <h1 id="product-title">Classic Sneakers</h1>

        <p class="product-description">
          Comfortable everyday sneakers with a clean and modern design.
        </p>

        <div class="product-price" aria-label="Price">
          ₹2,499
        </div>

        <fieldset class="color-selector">
          <legend>Choose a color</legend>

          <div class="color-options">

            <input
              type="radio"
              name="product-color"
              id="color-black"
              checked
            >
            <label
              for="color-black"
              class="color-dot color-black"
              title="Black"
              aria-label="Black"
            ></label>

            <input
              type="radio"
              name="product-color"
              id="color-blue"
            >
            <label
              for="color-blue"
              class="color-dot color-blue"
              title="Blue"
              aria-label="Blue"
            ></label>

            <input
              type="radio"
              name="product-color"
              id="color-red"
            >
            <label
              for="color-red"
              class="color-dot color-red"
              title="Red"
              aria-label="Red"
            ></label>

            <input
              type="radio"
              name="product-color"
              id="color-green"
            >
            <label
              for="color-green"
              class="color-dot color-green"
              title="Green"
              aria-label="Green"
            ></label>

          </div>
        </fieldset>

        <button class="add-button" type="button">
          Add to Cart
        </button>

      </div>

    </section>

  </main>

</body>
</html>
