<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>ease-elevator-panel-control</title>
</head>
<body>
<main class="epc-panel">
  <header class="epc-head">
    <h1 class="epc-title">Elevator</h1>
    <span class="epc-car">Car A</span>
  </header>
  <section class="epc-display" aria-label="floor indicator">
    <span class="epc-floor">7</span>
    <span class="epc-arrow epc-arrow-up"></span>
    <span class="epc-arrow epc-arrow-down"></span>
  </section>
  <div class="epc-doors">
    <div class="epc-door epc-door-left"></div>
    <div class="epc-door epc-door-right"></div>
  </div>
  <section class="epc-buttons">
    <button class="epc-btn epc-btn-b">B</button>
    <button class="epc-btn">1</button>
    <button class="epc-btn">2</button>
    <button class="epc-btn">3</button>
    <button class="epc-btn">4</button>
    <button class="epc-btn">5</button>
    <button class="epc-btn epc-btn-active">6</button>
    <button class="epc-btn">7</button>
    <button class="epc-btn epc-btn-alarm">AL</button>
  </section>
  <footer class="epc-foot">
    <span class="epc-open">Open</span>
    <span class="epc-close">Close</span>
  </footer>
</main>
</body>
</html>
