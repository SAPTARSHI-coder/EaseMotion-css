<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Responsive CSS sticky footer layout.">
  <title>CSS Sticky Footer Layout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page">
    <header class="site-header">
      <a class="brand" href="#" aria-label="EaseMotion home">EaseMotion</a>

      <nav aria-label="Primary navigation">
        <a href="#content">Home</a>
        <a href="#content">About</a>
        <a href="#footer">Contact</a>
      </nav>
    </header>

    <main id="content" class="content">
      <span class="eyebrow">Layout utility</span>
      <h1>Sticky Footer Layout</h1>
      <p>
        A flexible CSS layout that keeps the footer at the bottom
        of the viewport when content is short and naturally pushes
        it below the content when the page becomes longer.
      </p>

      <a class="cta" href="#footer">Explore layout</a>
    </main>

    <footer id="footer" class="site-footer">
      <span>© 2026 EaseMotion</span>
      <span>Built with CSS</span>
    </footer>
  </div>

</body>
</html>
