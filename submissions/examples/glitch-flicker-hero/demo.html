<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Glitch-Flicker Hero Section for fintech dashboards">
  <title>Glitch-Flicker Hero</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="hero">

```
<div class="hero-content">

  <span class="badge">FINTECH DASHBOARD</span>

  <h1 class="glitch-title" data-text="Smart Finance">
    Smart Finance
  </h1>

  <p>
    Take control of your financial future with a simple,
    intelligent dashboard built for modern money management.
  </p>

  <div class="hero-buttons">
    <a href="#" class="button primary">Get Started</a>
    <a href="#" class="button secondary">Explore Features</a>
  </div>

  <div class="stats">
    <div>
      <strong>$2.4M+</strong>
      <span>Transactions</span>
    </div>

    <div>
      <strong>98.5%</strong>
      <span>Accuracy</span>
    </div>

    <div>
      <strong>24/7</strong>
      <span>Monitoring</span>
    </div>
  </div>

</div>

<div class="hero-card">

  <div class="card-header">
    <span>Portfolio Balance</span>
    <span class="status">● Live</span>
  </div>

  <strong class="balance">$84,520.80</strong>

  <div class="chart">
    <span></span>
  </div>

  <div class="card-footer">
    <span>Monthly Growth</span>
    <strong>+12.8%</strong>
  </div>

</div>
```

  </main>

</body>
</html>
