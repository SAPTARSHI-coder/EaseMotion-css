<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pure CSS Parallax Utilities Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: white;
    }
    
    .ease-parallax-container {
      position: relative;
    }

    .parallax-group {
      position: relative;
      height: 100vh;
      transform-style: preserve-3d;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .layer-content {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      text-shadow: 0 10px 20px rgba(0,0,0,0.5);
      height: 100%;
    }

    /* Styling specific demo layers */
    .bg-mountain {
      background: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
      opacity: 0.6;
    }
    
    .bg-trees {
      background: linear-gradient(transparent 50%, #0f172a 100%), url('https://images.unsplash.com/photo-1425913397330-cf8af2ff40a1?auto=format&fit=crop&w=1200&q=80') bottom/cover no-repeat;
      opacity: 0.8;
    }

    .fg-content {
      background: #0f172a;
      padding: 100px 20px;
      text-align: center;
      z-index: 10;
      position: relative;
    }
  </style>
</head>
<body>

  <div class="ease-parallax-container">
    <div class="parallax-group">
      <div class="ease-parallax-layer ease-parallax-layer-slow bg-mountain"></div>
      <div class="ease-parallax-layer ease-parallax-layer-medium bg-trees"></div>
      
      <div class="ease-parallax-layer ease-parallax-layer-base">
        <div class="layer-content">
          EaseMotion Parallax
        </div>
      </div>
    </div>
    
    <div class="fg-content">
      <h2>Scroll Down</h2>
      <p>The background elements scroll at different speeds, creating a 3D depth effect purely with CSS.</p>
      <div style="height: 100vh;"></div>
      <h2>Bottom Content</h2>
    </div>
  </div>

</body>
</html>
