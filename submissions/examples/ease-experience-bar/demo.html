<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Experience Bar · level up</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="xp-container">
      <div class="xp-header">
        <div class="xp-label">
          <span>⭐ Experience</span>
          <span class="level-badge" id="levelDisplay">Level 1</span>
        </div>
        <div class="xp-sub-label">
          <span id="xpDisplay">0 / 100 XP</span>
          <span id="xpPercent">0%</span>
        </div>
      </div>
      <div class="xp-track">
        <div id="xpFill" class="xp-fill">0%</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-gain" id="gainBtn">⚡ Gain 25 XP</button>
      <button class="btn btn-bonus" id="bonusBtn">🎯 Bonus 50 XP</button>
      <button class="btn btn-reset" id="resetBtn">⟳ Reset</button>
    </div>
    <div class="footer-note">
      <span>⬆️ gain XP · 🎯 bonus XP · level up at 100 XP</span>
    </div>
  </div>

  <!-- Level Up Notification -->
  <div id="levelUpNotification" class="level-up-notification">
    <div class="level-up-content">
      <span class="level-up-icon">🎉</span>
      <span class="level-up-text">LEVEL UP!</span>
      <span class="level-up-level" id="newLevelDisplay">Level 2</span>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM refs
      const xpFill = document.getElementById('xpFill');
      const xpDisplay = document.getElementById('xpDisplay');
      const xpPercent = document.getElementById('xpPercent');
      const levelDisplay = document.getElementById('levelDisplay');
      const newLevelDisplay = document.getElementById('newLevelDisplay');
      const levelUpNotification = document.getElementById('levelUpNotification');

      // state
      const XP_PER_LEVEL = 100;
      let currentXP = 0;
      let currentLevel = 1;

      function renderXP() {
        const percent = Math.min((currentXP / XP_PER_LEVEL) * 100, 100);
        const roundedPercent = Math.round(percent);

        xpFill.style.width = roundedPercent + '%';
        xpFill.textContent = roundedPercent + '%';
        xpDisplay.textContent = `${Math.round(currentXP)} / ${XP_PER_LEVEL} XP`;
        xpPercent.textContent = roundedPercent + '%';
        levelDisplay.textContent = `Level ${currentLevel}`;
      }

      function showLevelUp() {
        newLevelDisplay.textContent = `Level ${currentLevel}`;
        levelUpNotification.classList.add('show');
        
        // Add confetti-like particles
        createConfetti();
        
        // Hide after animation completes
        setTimeout(() => {
          levelUpNotification.classList.remove('show');
        }, 3000);
      }

      function createConfetti() {
        const colors = ['#f43f5e', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6', '#ec4899'];
        const container = document.querySelector('.card');
        
        for (let i = 0; i < 30; i++) {
          const confetti = document.createElement('div');
          confetti.className = 'confetti-piece';
          confetti.style.left = Math.random() * 100 + '%';
          confetti.style.top = '-10px';
          confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
          confetti.style.width = (Math.random() * 8 + 4) + 'px';
          confetti.style.height = (Math.random() * 8 + 4) + 'px';
          confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
          confetti.style.animationDuration = (Math.random() * 1.5 + 1) + 's';
          confetti.style.animationDelay = (Math.random() * 0.5) + 's';
          confetti.style.setProperty('--tx', (Math.random() * 200 - 100) + 'px');
          confetti.style.setProperty('--ty', (Math.random() * 300 + 100) + 'px');
          container.appendChild(confetti);
          
          setTimeout(() => {
            confetti.remove();
          }, 3000);
        }
      }

      function gainXP(amount) {
        if (amount <= 0) return;
        
        let remainingXP = amount;
        let leveledUp = false;
        
        while (remainingXP > 0) {
          const xpToNextLevel = XP_PER_LEVEL - currentXP;
          
          if (remainingXP >= xpToNextLevel) {
            // Level up!
            remainingXP -= xpToNextLevel;
            currentXP = 0;
            currentLevel++;
            leveledUp = true;
            
            // Show level up animation immediately
            showLevelUp();
            renderXP();
            
            // Small delay before continuing (for visual clarity)
            if (remainingXP > 0) {
              // Continue gaining XP after level up
              setTimeout(() => {
                gainXP(remainingXP);
              }, 100);
              return;
            }
          } else {
            // Not enough XP to level up
            currentXP += remainingXP;
            remainingXP = 0;
          }
        }
        
        renderXP();
      }

      function resetXP() {
        currentXP = 0;
        currentLevel = 1;
        renderXP();
      }

      const gainBtn = document.getElementById('gainBtn');
      const bonusBtn = document.getElementById('bonusBtn');
      const resetBtn = document.getElementById('resetBtn');

      if (gainBtn) {
        gainBtn.addEventListener('click', function(e) {
          e.preventDefault();
          gainXP(25);
        });
      }

      if (bonusBtn) {
        bonusBtn.addEventListener('click', function(e) {
          e.preventDefault();
          gainXP(50);
        });
      }

      if (resetBtn) {
        resetBtn.addEventListener('click', function(e) {
          e.preventDefault();
          resetXP();
        });
      }

      // Keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        const key = e.key;
        if (key === 'g' || key === 'G') {
          e.preventDefault();
          gainXP(25);
        } else if (key === 'b' || key === 'B') {
          e.preventDefault();
          gainXP(50);
        } else if (key === 'r' || key === 'R') {
          e.preventDefault();
          resetXP();
        }
      });

      renderXP();
      console.log('⭐ Experience Bar ready · shortcuts: [G]ain 25, [B]onus 50, [R] Reset');
    })();
  </script>
</body>
</html>
