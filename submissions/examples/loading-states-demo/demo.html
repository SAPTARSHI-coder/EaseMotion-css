<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>EaseMotion CSS - Loading States</title>

    <!-- Update this path according to the repository -->
    <link
        rel="stylesheet"
        href="../../dist/easemotion.css">

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

    <main class="container">

        <header>

            <span class="eyebrow">
                EaseMotion CSS
            </span>

            <h1>
                Loading States
            </h1>

            <p>
                Explore different loading patterns commonly used
                in modern web applications.
            </p>

        </header>


        <!-- Spinner -->

        <section class="demo-section">

            <h2>
                Loading Spinner
            </h2>

            <div
                class="spinner"
                role="status"
                aria-label="Loading">
            </div>

        </section>


        <!-- Pulse -->

        <section class="demo-section">

            <h2>
                Pulsing Indicator
            </h2>

            <div class="pulse-container">

                <span class="pulse"></span>
                <span class="pulse"></span>
                <span class="pulse"></span>

            </div>

        </section>


        <!-- Skeleton -->

        <section class="demo-section">

            <h2>
                Skeleton Card
            </h2>

            <article class="skeleton-card">

                <div class="skeleton skeleton-image"></div>

                <div class="skeleton skeleton-title"></div>

                <div class="skeleton skeleton-text"></div>

                <div class="skeleton skeleton-text short"></div>

                <div class="skeleton skeleton-button"></div>

            </article>

        </section>


        <!-- Loading Button -->

        <section class="demo-section">

            <h2>
                Loading Button
            </h2>

            <button
                class="loading-button"
                type="button"
                disabled>

                <span class="button-spinner"></span>

                Processing...

            </button>

        </section>

    </main>

</body>

</html>
