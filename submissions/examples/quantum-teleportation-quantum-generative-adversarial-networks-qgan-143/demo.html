<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Generative Adversarial Networks QGAN - EaseMotion CSS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
    <link rel="stylesheet" href="style.css"></head><body class="ease-center ease-fade-in" style="min-height: 100vh; background-color: #030712; color: #ffffff;">

    <div class="ease-card ease-card-glass qgan-container">
        <div class="qgan-header">
            <h2>Quantum GAN (QGAN)</h2>
            <span class="ease-badge ease-badge-primary">Quantum Machine Learning</span>
        </div>
        
        <div class="qgan-screen ease-center">
            <div class="qgan-flux flux-qgan-a"></div>
            <div class="qgan-flux flux-qgan-b"></div>
            <div class="qgan-boundary-ring"></div>
            <div class="qgan-core ease-center"></div>
        </div>

        <div class="qgan-footer ease-flex ease-justify-between ease-items-center">
            <span class="ease-text-sm">Generator &amp; Discriminator Circuits</span>
            <button class="ease-btn ease-btn-primary ease-btn-sm ease-hover-grow">Run QGAN Training</button>
        </div>
    </div></body></html>
