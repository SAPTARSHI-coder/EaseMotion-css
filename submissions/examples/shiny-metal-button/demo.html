<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="CSS-only shiny metallic button with animated highlight."
  >

  <title>Shiny Metal Button</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo-page">

    <section class="button-showcase" aria-labelledby="demo-title">

      <h1 id="demo-title">Shiny Metal Button</h1>

      <p class="description">
        A responsive metallic button built entirely with CSS.
      </p>

      <div class="button-group">

        <button
          class="metal-button metal-button--silver"
          type="button"
          aria-label="Explore silver button"
        >
          <span class="metal-button__shine" aria-hidden="true"></span>
          <span class="metal-button__content">
            <span class="metal-button__icon" aria-hidden="true">✦</span>
            <span>Silver</span>
          </span>
        </button>

        <button
          class="metal-button metal-button--gold"
          type="button"
          aria-label="Explore gold button"
        >
          <span class="metal-button__shine" aria-hidden="true"></span>
          <span class="metal-button__content">
            <span class="metal-button__icon" aria-hidden="true">★</span>
            <span>Gold</span>
          </span>
        </button>

      </div>

    </section>

  </main>
</body>
</html>
