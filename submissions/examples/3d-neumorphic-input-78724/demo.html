<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Neumorphic Input</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="demo-wrapper">
        <header class="demo-header">
            <h1>3D Neumorphic Input</h1>
            <p>A pure CSS responsive input component featuring soft 3D inset shadows and elevated containers.</p>
        </header>

        <!-- Neumorphic Outer Container (Raised) -->
        <section class="neumorphic-container">
            <!-- Form Group -->
            <div class="neumorphic-form-group">
                <label for="username" class="neumorphic-label">Username</label>
                
                <div class="neumorphic-input-wrapper">
                    <!-- The 3D Inset Input -->
                    <input type="text" id="username" class="neumorphic-input" placeholder="e.g. kadaliswarna">
                    
                    <!-- SVG Icon overlay (optional aesthetics) -->
                    <svg class="neumorphic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
                
                <span class="neumorphic-helper">This will be your public display name.</span>
            </div>
            
            <div class="neumorphic-form-group">
                <label for="password" class="neumorphic-label">Password</label>
                
                <div class="neumorphic-input-wrapper">
                    <input type="password" id="password" class="neumorphic-input" placeholder="••••••••">
                    
                    <svg class="neumorphic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </div>
            </div>
            
            <!-- Elevated Button -->
            <button type="button" class="neumorphic-btn">Log In</button>
        </section>
    </main>
</body>
</html>
