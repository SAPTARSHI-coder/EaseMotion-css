<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Background: Pulsating Wave - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-pulse-page">
        <!-- Background Pulsating Wave Animation Layer -->
        <div class="em-pulse-bg" aria-hidden="true">
            <span class="em-pulse-ring em-ring-1" style="--d:0s;"></span>
            <span class="em-pulse-ring em-ring-2" style="--d:1s;"></span>
            <span class="em-pulse-ring em-ring-3" style="--d:2s;"></span>
        </div>

        <div class="em-card" role="region" aria-label="Pulsating Wave Background Showcase" tabindex="0">
            <span class="em-card-badge">BACKGROUND ANIMATIONS</span>
            <h1 class="em-card-title">Pulsating Wave</h1>
            <p class="em-card-desc">A smooth, hardware-accelerated pure CSS background animation featuring dynamic pulsating wave styling and dark mode compatibility.</p>
            <a href="#" class="em-card-btn" role="button">Explore Effects</a>
        </div>
    </div>
</body>
</html>
