<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Magnetic Pull Tabs - Creative Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="portfolio-container">
        <!-- Portfolio Header -->
        <header class="portfolio-header">
            <h1 class="logo">Studio<span>Zero</span></h1>
            <p>Creative Digital Experiences</p>
        </header>

        <!-- Magnetic Pull Tabs Component -->
        <div class="ease-magnetic-tabs">
            <!-- Visually Hidden State Inputs -->
            <input type="radio" id="tab-1" name="magnetic-group" class="sr-only" checked>
            <input type="radio" id="tab-2" name="magnetic-group" class="sr-only">
            <input type="radio" id="tab-3" name="magnetic-group" class="sr-only">
            
            <!-- Navigation -->
            <div class="tabs-nav-wrapper">
                <div class="tabs-nav" role="tablist">
                    <label for="tab-1" class="tab-label" role="tab" tabindex="0">Showcase</label>
                    <label for="tab-2" class="tab-label" role="tab" tabindex="0">Capabilities</label>
                    <label for="tab-3" class="tab-label" role="tab" tabindex="0">Get in touch</label>
                    <div class="tab-indicator"></div>
                </div>
            </div>
            
            <!-- Tab Contents -->
            <div class="tabs-content">
                <!-- Panel 1: Showcase -->
                <div class="tab-panel" id="panel-1" role="tabpanel">
                    <div class="project-grid">
                        <div class="project-card">
                            <div class="project-image img-1"></div>
                            <h3>Neon Flux</h3>
                            <p>Brand Identity & Web3</p>
                        </div>
                        <div class="project-card">
                            <div class="project-image img-2"></div>
                            <h3>Aura OS</h3>
                            <p>Interface Design</p>
                        </div>
                    </div>
                </div>
                
                <!-- Panel 2: Capabilities -->
                <div class="tab-panel" id="panel-2" role="tabpanel">
                    <div class="capabilities-content">
                        <h2>What I do</h2>
                        <ul class="skills-list">
                            <li>Creative Direction <span>✦</span></li>
                            <li>Interactive Web Design <span>✦</span></li>
                            <li>Motion Graphics <span>✦</span></li>
                            <li>3D Visualizations <span>✦</span></li>
                        </ul>
                    </div>
                </div>
                
                <!-- Panel 3: Contact -->
                <div class="tab-panel" id="panel-3" role="tabpanel">
                    <div class="contact-content">
                        <h2>Let's build something magnetic.</h2>
                        <a href="#" class="contact-btn">hello@studiozero.com</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
