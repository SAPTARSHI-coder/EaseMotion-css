<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notification Toasts - EaseMotion Submission</title>
  
  <!-- EaseMotion CSS Official CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container ease-fade-in">
    <h1>Notification Toasts</h1>
    <p>Hover over the cards to see the interactive scale effect.</p>
    
    <div class="toast-container">
      
      <!-- Success Toast -->
      <div class="toast toast-success ease-slide-in-right ease-delay-100 ease-hover-scale">
        <span class="icon">✅</span>
        <div class="toast-content">
          <strong>Success!</strong>
          <span>Your changes have been saved successfully.</span>
        </div>
      </div>

      <!-- Warning Toast -->
      <div class="toast toast-warning ease-slide-in-right ease-delay-300 ease-hover-scale">
        <span class="icon">⚠️</span>
        <div class="toast-content">
          <strong>Warning!</strong>
          <span>Your storage is almost full. Please upgrade.</span>
        </div>
      </div>

      <!-- Error Toast -->
      <div class="toast toast-error ease-slide-in-right ease-delay-500 ease-hover-scale">
        <span class="icon">❌</span>
        <div class="toast-content">
          <strong>Error!</strong>
          <span>Failed to connect to the server. Try again.</span>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
