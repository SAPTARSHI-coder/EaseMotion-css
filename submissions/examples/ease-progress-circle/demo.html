<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Circular Progress Vector Components</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Metric Dashboard Grid Layout Area -->
  <main class="dashboard-showcase">
    
    <!-- Component Element 1: Systems Storage -->
    <section class="progress-card">
      <h3>System Storage</h3>
      <div class="ease-progress-circle" style="--ease-progress-value: 75; --ease-progress-color: #2563eb;">
        <svg viewBox="0 0 100 100">
          <circle class="progress-track" cx="50" cy="50" r="40"></circle>
          <circle class="progress-fill" cx="50" cy="50" r="40"></circle>
        </svg>
        <span class="progress-label">75%</span>
      </div>
    </section>

    <!-- Component Element 2: Processing Core -->
    <section class="progress-card">
      <h3>Core Workload</h3>
      <div class="ease-progress-circle" style="--ease-progress-value: 42; --ease-progress-color: #10b981; --ease-progress-duration: 0.6s;">
        <svg viewBox="0 0 100 100">
          <circle class="progress-track" cx="50" cy="50" r="40"></circle>
          <circle class="progress-fill" cx="50" cy="50" r="40"></circle>
        </svg>
        <span class="progress-label">42%</span>
      </div>
    </section>

    <!-- Component Element 3: Memory Thrashing Warning Threshold -->
    <section class="progress-card">
      <h3>Memory Peak</h3>
      <div class="ease-progress-circle" style="--ease-progress-value: 91; --ease-progress-color: #ef4444; --ease-progress-duration: 1.2s;">
        <svg viewBox="0 0 100 100">
          <circle class="progress-track" cx="50" cy="50" r="40"></circle>
          <circle class="progress-fill" cx="50" cy="50" r="40"></circle>
        </svg>
        <span class="progress-label">91%</span>
      </div>
    </section>

  </main>

</body>
</html>
