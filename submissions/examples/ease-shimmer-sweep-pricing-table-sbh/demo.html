<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ease-shimmer-sweep-pricing-table — Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <header class="page__intro">
      <h1>ease-shimmer-sweep-pricing-table</h1>
      <p>Pricing cards whose selected plan gets a sweeping shimmer highlight band.</p>
    </header>

    <section class="pricing" aria-label="Pricing plans">
      <input type="radio" name="ssp" id="ssp-1" class="plan-toggle" checked aria-hidden="true" />
      <input type="radio" name="ssp" id="ssp-2" class="plan-toggle" aria-hidden="true" />
      <input type="radio" name="ssp" id="ssp-3" class="plan-toggle" aria-hidden="true" />

      <label for="ssp-1" class="plan" tabindex="0" aria-label="Starter plan, $9 per month">
        <span class="plan__shimmer" aria-hidden="true"></span>
        <span class="plan__name">Starter</span>
        <span class="plan__price"><span class="plan__cur">$</span>9<span class="plan__per">/mo</span></span>
        <ul class="plan__features">
          <li>5 projects</li>
          <li>2 GB storage</li>
          <li>Community support</li>
        </ul>
      </label>

      <label for="ssp-2" class="plan" tabindex="0" aria-label="Pro plan, $29 per month, recommended">
        <span class="plan__shimmer" aria-hidden="true"></span>
        <span class="plan__badge">Recommended</span>
        <span class="plan__name">Pro</span>
        <span class="plan__price"><span class="plan__cur">$</span>29<span class="plan__per">/mo</span></span>
        <ul class="plan__features">
          <li>Unlimited projects</li>
          <li>50 GB storage</li>
          <li>Priority support</li>
        </ul>
      </label>

      <label for="ssp-3" class="plan" tabindex="0" aria-label="Enterprise plan, custom pricing">
        <span class="plan__shimmer" aria-hidden="true"></span>
        <span class="plan__name">Enterprise</span>
        <span class="plan__price">Custom</span>
        <ul class="plan__features">
          <li>SSO &amp; SAML</li>
          <li>Audit logs</li>
          <li>Dedicated manager</li>
        </ul>
      </label>
    </section>

    <p class="hint">Click a card (or focus) to select; a shimmer sweeps across it.</p>
  </main>
</body>
</html>
