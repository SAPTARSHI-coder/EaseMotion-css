<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Micro-interactions: Pulsating Wave</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header class="header">
            <h1>Pulsating Wave</h1>
            <p>Pure CSS hardware-accelerated ripple and sonar micro-interactions.</p>
        </header>

        <main class="grid">
            
            <!-- Sonar Button -->
            <section class="demo-section">
                <div class="demo-content">
                    <h2>Sonar Ping Button</h2>
                    <p>Click to emit an interactive ripple wave.</p>
                    
                    <div class="component-box dark-box">
                        <button class="btn btn-sonar">
                            <span class="btn-text">Transmit Signal</span>
                            <!-- Hidden checkbox hack to trigger the ripple on click -->
                            <input type="checkbox" class="sonar-trigger">
                            <div class="ripple"></div>
                        </button>
                    </div>
                </div>
            </section>

            <!-- Live Status Indicator -->
            <section class="demo-section">
                <div class="demo-content">
                    <h2>Live Status Dot</h2>
                    <p>Infinite pulsating waves for active state indication.</p>
                    
                    <div class="component-box dark-box">
                        <div class="status-indicator">
                            <div class="status-core"></div>
                            <div class="status-wave wave-1"></div>
                            <div class="status-wave wave-2"></div>
                        </div>
                        <span class="status-text">SYSTEM ONLINE</span>
                    </div>
                </div>
            </section>

            <!-- Concentric Avatar -->
            <section class="demo-section">
                <div class="demo-content">
                    <h2>Resonance Avatar</h2>
                    <p>Hover to emit concentric background waves.</p>
                    
                    <div class="component-box dark-box">
                        <div class="avatar-container">
                            <img src="https://i.pravatar.cc/150?img=68" alt="User Avatar" class="avatar-img">
                            <div class="resonance-ring r1"></div>
                            <div class="resonance-ring r2"></div>
                            <div class="resonance-ring r3"></div>
                        </div>
                    </div>
                </div>
            </section>
            
        </main>
    </div>

</body>
</html>
