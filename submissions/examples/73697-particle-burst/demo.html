<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Pure CSS 3D Particle Burst Effect"
  >
  <title>3D Particle Burst</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scene" aria-label="3D Particle Burst animation">
    <div class="burst" aria-hidden="true">
      <span class="particle p1"></span>
      <span class="particle p2"></span>
      <span class="particle p3"></span>
      <span class="particle p4"></span>
      <span class="particle p5"></span>
      <span class="particle p6"></span>
      <span class="particle p7"></span>
      <span class="particle p8"></span>
      <span class="particle p9"></span>
      <span class="particle p10"></span>
      <span class="particle p11"></span>
      <span class="particle p12"></span>

      <div class="core">
        <span></span>
      </div>
    </div>

    <section class="content">
      <p class="eyebrow">CSS 3D EFFECT</p>
      <h1>Particle Burst</h1>
      <p>
        A lightweight three-dimensional particle burst created entirely
        with HTML and vanilla CSS.
      </p>
      <button type="button">Explore Effect</button>
    </section>
  </main>
</body>
</html>
