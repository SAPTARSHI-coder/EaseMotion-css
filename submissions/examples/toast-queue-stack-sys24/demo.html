<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notification Toast Queue Stack with Auto-Dismiss Progress Bar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../easemotion.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Toast Queue Stack</h1>
      <p>Floating toast notifications with auto-dismiss progress indicators.</p>
      <button class="btn" onclick="addToast()">Trigger Notification</button>
    </header>

    <div class="toast-stack" id="toastStack"></div>
  </div>

  <script>
    function addToast() {
      const stack = document.getElementById('toastStack');
      const toast = document.createElement('div');
      toast.className = 'toast-card';
      toast.innerHTML = `
        <div class="toast-content">Notification Item #${Math.floor(Math.random()*100)}</div>
        <div class="toast-progress"></div>
      `;
      stack.prepend(toast);
      setTimeout(() => toast.remove(), 4000);
    }
  </script>
</body>
</html>
