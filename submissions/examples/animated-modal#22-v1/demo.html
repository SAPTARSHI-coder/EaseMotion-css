<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated Modal - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Pure CSS modal state -->
  <input
    type="checkbox"
    id="modal-state"
    class="modal-state"
    aria-label="Toggle modal"
  />

  <main class="modal-page">

    <header class="modal-header">
      <span class="section-pill">UI Component</span>
      <h1>Animated Modal</h1>
      <p>
        A modern animated modal popup built with pure HTML and CSS.
        Click the button below to open it.
      </p>
    </header>

    <div class="modal-trigger-wrap">
      <label for="modal-state" class="open-modal-btn">
        Open Modal
      </label>
    </div>

  </main>

  <div class="modal-overlay">

    <label for="modal-state" class="modal-backdrop"></label>

    <section
      class="modal-card"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
    >

      <label for="modal-state" class="modal-close">
        ×
      </label>

      <span class="modal-pill">Modal</span>

      <h2 id="modal-title">Pure CSS Modal</h2>

      <p>
        This modal is built with pure HTML and CSS. It includes smooth
        open animation, blurred background overlay, and a clean card layout.
      </p>

      <div class="modal-actions">
        <label for="modal-state" class="modal-btn primary">
          Continue
        </label>

        <label for="modal-state" class="modal-btn ghost">
          Cancel
        </label>
      </div>

    </section>

  </div>

</body>
</html>
