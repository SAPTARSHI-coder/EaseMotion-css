<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-scroll-fade-navbar-shrink-sap demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f4f4f5; }
    .content { max-width: 640px; margin: 0 auto; padding: 40px 24px 300px; line-height: 1.7; color: #444; }
  </style>
</head>
<body>
  <header class="shrink-navbar-sap" id="navbar">
    <div>
      <div class="logo">Brand</div>
      <div class="tagline">Build something great</div>
    </div>
    <nav>Menu</nav>
  </header>
  <div class="content">
    <h1>Scroll to shrink the navbar</h1>
    <p>The tagline fades out and the logo shrinks as the header compacts on scroll.</p>
    <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt.</p>
  </div>
  <script>
    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', () => {
      navbar.classList.toggle('shrunk', window.scrollY > 50);
    }, { passive: true });
  </script>
</body>
</html>
