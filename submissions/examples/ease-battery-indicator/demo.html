<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Battery Indicator · Charging Animation</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="card">
        <h2>🔋 Battery Indicator</h2>
        <p class="sub">charges up like a battery</p>

        <!-- === BATTERY INDICATOR === -->
        <div class="battery-container">
            <div class="battery">
                <!-- Battery body -->
                <div class="battery-body">
                    <div class="battery-fill" id="batteryFill">
                        <div class="battery-wave"></div>
                    </div>
                    <div class="battery-level" id="batteryLevel">0%</div>
                </div>
                <!-- Battery terminal -->
                <div class="battery-terminal"></div>

                <!-- Lightning bolt icon -->
                <div class="battery-icon">
                    <i class="fas fa-bolt"></i>
                </div>
            </div>

            <!-- Controls -->
            <div class="battery-controls">
                <button class="battery-btn charge" id="chargeBtn">
                    <i class="fas fa-bolt"></i> Charge
                </button>
                <button class="battery-btn drain" id="drainBtn">
                    <i class="fas fa-battery-empty"></i> Drain
                </button>
                <button class="battery-btn reset" id="resetBtn">
                    <i class="fas fa-undo"></i> Reset
                </button>
            </div>

            <!-- Status -->
            <div class="battery-status">
                <span class="status-text" id="statusText">Ready</span>
                <span class="status-dot" id="statusDot"></span>
            </div>
        </div>

        <p style="margin-top: 2rem; font-size: 0.85rem; color: #64748b;">
            Click Charge · watch the battery fill up
        </p>
    </div>

    <!-- Embedded JavaScript -->
    <script>
        (function() {
            'use strict';

            const fill = document.getElementById('batteryFill');
            const level = document.getElementById('batteryLevel');
            const statusText = document.getElementById('statusText');
            const statusDot = document.getElementById('statusDot');
            const chargeBtn = document.getElementById('chargeBtn');
            const drainBtn = document.getElementById('drainBtn');
            const resetBtn = document.getElementById('resetBtn');

            let currentLevel = 0;
            let isCharging = false;
            let isDraining = false;
            let animationId = null;

            // --- Update battery display ---
            function updateBattery(level) {
                const clampedLevel = Math.min(Math.max(level, 0), 100);
                fill.style.height = clampedLevel + '%';
                level.textContent = Math.round(clampedLevel) + '%';

                // Update color based on level
                if (clampedLevel < 20) {
                    fill.style.background = 'linear-gradient(180deg, #ef4444, #dc2626)';
                    statusDot.style.background = '#ef4444';
                } else if (clampedLevel < 50) {
                    fill.style.background = 'linear-gradient(180deg, #f59e0b, #d97706)';
                    statusDot.style.background = '#f59e0b';
                } else if (clampedLevel < 80) {
                    fill.style.background = 'linear-gradient(180deg, #4facfe, #0066ff)';
                    statusDot.style.background = '#4facfe';
                } else {
                    fill.style.background = 'linear-gradient(180deg, #43e97b, #10b981)';
                    statusDot.style.background = '#43e97b';
                }

                // Update wave position
                const wave = document.querySelector('.battery-wave');
                if (wave) {
                    wave.style.top = (100 - clampedLevel) + '%';
                }

                currentLevel = clampedLevel;
            }

            // --- Charge animation ---
            function chargeBattery() {
                if (isCharging || isDraining) return;
                if (currentLevel >= 100) {
                    statusText.textContent = 'Fully Charged!';
                    statusDot.style.background = '#43e97b';
                    return;
                }

                isCharging = true;
                statusText.textContent = 'Charging...';
                statusDot.style.background = '#4facfe';
                statusDot.style.animation = 'dotPulse 0.5s ease-in-out infinite';

                const startLevel = currentLevel;
                const targetLevel = 100;
                const duration = 2000;
                const startTime = performance.now();

                function animateCharge(time) {
                    const elapsed = time - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    // Ease in-out cubic
                    const eased = progress < 0.5 ? 4 * progress * progress * progress : 1 - Math.pow(-2 * progress + 2, 3) / 2;
                    const newLevel = startLevel + (targetLevel - startLevel) * eased;
                    updateBattery(newLevel);

                    if (progress < 1) {
                        animationId = requestAnimationFrame(animateCharge);
                    } else {
                        updateBattery(100);
                        isCharging = false;
                        statusText.textContent = 'Fully Charged!';
                        statusDot.style.background = '#43e97b';
                        statusDot.style.animation = 'none';
                        console.log('🔋 Battery fully charged!');
                    }
                }

                animationId = requestAnimationFrame(animateCharge);
            }

            // --- Drain animation ---
            function drainBattery() {
                if (isCharging || isDraining) return;
                if (currentLevel <= 0) {
                    statusText.textContent = 'Empty!';
                    statusDot.style.background = '#ef4444';
                    return;
                }

                isDraining = true;
                statusText.textContent = 'Draining...';
                statusDot.style.background = '#ef4444';
                statusDot.style.animation = 'dotPulse 0.5s ease-in-out infinite';

                const startLevel = currentLevel;
                const targetLevel = 0;
                const duration = 1500;
                const startTime = performance.now();

                function animateDrain(time) {
                    const elapsed = time - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const eased = progress < 0.5 ? 4 * progress * progress * progress : 1 - Math.pow(-2 * progress + 2, 3) / 2;
                    const newLevel = startLevel - (startLevel - targetLevel) * eased;
                    updateBattery(newLevel);

                    if (progress < 1) {
                        animationId = requestAnimationFrame(animateDrain);
                    } else {
                        updateBattery(0);
                        isDraining = false;
                        statusText.textContent = 'Empty!';
                        statusDot.style.background = '#ef4444';
                        statusDot.style.animation = 'none';
                        console.log('🔋 Battery drained!');
                    }
                }

                animationId = requestAnimationFrame(animateDrain);
            }

            // --- Reset battery ---
            function resetBattery() {
                if (isCharging || isDraining) {
                    if (animationId) {
                        cancelAnimationFrame(animationId);
                        animationId = null;
                    }
                    isCharging = false;
                    isDraining = false;
                }
                updateBattery(0);
                statusText.textContent = 'Reset';
                statusDot.style.background = '#94a3b8';
                statusDot.style.animation = 'none';
                console.log('🔋 Battery reset');
            }

            // --- Set battery level (for testing) ---
            function setBattery(level) {
                if (isCharging || isDraining) {
                    if (animationId) {
                        cancelAnimationFrame(animationId);
                        animationId = null;
                    }
                    isCharging = false;
                    isDraining = false;
                }
                updateBattery(level);
                statusText.textContent = 'Set to ' + Math.round(level) + '%';
                if (level >= 100) {
                    statusText.textContent = 'Fully Charged!';
                } else if (level <= 0) {
                    statusText.textContent = 'Empty!';
                }
                console.log('🔋 Battery set to ' + Math.round(level) + '%');
            }

            // --- Event Listeners ---
            chargeBtn.addEventListener('click', chargeBattery);
            drainBtn.addEventListener('click', drainBattery);
            resetBtn.addEventListener('click', resetBattery);

            // Keyboard shortcuts
            document.addEventListener('keydown', function(e) {
                if (e.key === 'c' || e.key === 'C') {
                    chargeBattery();
                } else if (e.key === 'd' || e.key === 'D') {
                    drainBattery();
                } else if (e.key === 'r' || e.key === 'R') {
                    resetBattery();
                } else if (e.key >= '0' && e.key <= '9') {
                    const val = parseInt(e.key) * 10;
                    setBattery(val);
                }
            });

            // --- Initial state ---
            updateBattery(0);
            statusText.textContent = 'Ready';
            statusDot.style.background = '#94a3b8';

            console.log('🔋 Battery indicator initialized!');

        })();
    </script>

</body>
</html>
