<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jacquard Shuttle Lift — EaseMotion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Jacquard Shuttle Lift demo">
    <header class="stage-head">
      <p class="eyebrow">EaseMotion submission</p>
      <h1>Jacquard Shuttle Lift</h1>
      <p class="lede">Jacquard loom shuttle lifting through warp threads</p>
    </header>

    <section class="ease-jacquard-shuttle-lift" data-demo="jacquard-shuttle-lift" aria-live="polite">
      <div class="ease-jacquard-shuttle-lift__housing">
        <div class="ease-jacquard-shuttle-lift__bezel">
          <div class="ease-jacquard-shuttle-lift__face">
            <div class="ease-jacquard-shuttle-lift__readout">
              <span class="ease-jacquard-shuttle-lift__label">Jacquard Shuttle Lift</span>
              <span class="ease-jacquard-shuttle-lift__value">LIVE</span>
            </div>
            <div class="ease-jacquard-shuttle-lift__motion" aria-hidden="true">
              <span class="ease-jacquard-shuttle-lift__a"></span>
              <span class="ease-jacquard-shuttle-lift__b"></span>
              <span class="ease-jacquard-shuttle-lift__c"></span>
              <span class="ease-jacquard-shuttle-lift__d"></span>
            </div>
            <div class="ease-jacquard-shuttle-lift__meters">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
        <div class="ease-jacquard-shuttle-lift__controls">
          <button type="button" class="ease-jacquard-shuttle-lift__btn primary">Engage</button>
          <button type="button" class="ease-jacquard-shuttle-lift__btn">Reset</button>
          <label class="ease-jacquard-shuttle-lift__switch">
            <input type="checkbox" checked>
            <span>Live</span>
          </label>
        </div>
      </div>
      <footer class="ease-jacquard-shuttle-lift__status">
        <span class="dot"></span>
        CSS-only motion — no JavaScript required for the effect
      </footer>
    </section>
  </main>
</body>
</html>
