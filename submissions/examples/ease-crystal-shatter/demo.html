<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crystal Shatter – Glass Shatters and Reforms on Click</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1>💎 Crystal Shatter</h1>
    <p class="subtitle">Glass shatters and reforms on click</p>

    <div class="crystal-container">
      <div class="crystal-stage" id="crystalStage">
        <canvas id="canvas"></canvas>
        
        <!-- Info overlay -->
        <div class="info-overlay">
          <span class="crystal-status" id="crystalStatus">💎 Intact</span>
          <span class="shard-count" id="shardCount">✦ 0 shards</span>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn shatter" id="shatterBtn">💥 Shatter</button>
      <button class="ctrl-btn reform" id="reformBtn">🔄 Reform</button>
      <button class="ctrl-btn toggle" id="toggleBtn">💡 Toggle</button>
      <button class="ctrl-btn reset" id="resetBtn">↺ Reset</button>
    </div>

    <!-- Sliders -->
    <div class="slider-container">
      <span class="slider-label">Shatter Force</span>
      <input type="range" id="forceSlider" min="1" max="10" value="5" />
      <span class="slider-value" id="forceValue">5×</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Shard Size</span>
      <input type="range" id="sizeSlider" min="20" max="80" value="40" />
      <span class="slider-value" id="sizeValue">40%</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Reform Speed</span>
      <input type="range" id="speedSlider" min="1" max="10" value="5" />
      <span class="slider-value" id="speedValue">5×</span>
    </div>

    <!-- Status -->
    <div class="status" id="status">💎 Click Shatter or the crystal to break it!</div>

    <!-- Keyboard shortcuts -->
    <div class="shortcuts">
      <kbd>Click</kbd> Shatter · <kbd>S</kbd> Shatter · <kbd>R</kbd> Reform · <kbd>T</kbd> Toggle
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM elements
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const crystalStatus = document.getElementById('crystalStatus');
      const shardCount = document.getElementById('shardCount');
      const shatterBtn = document.getElementById('shatterBtn');
      const reformBtn = document.getElementById('reformBtn');
      const toggleBtn = document.getElementById('toggleBtn');
      const resetBtn = document.getElementById('resetBtn');
      const status = document.getElementById('status');
      const forceSlider = document.getElementById('forceSlider');
      const forceValue = document.getElementById('forceValue');
      const sizeSlider = document.getElementById('sizeSlider');
      const sizeValue = document.getElementById('sizeValue');
      const speedSlider = document.getElementById('speedSlider');
      const speedValue = document.getElementById('speedValue');

      // State
      let shards = [];
      let crystalShards = [];
      let isShattered = false;
      let isActive = true;
      let animationId = null;
      let time = 0;
      let reforming = false;
      let reformProgress = 0;
      let targetReform = 0;

      // Crystal shape (diamond/crystal)
      const CRYSTAL_POINTS = [
        { x: 0, y: -80 },
        { x: 30, y: -40 },
        { x: 40, y: 0 },
        { x: 30, y: 40 },
        { x: 0, y: 80 },
        { x: -30, y: 40 },
        { x: -40, y: 0 },
        { x: -30, y: -40 }
      ];

      // ----- Canvas setup -----
      function setupCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        const size = Math.min(rect.width - 40, 600);
        canvas.width = size;
        canvas.height = size;
        canvas.style.width = size + 'px';
        canvas.style.height = size + 'px';
      }

      // ----- Shard class -----
      class Shard {
        constructor(x, y, angle, size, speed, color) {
          this.x = x;
          this.y = y;
          this.originX = x;
          this.originY = y;
          this.angle = angle;
          this.size = size;
          this.speed = speed;
          this.color = color;
          this.velocityX = Math.cos(angle) * speed * (0.5 + Math.random() * 0.5);
          this.velocityY = Math.sin(angle) * speed * (0.5 + Math.random() * 0.5);
          this.rotation = Math.random() * Math.PI * 2;
          this.rotationSpeed = (Math.random() - 0.5) * 0.05;
          this.opacity = 1;
          this.life = 1;
          this.gravity = 0.02 + Math.random() * 0.03;
          this.friction = 0.99;
          this.bounce = 0.4;
          this.isReturning = false;
          this.returnProgress = 0;
          this.points = this.generatePoints();
          this.shimmer = Math.random() * Math.PI * 2;
        }

        generatePoints() {
          const numPoints = 3 + Math.floor(Math.random() * 4);
          const pts = [];
          const s = this.size * (0.3 + Math.random() * 0.7);
          for (let i = 0; i < numPoints; i++) {
            const angle = (i / numPoints) * Math.PI * 2 + (Math.random() - 0.5) * 0.5;
            const r = s * (0.5 + Math.random() * 0.5);
            pts.push({ x: Math.cos(angle) * r, y: Math.sin(angle) * r });
          }
          return pts;
        }

        update(speedMult = 1, reformSpeed = 0) {
          if (this.isReturning) {
            // Return to origin
            this.returnProgress += 0.02 * speedMult * reformSpeed;
            if (this.returnProgress >= 1) {
              this.returnProgress = 1;
              this.x = this.originX;
              this.y = this.originY;
              this.velocityX = 0;
              this.velocityY = 0;
              this.opacity = 1;
              return;
            }
            
            const t = this.returnProgress;
            const ease = 1 - Math.pow(1 - t, 3); // easeOutCubic
            this.x = this.originX + (this.x - this.originX) * (1 - ease) + this.velocityX * 0.1 * (1 - t);
            this.y = this.originY + (this.y - this.originY) * (1 - ease) + this.velocityY * 0.1 * (1 - t);
            this.opacity = 0.5 + 0.5 * t;
            this.rotation += this.rotationSpeed * (1 - t);
            return;
          }

          // Apply physics
          this.velocityX *= this.friction;
          this.velocityY *= this.friction;
          this.velocityY += this.gravity;
          
          this.x += this.velocityX * speedMult;
          this.y += this.velocityY * speedMult;
          this.rotation += this.rotationSpeed * speedMult;
          
          // Boundary bounce
          const w = canvas.width;
          const h = canvas.height;
          const padding = 10;
          if (this.x < padding) { this.x = padding; this.velocityX = Math.abs(this.velocityX) * this.bounce; }
          if (this.x > w - padding) { this.x = w - padding; this.velocityX = -Math.abs(this.velocityX) * this.bounce; }
          if (this.y < padding) { this.y = padding; this.velocityY = Math.abs(this.velocityY) * this.bounce; }
          if (this.y > h - padding) { this.y = h - padding; this.velocityY = -Math.abs(this.velocityY) * this.bounce; }
          
          // Fade out slowly
          this.opacity *= 0.999;
          this.life -= 0.0005;
          
          this.shimmer += 0.02;
        }

        draw(ctx, isShattered) {
          if (this.opacity < 0.01) return;
          
          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.rotate(this.rotation);
          ctx.globalAlpha = this.opacity * 0.9;

          // Glow
          const glowSize = this.size * 2.5;
          const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, glowSize);
          const shimmer = 0.5 + 0.5 * Math.sin(this.shimmer + time);
          gradient.addColorStop(0, `rgba(200, 220, 255, ${0.1 * shimmer})`);
          gradient.addColorStop(1, `rgba(200, 220, 255, 0)`);
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(0, 0, glowSize, 0, Math.PI * 2);
          ctx.fill();

          // Shard body
          const color = this.color || `hsl(${200 + Math.random() * 40}, 80%, ${60 + Math.random() * 30}%)`;
          ctx.shadowColor = 'rgba(200, 220, 255, 0.2)';
          ctx.shadowBlur = 10;
          
          ctx.beginPath();
          const pts = this.points;
          for (let i = 0; i < pts.length; i++) {
            const p = pts[i];
            if (i === 0) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
          }
          ctx.closePath();

          // Fill with gradient
          const grad = ctx.createLinearGradient(-this.size, -this.size, this.size, this.size);
          const hue = 200 + this.shimmer * 20;
          const lightness = 50 + 30 * (0.5 + 0.5 * Math.sin(this.shimmer));
          grad.addColorStop(0, `hsla(${hue}, 80%, ${lightness + 20}%, 0.9)`);
          grad.addColorStop(0.5, `hsla(${hue + 20}, 70%, ${lightness}%, 0.8)`);
          grad.addColorStop(1, `hsla(${hue + 40}, 60%, ${lightness - 10}%, 0.6)`);
          ctx.fillStyle = grad;
          ctx.fill();

          // Edge highlight
          ctx.shadowBlur = 0;
          ctx.strokeStyle = `rgba(255, 255, 255, ${0.1 + 0.2 * (0.5 + 0.5 * Math.sin(this.shimmer + time))})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();

          // Inner sparkle
          if (this.size > 10) {
            ctx.fillStyle = `rgba(255, 255, 255, ${0.1 + 0.2 * (0.5 + 0.5 * Math.sin(this.shimmer * 2 + time))})`;
            ctx.beginPath();
            ctx.arc(this.size * 0.2, -this.size * 0.2, this.size * 0.15, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.restore();
        }

        startReturn() {
          this.isReturning = true;
          this.returnProgress = 0;
          this.opacity = 0.5;
        }
      }

      // ----- Create crystal -----
      function createCrystal() {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;
        const force = parseInt(forceSlider.value) / 2;
        const sizeMult = parseInt(sizeSlider.value) / 100;
        const scale = Math.min(w, h) * 0.08 * (0.5 + sizeMult * 0.5);

        // Scale crystal points
        const scaledPoints = CRYSTAL_POINTS.map(p => ({
          x: cx + p.x * scale,
          y: cy + p.y * scale
        }));

        // Create shards
        const numShards = 15 + Math.floor(Math.random() * 20);
        const shardsList = [];
        
        for (let i = 0; i < numShards; i++) {
          // Pick a point on the crystal edge
          const idx = Math.floor(Math.random() * scaledPoints.length);
          const nextIdx = (idx + 1) % scaledPoints.length;
          const t = Math.random();
          const x = scaledPoints[idx].x + (scaledPoints[nextIdx].x - scaledPoints[idx].x) * t;
          const y = scaledPoints[idx].y + (scaledPoints[nextIdx].y - scaledPoints[idx].y) * t;
          
          const angle = Math.atan2(y - cy, x - cx) + (Math.random() - 0.5) * 0.5;
          const speed = force * (0.5 + Math.random() * 0.5);
          const size = 8 + Math.random() * 20 * sizeMult;
          const hue = 200 + Math.random() * 40;
          const color = `hsl(${hue}, 80%, ${60 + Math.random() * 30}%)`;
          
          const shard = new Shard(x, y, angle, size, speed, color);
          shard.originX = x;
          shard.originY = y;
          shard.isReturning = false;
          shardsList.push(shard);
        }

        return shardsList;
      }

      // ----- Shatter crystal -----
      function shatterCrystal() {
        if (!isActive) return;
        if (isShattered) {
          // If already shattered, reform first then shatter again
          reformCrystal();
          setTimeout(() => {
            shatterCrystal();
          }, 500);
          return;
        }
        
        shards = createCrystal();
        isShattered = true;
        reforming = false;
        crystalStatus.textContent = '💥 Shattered';
        status.textContent = '💥 Crystal shattered into shards!';
        shardCount.textContent = `✦ ${shards.length} shards`;
      }

      // ----- Reform crystal -----
      function reformCrystal() {
        if (!isShattered) return;
        
        reforming = true;
        shards.forEach(shard => shard.startReturn());
        crystalStatus.textContent = '🔄 Reforming...';
        status.textContent = '🔄 Crystal reforming...';
        
        // Check completion after some time
        setTimeout(() => {
          reforming = false;
          isShattered = false;
          shards = [];
          crystalStatus.textContent = '💎 Intact';
          status.textContent = '💎 Crystal reformed!';
          shardCount.textContent = '✦ 0 shards';
        }, 1500 / (parseInt(speedSlider.value) / 5));
      }

      // ----- Toggle -----
      function toggleCrystal() {
        if (isShattered) {
          reformCrystal();
        } else {
          shatterCrystal();
        }
      }

      // ----- Reset -----
      function resetCrystal() {
        shards = [];
        isShattered = false;
        reforming = false;
        crystalStatus.textContent = '💎 Intact';
        status.textContent = '↺ Reset';
        shardCount.textContent = '✦ 0 shards';
        forceSlider.value = 5;
        forceValue.textContent = '5×';
        sizeSlider.value = 40;
        sizeValue.textContent = '40%';
        speedSlider.value = 5;
        speedValue.textContent = '5×';
        setTimeout(() => {
          status.textContent = '💎 Click Shatter or the crystal to break it!';
        }, 500);
      }

      // ----- Draw -----
      function draw() {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;
        const scale = Math.min(w, h) * 0.08;

        // Clear
        ctx.clearRect(0, 0, w, h);

        // Background
        const bgGradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, w * 0.8);
        bgGradient.addColorStop(0, '#0a0a1a');
        bgGradient.addColorStop(0.5, '#060612');
        bgGradient.addColorStop(1, '#020208');
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, w, h);

        // Draw shards
        if (shards.length > 0) {
          const speedMult = parseInt(speedSlider.value) / 5;
          const reformSpeed = parseInt(speedSlider.value) / 5;
          
          shards.forEach(shard => {
            shard.update(speedMult, reformSpeed);
            shard.draw(ctx, isShattered);
          });
          
          // Update shard count
          shardCount.textContent = `✦ ${shards.length} shards`;
        }

        // Draw intact crystal if not shattered and no shards
        if (!isShattered && shards.length === 0) {
          drawIntactCrystal(ctx, cx, cy, scale);
        }

        // Draw subtle glow behind center
        const centerGlow = ctx.createRadialGradient(cx, cy, 0, cx, cy, 30);
        centerGlow.addColorStop(0, 'rgba(200, 220, 255, 0.05)');
        centerGlow.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = centerGlow;
        ctx.beginPath();
        ctx.arc(cx, cy, 30, 0, Math.PI * 2);
        ctx.fill();
      }

      // ----- Draw intact crystal -----
      function drawIntactCrystal(ctx, cx, cy, scale) {
        const points = CRYSTAL_POINTS.map(p => ({
          x: cx + p.x * scale,
          y: cy + p.y * scale
        }));

        // Glow
        const glowGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, scale * 4);
        glowGrad.addColorStop(0, 'rgba(200, 220, 255, 0.05)');
        glowGrad.addColorStop(1, 'rgba(200, 220, 255, 0)');
        ctx.fillStyle = glowGrad;
        ctx.beginPath();
        ctx.arc(cx, cy, scale * 4, 0, Math.PI * 2);
        ctx.fill();

        // Crystal body
        ctx.save();
        ctx.shadowColor = 'rgba(200, 220, 255, 0.1)';
        ctx.shadowBlur = 30;

        ctx.beginPath();
        for (let i = 0; i < points.length; i++) {
          const p = points[i];
          if (i === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        }
        ctx.closePath();

        const grad = ctx.createLinearGradient(cx - scale * 2, cy - scale * 2, cx + scale * 2, cy + scale * 2);
        grad.addColorStop(0, 'rgba(200, 230, 255, 0.3)');
        grad.addColorStop(0.3, 'rgba(180, 210, 255, 0.5)');
        grad.addColorStop(0.7, 'rgba(150, 180, 255, 0.4)');
        grad.addColorStop(1, 'rgba(100, 150, 255, 0.2)');
        ctx.fillStyle = grad;
        ctx.fill();

        ctx.shadowBlur = 0;

        // Edges
        ctx.strokeStyle = 'rgba(200, 220, 255, 0.2)';
        ctx.lineWidth = 1;
        ctx.stroke();

        // Inner facets
        const facetPoints = [
          [0, 1, 2],
          [0, 2, 3],
          [0, 3, 4],
          [0, 4, 5],
          [0, 5, 6],
          [0, 6, 7],
          [0, 7, 1]
        ];
        
        facetPoints.forEach((indices, i) => {
          const hue = 200 + i * 10;
          ctx.beginPath();
          const p0 = points[indices[0]];
          const p1 = points[indices[1]];
          const p2 = points[indices[2]];
          ctx.moveTo(p0.x, p0.y);
          ctx.lineTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.closePath();
          ctx.fillStyle = `hsla(${hue}, 80%, 70%, ${0.05 + i * 0.01})`;
          ctx.fill();
          ctx.strokeStyle = `hsla(${hue}, 80%, 80%, 0.05)`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        });

        // Highlight
        ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
        ctx.beginPath();
        ctx.moveTo(cx - scale * 0.5, cy - scale * 0.8);
        ctx.quadraticCurveTo(cx + scale * 0.3, cy - scale * 0.4, cx + scale * 0.2, cy + scale * 0.2);
        ctx.quadraticCurveTo(cx - scale * 0.2, cy + scale * 0.1, cx - scale * 0.5, cy - scale * 0.8);
        ctx.fill();

        ctx.restore();
      }

      // ----- Animation loop -----
      function animate() {
        time += 0.016;
        draw();
        animationId = requestAnimationFrame(animate);
      }

      // ----- Start animation -----
      function startAnimation() {
        if (animationId) {
          cancelAnimationFrame(animationId);
        }
        animate();
      }

      // ----- Event Listeners -----
      // Click canvas to shatter/reform
      canvas.addEventListener('click', toggleCrystal);

      // Touch support
      canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        toggleCrystal();
      });

      // Buttons
      shatterBtn.addEventListener('click', shatterCrystal);
      reformBtn.addEventListener('click', reformCrystal);
      toggleBtn.addEventListener('click', toggleCrystal);
      resetBtn.addEventListener('click', resetCrystal);

      // Sliders
      forceSlider.addEventListener('input', (e) => {
        forceValue.textContent = e.target.value + '×';
      });

      sizeSlider.addEventListener('input', (e) => {
        sizeValue.textContent = e.target.value + '%';
      });

      speedSlider.addEventListener('input', (e) => {
        speedValue.textContent = e.target.value + '×';
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === 's' || e.key === 'S') {
          e.preventDefault();
          shatterCrystal();
        }
        if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          reformCrystal();
        }
        if (e.key === 't' || e.key === 'T') {
          e.preventDefault();
          toggleCrystal();
        }
        if (e.key === ' ' || e.key === 'Space') {
          e.preventDefault();
          toggleCrystal();
        }
      });

      // ----- Resize handler -----
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          setupCanvas();
        }, 200);
      });

      // ----- Init -----
      function init() {
        setupCanvas();
        startAnimation();
        status.textContent = '💎 Click Shatter or the crystal to break it!';
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
