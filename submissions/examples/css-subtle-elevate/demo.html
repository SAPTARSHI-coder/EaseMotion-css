<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Pure CSS subtle elevate background animation"
  >

  <title>CSS Subtle Elevate</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="elevate-scene">
    <div class="elevate-glow glow-one" aria-hidden="true"></div>
    <div class="elevate-glow glow-two" aria-hidden="true"></div>
    <div class="elevate-glow glow-three" aria-hidden="true"></div>

    <div class="elevate-orb orb-one" aria-hidden="true"></div>
    <div class="elevate-orb orb-two" aria-hidden="true"></div>
    <div class="elevate-orb orb-three" aria-hidden="true"></div>

    <section class="elevate-card">
      <span class="eyebrow">CSS Background Animation</span>

      <h1>Subtle Elevate</h1>

      <p>
        A calm floating background effect built entirely with
        HTML and vanilla CSS.
      </p>

      <div class="status">
        <span class="status-dot"></span>
        Smooth &amp; Lightweight
      </div>
    </section>
  </main>
</body>
</html>
