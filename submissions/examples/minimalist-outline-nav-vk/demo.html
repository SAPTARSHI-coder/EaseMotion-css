<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Minimalist outline navigation built with pure HTML and CSS.">
  <title>Minimalist Outline Navigation</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <nav class="outline-nav" aria-label="Main navigation">
      <a class="brand" href="#" aria-label="Outline home">
        <span class="brand-mark" aria-hidden="true">O</span>
        <span>Outline</span>
      </a>

      <ul class="nav-links">
        <li>
          <a class="nav-link active" href="#home" aria-current="page">
            <span>Home</span>
            <span class="link-arrow" aria-hidden="true">↗</span>
          </a>
        </li>

        <li>
          <a class="nav-link" href="#about">
            <span>About</span>
            <span class="link-arrow" aria-hidden="true">↗</span>
          </a>
        </li>

        <li>
          <a class="nav-link" href="#work">
            <span>Work</span>
            <span class="link-arrow" aria-hidden="true">↗</span>
          </a>
        </li>

        <li>
          <a class="nav-link" href="#contact">
            <span>Contact</span>
            <span class="link-arrow" aria-hidden="true">↗</span>
          </a>
        </li>
      </ul>

      <a class="nav-action" href="#contact">
        <span>Get started</span>
        <span aria-hidden="true">→</span>
      </a>
    </nav>

    <section class="hero" id="home" aria-labelledby="hero-title">
      <span class="eyebrow">MINIMALIST OUTLINE</span>

      <h1 id="hero-title">
        Less noise.
        <span>More direction.</span>
      </h1>

      <p>
        A lightweight navigation pattern built around clear outlines,
        subtle motion, and accessible interaction.
      </p>
    </section>
  </main>
</body>
</html>
