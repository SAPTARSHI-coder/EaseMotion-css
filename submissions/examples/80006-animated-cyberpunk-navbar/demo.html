<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Responsive animated cyberpunk navbar built with HTML and CSS."
  >

  <title>Cyberpunk Animated Navbar</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="cyber-navbar">
    <div class="navbar-inner">

      <a href="#" class="brand" aria-label="Neon Core home">
        <span class="brand-mark">N</span>
        <span class="brand-text">NEON<span>CORE</span></span>
      </a>

      <input
        type="checkbox"
        id="nav-toggle"
        class="nav-toggle"
        aria-label="Toggle navigation"
      >

      <label for="nav-toggle" class="menu-button" aria-label="Open navigation">
        <span></span>
        <span></span>
        <span></span>
      </label>

      <nav class="nav-links" aria-label="Main navigation">
        <a href="#home" class="nav-link active">
          <span class="nav-number">01</span>
          <span>Home</span>
        </a>

        <a href="#systems" class="nav-link">
          <span class="nav-number">02</span>
          <span>Systems</span>
        </a>

        <a href="#network" class="nav-link">
          <span class="nav-number">03</span>
          <span>Network</span>
        </a>

        <a href="#contact" class="nav-link">
          <span class="nav-number">04</span>
          <span>Contact</span>
        </a>
      </nav>

      <a href="#connect" class="connect-button">
        <span>CONNECT</span>
        <span class="button-arrow">↗</span>
      </a>

    </div>
  </header>

  <main class="hero" id="home">
    <div class="scan-lines"></div>

    <div class="hero-content">
      <p class="status-line">
        <span class="status-dot"></span>
        SYSTEM ONLINE
      </p>

      <h1>
        ENTER THE
        <span>NEON GRID</span>
      </h1>

      <p class="hero-description">
        A futuristic responsive navigation experience built entirely
        with semantic HTML and modern CSS.
      </p>

      <a href="#systems" class="hero-button">
        EXPLORE SYSTEM
        <span>→</span>
      </a>
    </div>
  </main>

</body>
</html>
