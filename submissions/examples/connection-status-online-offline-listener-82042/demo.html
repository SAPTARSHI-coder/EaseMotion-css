<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connection Status Monitor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Network Status</h1>

    <div id="status" class="status online">
      🟢 You are Online
    </div>

    <div class="buttons">
      <button onclick="setOnline()">Simulate Online</button>
      <button onclick="setOffline()">Simulate Offline</button>
    </div>
  </div>

  <script>
    const statusBox = document.getElementById("status");

    function updateStatus(isOnline) {
      if (isOnline) {
        statusBox.textContent = "🟢 You are Online";
        statusBox.className = "status online";
      } else {
        statusBox.textContent = "🔴 You are Offline";
        statusBox.className = "status offline";
      }
    }

    function setOnline() {
      updateStatus(true);
    }

    function setOffline() {
      updateStatus(false);
    }

    window.addEventListener("online", () => updateStatus(true));
    window.addEventListener("offline", () => updateStatus(false));

    updateStatus(navigator.onLine);
  </script>

</body>
</html>
