<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skeleton Shimmer Loader - EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css">
    <!-- Linking the main framework CSS -->
    <link rel="stylesheet" href="../../easemotion.css">
</head>
<body>
    <div class="demo-container">
        <h1>Skeleton Shimmer Loader</h1>
        <p class="subtitle">Useful for loading states (Zero JavaScript)</p>
        
        <!-- Skeleton UI Preview Card -->
        <div class="preview-card">
            <div class="header-row">
                <div class="ease-skeleton-pr avatar"></div>
                <div class="text-col">
                    <div class="ease-skeleton-pr line w-75"></div>
                    <div class="ease-skeleton-pr line w-50"></div>
                </div>
            </div>
            
            <div class="content-col">
                <div class="ease-skeleton-pr line w-100"></div>
                <div class="ease-skeleton-pr line w-90"></div>
                <div class="ease-skeleton-pr line w-80"></div>
            </div>

            <div class="ease-skeleton-pr btn"></div>
        </div>
    </div>
</body>
</html>
