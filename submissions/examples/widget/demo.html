<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Audio Player Widget Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Custom Audio Player Widget</h1>

    <section class="audio-player" id="audio-player" role="region" aria-label="Audio Player">
      <!-- Hidden Native Audio Source -->
      <audio id="native-audio" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" preload="metadata"></audio>

      <div class="audio-player__meta">
        <span class="audio-player__title" id="track-title">SoundHelix Song 1</span>
        <span class="audio-player__artist" id="track-artist">SoundHelix</span>
      </div>

      <div class="audio-player__controls">
        <!-- Play / Pause Button -->
        <button 
          type="button" 
          id="play-pause-btn" 
          class="audio-player__button audio-player__button--play" 
          aria-label="Play"
          aria-pressed="false"
        >
          <span class="audio-player__icon" aria-hidden="true">▶</span>
        </button>

        <!-- Timeline / Progress Bar -->
        <div class="audio-player__timeline">
          <span id="current-time" class="audio-player__time">0:00</span>
          <div class="audio-player__scrubber-wrapper">
            <input 
              type="range" 
              id="seek-bar" 
              class="audio-player__scrubber" 
              value="0" 
              min="0" 
              max="100" 
              step="0.1" 
              aria-label="Seek position" 
              aria-valuemin="0" 
              aria-valuemax="100" 
              aria-valuenow="0" 
              aria-valuetext="0 seconds"
            />
          </div>
          <span id="duration" class="audio-player__time">0:00</span>
        </div>

        <!-- Mute Toggle & Volume Controls -->
        <div class="audio-player__volume-group">
          <button 
            type="button" 
            id="mute-btn" 
            class="audio-player__button audio-player__button--mute" 
            aria-label="Mute" 
            aria-pressed="false"
          >
            <span id="mute-icon" class="audio-player__icon" aria-hidden="true">🔊</span>
          </button>
          <input 
            type="range" 
            id="volume-bar" 
            class="audio-player__volume-slider" 
            value="100" 
            min="0" 
            max="100" 
            step="1" 
            aria-label="Volume" 
            aria-valuemin="0" 
            aria-valuemax="100" 
            aria-valuenow="100" 
            aria-valuetext="100 percent"
          />
        </div>
      </div>
    </section>
  </main>

  <script>
    const audio = document.getElementById('native-audio');
    const playPauseBtn = document.getElementById('play-pause-btn');
    const playIcon = playPauseBtn.querySelector('.audio-player__icon');
    const seekBar = document.getElementById('seek-bar');
    const currentTimeEl = document.getElementById('current-time');
    const durationEl = document.getElementById('duration');
    const muteBtn = document.getElementById('mute-btn');
    const muteIcon = document.getElementById('mute-icon');
    const volumeBar = document.getElementById('volume-bar');

    function formatTime(seconds) {
      if (isNaN(seconds)) return '0:00';
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    playPauseBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        playPauseBtn.setAttribute('aria-label', 'Pause');
        playPauseBtn.setAttribute('aria-pressed', 'true');
        playIcon.textContent = '❚❚';
      } else {
        audio.pause();
        playPauseBtn.setAttribute('aria-label', 'Play');
        playPauseBtn.setAttribute('aria-pressed', 'false');
        playIcon.textContent = '▶';
      }
    });

    audio.addEventListener('loadedmetadata', () => {
      durationEl.textContent = formatTime(audio.duration);
      seekBar.max = audio.duration;
      seekBar.setAttribute('aria-valuemax', Math.floor(audio.duration));
    });

    audio.addEventListener('timeupdate', () => {
      seekBar.value = audio.currentTime;
      currentTimeEl.textContent = formatTime(audio.currentTime);
      seekBar.setAttribute('aria-valuenow', Math.floor(audio.currentTime));
      seekBar.setAttribute('aria-valuetext', `${formatTime(audio.currentTime)} of ${formatTime(audio.duration)}`);
    });

    seekBar.addEventListener('input', () => {
      audio.currentTime = seekBar.value;
    });

    muteBtn.addEventListener('click', () => {
      audio.muted = !audio.muted;
      const isMuted = audio.muted;
      muteBtn.setAttribute('aria-pressed', isMuted ? 'true' : 'false');
      muteBtn.setAttribute('aria-label', isMuted ? 'Unmute' : 'Mute');
      muteIcon.textContent = isMuted ? '🔇' : '🔊';
    });

    volumeBar.addEventListener('input', () => {
      audio.volume = volumeBar.value / 100;
      audio.muted = audio.volume === 0;
      volumeBar.setAttribute('aria-valuenow', volumeBar.value);
      volumeBar.setAttribute('aria-valuetext', `${volumeBar.value} percent`);
      muteIcon.textContent = audio.volume === 0 ? '🔇' : '🔊';
    });
  </script>
</body>
</html>
