<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Divider Spacing Consistency</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <section>
    <h2>Section One</h2>
    <p>
      This is the first content section. The divider below should maintain
      consistent spacing regardless of the viewport size.
    </p>
  </section>

  <hr class="divider">

  <section>
    <h2>Section Two</h2>
    <p>
      This is the second content section. The divider creates a balanced
      separation between the two sections.
    </p>
  </section>
</div>

</body>
</html>
