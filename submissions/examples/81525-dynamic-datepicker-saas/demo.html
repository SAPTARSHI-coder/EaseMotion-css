<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Dynamic SaaS modern datepicker built with pure HTML and CSS."
  >

  <title>Dynamic SaaS Datepicker</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="saas-page">
    <section
      class="datepicker-card"
      aria-labelledby="datepicker-title"
    >
      <div class="card-top">
        <div>
          <span class="section-label">
            SCHEDULE
          </span>

          <h1 id="datepicker-title">
            Select a date
          </h1>

          <p class="subtitle">
            Choose a date for your upcoming activity.
          </p>
        </div>

        <div
          class="calendar-icon"
          aria-hidden="true"
        >
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>

      <form class="datepicker-form">
        <div class="field">
          <label for="saas-date">
            Date
          </label>

          <div class="input-wrapper">
            <input
              id="saas-date"
              name="saas-date"
              type="date"
              required
              aria-describedby="date-description"
            >

            <span
              class="input-status"
              aria-hidden="true"
            ></span>
          </div>

          <p
            id="date-description"
            class="field-help"
          >
            Select your preferred date from the calendar.
          </p>
        </div>

        <div class="quick-dates">
          <span class="quick-title">
            QUICK SELECT
          </span>

          <div class="quick-options">
            <button
              type="button"
              class="quick-option"
            >
              Today
            </button>

            <button
              type="button"
              class="quick-option"
            >
              Tomorrow
            </button>

            <button
              type="button"
              class="quick-option"
            >
              Next week
            </button>
          </div>
        </div>

        <div class="form-footer">
          <span class="secure-note">
            <span
              class="secure-dot"
              aria-hidden="true"
            ></span>

            Date selection is secure
          </span>

          <button
            type="submit"
            class="continue-button"
          >
            Continue
            <span aria-hidden="true">→</span>
          </button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
