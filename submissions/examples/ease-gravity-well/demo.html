<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gravity Well – Creates Gravity Well Pulling Things In</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1>🌀 Gravity Well</h1>
    <p class="subtitle">Creates a gravity well pulling things in</p>

    <div class="gravity-container">
      <div class="gravity-stage" id="gravityStage">
        <canvas id="canvas"></canvas>
        
        <!-- Gravity well center -->
        <div class="gravity-center" id="gravityCenter">
          <div class="gravity-pulse"></div>
          <div class="gravity-core">
            <span class="gravity-icon">🌀</span>
          </div>
          <div class="gravity-ring" id="gravityRing"></div>
          <div class="gravity-ripple" id="gravityRipple"></div>
        </div>

        <!-- Info overlay -->
        <div class="info-overlay">
          <span class="gravity-status" id="gravityStatus">🌀 Active</span>
          <span class="particle-count" id="particleCount">✦ 0 particles</span>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn toggle" id="toggleBtn">⏸ Pause</button>
      <button class="ctrl-btn reset" id="resetBtn">↺ Reset</button>
      <button class="ctrl-btn burst" id="burstBtn">💥 Burst</button>
      <button class="ctrl-btn collapse" id="collapseBtn">🌀 Collapse</button>
    </div>

    <!-- Sliders -->
    <div class="slider-container">
      <span class="slider-label">Gravity Strength</span>
      <input type="range" id="strengthSlider" min="0" max="100" value="60" />
      <span class="slider-value" id="strengthValue">60%</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Event Horizon</span>
      <input type="range" id="horizonSlider" min="50" max="300" value="150" step="10" />
      <span class="slider-value" id="horizonValue">150px</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Particle Count</span>
      <input type="range" id="countSlider" min="10" max="80" value="40" step="5" />
      <span class="slider-value" id="countValue">40</span>
    </div>

    <div class="slider-container">
      <span class="slider-label">Color</span>
      <input type="range" id="colorSlider" min="0" max="360" value="220" />
      <span class="slider-value" id="colorValue">220°</span>
    </div>

    <!-- Status -->
    <div class="status" id="status">🌀 Gravity well pulling particles inward</div>

    <!-- Keyboard shortcuts -->
    <div class="shortcuts">
      <kbd>Space</kbd> Pause · <kbd>R</kbd> Reset · <kbd>B</kbd> Burst · <kbd>C</kbd> Collapse
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM elements
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const gravityStatus = document.getElementById('gravityStatus');
      const particleCount = document.getElementById('particleCount');
      const toggleBtn = document.getElementById('toggleBtn');
      const resetBtn = document.getElementById('resetBtn');
      const burstBtn = document.getElementById('burstBtn');
      const collapseBtn = document.getElementById('collapseBtn');
      const status = document.getElementById('status');
      const strengthSlider = document.getElementById('strengthSlider');
      const strengthValue = document.getElementById('strengthValue');
      const horizonSlider = document.getElementById('horizonSlider');
      const horizonValue = document.getElementById('horizonValue');
      const countSlider = document.getElementById('countSlider');
      const countValue = document.getElementById('countValue');
      const colorSlider = document.getElementById('colorSlider');
      const colorValue = document.getElementById('colorValue');

      // State
      let particles = [];
      let isPaused = false;
      let animationId = null;
      let time = 0;
      let isCollapsing = false;
      let collapseTimer = null;

      // ----- Canvas setup -----
      function setupCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        const size = Math.min(rect.width - 40, 600);
        canvas.width = size;
        canvas.height = size;
        canvas.style.width = size + 'px';
        canvas.style.height = size + 'px';
      }

      // ----- Particle class -----
      class Particle {
        constructor() {
          const w = canvas.width;
          const h = canvas.height;
          const cx = w / 2;
          const cy = h / 2;
          
          this.x = cx + (Math.random() - 0.5) * (w - 40);
          this.y = cy + (Math.random() - 0.5) * (h - 40);
          this.size = 2 + Math.random() * 5;
          this.mass = 0.5 + Math.random() * 0.5;
          this.vx = (Math.random() - 0.5) * 0.5;
          this.vy = (Math.random() - 0.5) * 0.5;
          this.hue = parseInt(colorSlider.value) + (Math.random() - 0.5) * 30;
          this.saturation = 80 + Math.random() * 20;
          this.lightness = 50 + Math.random() * 30;
          this.opacity = 0.3 + Math.random() * 0.5;
          this.alive = true;
          this.trail = [];
          this.trailLength = 8 + Math.floor(Math.random() * 12);
          this.phase = Math.random() * Math.PI * 2;
          this.wobble = 0;
          this.wobbleSpeed = 0.02 + Math.random() * 0.03;
          this.wobbleAmount = 0.2 + Math.random() * 0.5;
          this.orbitAngle = Math.random() * Math.PI * 2;
          this.orbitSpeed = 0.005 + Math.random() * 0.015;
          this.distance = Math.sqrt(
            Math.pow(this.x - cx, 2) + 
            Math.pow(this.y - cy, 2)
          );
          this.isInWell = false;
          this.gravityStrength = 0;
        }

        update(cx, cy, strength, horizon) {
          const dx = cx - this.x;
          const dy = cy - this.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const strengthFactor = strength / 100;

          // Gravity well effect
          if (dist < horizon && strengthFactor > 0) {
            this.isInWell = true;
            // Gravity force increases as distance decreases
            const force = (1 - dist / horizon) * strengthFactor * 0.06 * this.mass;
            const angle = Math.atan2(dy, dx);
            
            // Add tangential velocity for orbit
            const orbitForce = (1 - dist / horizon) * strengthFactor * 0.02;
            const perpAngle = angle + Math.PI / 2;
            
            this.vx += Math.cos(angle) * force;
            this.vy += Math.sin(angle) * force;
            // Orbit component
            this.vx += Math.cos(perpAngle) * orbitForce * (1 - dist / horizon);
            this.vy += Math.sin(perpAngle) * orbitForce * (1 - dist / horizon);
            
            this.gravityStrength = force;
            
            // Pull toward center when very close
            if (dist < 20) {
              this.vx += (cx - this.x) * 0.01;
              this.vy += (cy - this.y) * 0.01;
            }
          } else {
            this.isInWell = false;
            this.gravityStrength = 0;
          }

          // Random wander
          this.vx += (Math.random() - 0.5) * 0.02;
          this.vy += (Math.random() - 0.5) * 0.02;

          // Damping
          this.vx *= 0.98;
          this.vy *= 0.98;

          // Limit speed
          const maxSpeed = 4;
          const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
          if (speed > maxSpeed) {
            this.vx = (this.vx / speed) * maxSpeed;
            this.vy = (this.vy / speed) * maxSpeed;
          }

          // Wobble
          this.wobble += this.wobbleSpeed;
          this.x += this.vx + Math.sin(this.wobble + this.phase) * this.wobbleAmount * 0.02;
          this.y += this.vy + Math.cos(this.wobble * 0.7 + this.phase) * this.wobbleAmount * 0.02;

          // Trail
          this.trail.push({ x: this.x, y: this.y });
          if (this.trail.length > this.trailLength) {
            this.trail.shift();
          }

          // Keep within bounds with soft boundary
          const padding = 15;
          if (this.x < padding) { this.x = padding; this.vx = Math.abs(this.vx) * 0.5; }
          if (this.x > canvas.width - padding) { this.x = canvas.width - padding; this.vx = -Math.abs(this.vx) * 0.5; }
          if (this.y < padding) { this.y = padding; this.vy = Math.abs(this.vy) * 0.5; }
          if (this.y > canvas.height - padding) { this.y = canvas.height - padding; this.vy = -Math.abs(this.vy) * 0.5; }

          // Update distance for orbit
          this.distance = Math.sqrt(
            Math.pow(this.x - cx, 2) + 
            Math.pow(this.y - cy, 2)
          );
          
          // Size pulse based on gravity
          this.pulse = 1 + this.gravityStrength * 2;
        }

        draw(ctx) {
          const alpha = this.opacity * (0.5 + 0.5 * (this.isInWell ? 1 : 0.5));
          const size = this.size * this.pulse;

          // Trail
          if (this.trail.length > 1) {
            for (let i = 0; i < this.trail.length - 1; i++) {
              const t = i / this.trail.length;
              const trailAlpha = alpha * t * 0.15;
              const trailSize = size * t * 0.2;
              ctx.fillStyle = `hsla(${this.hue + 20}, 100%, 80%, ${trailAlpha})`;
              ctx.beginPath();
              ctx.arc(this.trail[i].x, this.trail[i].y, trailSize, 0, Math.PI * 2);
              ctx.fill();
            }
          }

          // Glow
          const glowSize = size * (4 + this.gravityStrength * 20);
          const gradient = ctx.createRadialGradient(
            this.x, this.y, 0,
            this.x, this.y, glowSize
          );
          const glowAlpha = alpha * 0.15 * (0.5 + 0.5 * (this.isInWell ? 1 : 0.3));
          gradient.addColorStop(0, `hsla(${this.hue + 20}, 100%, 90%, ${glowAlpha})`);
          gradient.addColorStop(0.5, `hsla(${this.hue + 10}, 100%, 70%, ${glowAlpha * 0.5})`);
          gradient.addColorStop(1, `hsla(${this.hue}, 100%, 50%, 0)`);
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(this.x, this.y, glowSize, 0, Math.PI * 2);
          ctx.fill();

          // Core
          const coreGrad = ctx.createRadialGradient(
            this.x - size * 0.2, this.y - size * 0.2, 0,
            this.x, this.y, size
          );
          coreGrad.addColorStop(0, `hsla(45, 100%, 95%, ${alpha * 0.9})`);
          coreGrad.addColorStop(0.3, `hsla(${this.hue + 20}, 100%, 85%, ${alpha * 0.8})`);
          coreGrad.addColorStop(0.7, `hsla(${this.hue}, 100%, 70%, ${alpha * 0.6})`);
          coreGrad.addColorStop(1, `hsla(${this.hue - 10}, 100%, 50%, ${alpha * 0.3})`);

          ctx.shadowColor = `hsla(${this.hue}, 100%, 60%, ${alpha * 0.1 * (0.5 + 0.5 * this.isInWell)})`;
          ctx.shadowBlur = 10;
          ctx.fillStyle = coreGrad;
          ctx.beginPath();
          ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;

          // Highlight
          if (this.isInWell) {
            ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.1 * this.pulse})`;
            ctx.beginPath();
            ctx.arc(this.x - size * 0.15, this.y - size * 0.2, size * 0.15, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      // ----- Generate particles -----
      function generateParticles(count) {
        particles = [];
        for (let i = 0; i < count; i++) {
          particles.push(new Particle());
        }
        particleCount.textContent = `✦ ${particles.length} particles`;
        countValue.textContent = particles.length;
      }

      // ----- Burst particles -----
      function burstParticles() {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;
        const count = 20 + Math.floor(Math.random() * 30);
        
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 2 + Math.random() * 5;
          const p = new Particle();
          p.x = cx + (Math.random() - 0.5) * 30;
          p.y = cy + (Math.random() - 0.5) * 30;
          p.vx = Math.cos(angle) * speed;
          p.vy = Math.sin(angle) * speed;
          p.size = 2 + Math.random() * 4;
          p.hue = parseInt(colorSlider.value) + (Math.random() - 0.5) * 30;
          particles.push(p);
        }
        
        particleCount.textContent = `✦ ${particles.length} particles`;
        status.textContent = `💥 Burst! ${count} particles!`;
        gravityStatus.textContent = '💥 Bursting!';
        
        setTimeout(() => {
          gravityStatus.textContent = '🌀 Active';
          status.textContent = '🌀 Gravity well pulling particles inward';
        }, 1500);
      }

      // ----- Collapse particles -----
      function collapseParticles() {
        if (isCollapsing) return;
        
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        
        isCollapsing = true;
        status.textContent = '🌀 Collapsing gravity well!';
        gravityStatus.textContent = '🌀 Collapsing!';
        
        particles.forEach(p => {
          const dx = cx - p.x;
          const dy = cy - p.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist > 5) {
            p.vx += (dx / dist) * 5;
            p.vy += (dy / dist) * 5;
          }
        });
        
        if (collapseTimer) clearTimeout(collapseTimer);
        collapseTimer = setTimeout(() => {
          isCollapsing = false;
          gravityStatus.textContent = '🌀 Active';
          status.textContent = '🌀 Gravity well pulling particles inward';
        }, 1500);
      }

      // ----- Draw background -----
      function drawBackground() {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;
        const horizon = parseInt(horizonSlider.value);
        const strength = parseInt(strengthSlider.value);
        const hue = parseInt(colorSlider.value);

        // Dark background
        const bgGradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, w * 0.7);
        bgGradient.addColorStop(0, '#0a0a1a');
        bgGradient.addColorStop(0.5, '#060612');
        bgGradient.addColorStop(1, '#020208');
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, w, h);

        // Gravity well visualization
        const wellAlpha = 0.02 + strength / 100 * 0.04;
        const wellGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, horizon);
        wellGrad.addColorStop(0, `hsla(${hue + 20}, 100%, 80%, ${wellAlpha * 0.5})`);
        wellGrad.addColorStop(0.5, `hsla(${hue + 10}, 100%, 60%, ${wellAlpha})`);
        wellGrad.addColorStop(1, `hsla(${hue}, 100%, 40%, 0)`);
        ctx.fillStyle = wellGrad;
        ctx.beginPath();
        ctx.arc(cx, cy, horizon, 0, Math.PI * 2);
        ctx.fill();

        // Event horizon ring
        const ringAlpha = 0.05 + strength / 100 * 0.05;
        ctx.strokeStyle = `hsla(${hue + 20}, 100%, 70%, ${ringAlpha})`;
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 10]);
        ctx.lineDashOffset = -time * 20;
        ctx.beginPath();
        ctx.arc(cx, cy, horizon, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);

        // Inner rings
        for (let i = 1; i <= 3; i++) {
          const r = horizon * (i / 4);
          const alpha = ringAlpha * (1 - i / 4);
          ctx.strokeStyle = `hsla(${hue + 20}, 100%, 60%, ${alpha})`;
          ctx.lineWidth = 0.5;
          ctx.setLineDash([3, 6]);
          ctx.lineDashOffset = -time * (10 + i * 5);
          ctx.beginPath();
          ctx.arc(cx, cy, r, 0, Math.PI * 2);
          ctx.stroke();
          ctx.setLineDash([]);
        }

        // Gravity well distortion lines
        const numLines = 12;
        for (let i = 0; i < numLines; i++) {
          const angle = (i / numLines) * Math.PI * 2 + time * 0.02;
          const alpha = 0.01 + strength / 100 * 0.02;
          ctx.strokeStyle = `hsla(${hue + 20}, 100%, 70%, ${alpha})`;
          ctx.lineWidth = 0.5;
          ctx.beginPath();
          ctx.moveTo(cx + Math.cos(angle) * 5, cy + Math.sin(angle) * 5);
          const r = horizon * (0.3 + 0.7 * (0.5 + 0.5 * Math.sin(angle * 2 + time)));
          ctx.lineTo(cx + Math.cos(angle) * r, cy + Math.sin(angle) * r);
          ctx.stroke();
        }

        // Center glow
        const centerGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 40);
        centerGrad.addColorStop(0, `hsla(${hue + 30}, 100%, 90%, ${0.05 + strength / 100 * 0.05})`);
        centerGrad.addColorStop(0.5, `hsla(${hue + 20}, 100%, 70%, ${0.02 + strength / 100 * 0.03})`);
        centerGrad.addColorStop(1, `hsla(${hue + 20}, 100%, 50%, 0)`);
        ctx.fillStyle = centerGrad;
        ctx.beginPath();
        ctx.arc(cx, cy, 40, 0, Math.PI * 2);
        ctx.fill();
      }

      // ----- Draw -----
      function draw() {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;
        const strength = parseInt(strengthSlider.value);
        const horizon = parseInt(horizonSlider.value);

        drawBackground();

        // Update particles
        if (!isPaused) {
          particles.forEach(p => p.update(cx, cy, strength, horizon));
        }

        // Draw particles (sorted by size for depth)
        const sortedParticles = [...particles].sort((a, b) => a.size - b.size);
        sortedParticles.forEach(p => p.draw(ctx));

        // Update status
        particleCount.textContent = `✦ ${particles.length} particles`;
        if (!isPaused) {
          gravityStatus.textContent = '🌀 Active';
        }
      }

      // ----- Animation loop -----
      function animate() {
        time += 0.016;
        draw();
        animationId = requestAnimationFrame(animate);
      }

      // ----- Start animation -----
      function startAnimation() {
        if (animationId) {
          cancelAnimationFrame(animationId);
        }
        animate();
      }

      // ----- Toggle pause -----
      function togglePause() {
        isPaused = !isPaused;
        toggleBtn.textContent = isPaused ? '▶ Play' : '⏸ Pause';
        status.textContent = isPaused ? '⏸ Paused' : '▶ Resumed';
        gravityStatus.textContent = isPaused ? '⏸ Paused' : '🌀 Active';
      }

      // ----- Reset -----
      function resetGravity() {
        isPaused = false;
        isCollapsing = false;
        toggleBtn.textContent = '⏸ Pause';
        gravityStatus.textContent = '🌀 Active';
        strengthSlider.value = 60;
        strengthValue.textContent = '60%';
        horizonSlider.value = 150;
        horizonValue.textContent = '150px';
        countSlider.value = 40;
        countValue.textContent = '40';
        colorSlider.value = 220;
        colorValue.textContent = '220°';
        const count = parseInt(countSlider.value);
        generateParticles(count);
        status.textContent = '↺ Reset';
        setTimeout(() => {
          status.textContent = '🌀 Gravity well pulling particles inward';
        }, 500);
      }

      // ----- Event Listeners -----
      toggleBtn.addEventListener('click', togglePause);
      resetBtn.addEventListener('click', resetGravity);
      burstBtn.addEventListener('click', burstParticles);
      collapseBtn.addEventListener('click', collapseParticles);

      strengthSlider.addEventListener('input', (e) => {
        strengthValue.textContent = e.target.value + '%';
      });

      horizonSlider.addEventListener('input', (e) => {
        horizonValue.textContent = e.target.value + 'px';
      });

      countSlider.addEventListener('input', (e) => {
        const val = parseInt(e.target.value);
        countValue.textContent = val;
        generateParticles(val);
        status.textContent = `✦ Particle count: ${val}`;
        setTimeout(() => {
          status.textContent = '🌀 Gravity well pulling particles inward';
        }, 1000);
      });

      colorSlider.addEventListener('input', (e) => {
        colorValue.textContent = e.target.value + '°';
        particles.forEach(p => {
          p.hue = parseInt(e.target.value) + (Math.random() - 0.5) * 30;
        });
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Space') {
          e.preventDefault();
          togglePause();
        }
        if (e.key === 'r' || e.key === 'R') {
          e.preventDefault();
          resetGravity();
        }
        if (e.key === 'b' || e.key === 'B') {
          e.preventDefault();
          burstParticles();
        }
        if (e.key === 'c' || e.key === 'C') {
          e.preventDefault();
          collapseParticles();
        }
      });

      // Click canvas to burst
      canvas.addEventListener('click', burstParticles);

      // ----- Resize handler -----
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          setupCanvas();
          const count = parseInt(countSlider.value);
          generateParticles(count);
        }, 200);
      });

      // ----- Init -----
      function init() {
        setupCanvas();
        const count = parseInt(countSlider.value);
        generateParticles(count);
        startAnimation();
        status.textContent = '🌀 Gravity well pulling particles inward!';
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
