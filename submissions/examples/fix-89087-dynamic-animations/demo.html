<div class="demo-container">
  <h1>Dynamic Animation Fix Demo</h1>
  <p>Wait 1 second for the box to animate dynamically!</p>
  
  <div id="demo" class="box">
    EaseMotion test
  </div>
</div>

<script>
  // Add animation dynamically after 1 second
  setTimeout(() => {
    document.getElementById("demo").classList.add("ease-fade-in", "ease-bounce");
  }, 1000);
</script>
