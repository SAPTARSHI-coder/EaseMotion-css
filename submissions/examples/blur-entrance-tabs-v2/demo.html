<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blur Entrance Tabs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="tabs-container">

    <input type="radio" name="tabs" id="tab1" checked>
    <input type="radio" name="tabs" id="tab2">
    <input type="radio" name="tabs" id="tab3">

    <div class="tab-buttons">
        <label for="tab1">About</label>
        <label for="tab2">Projects</label>
        <label for="tab3">Contact</label>
    </div>

    <div class="tab-content">
        <div class="content content1">
            <h2>About</h2>
            <p>Creative portfolio layouts with elegant CSS-only animations.</p>
        </div>

        <div class="content content2">
            <h2>Projects</h2>
            <p>Discover lightweight UI components built using pure HTML and CSS.</p>
        </div>

        <div class="content content3">
            <h2>Contact</h2>
            <p>Let's connect and create beautiful web experiences together.</p>
        </div>
    </div>

</div>

</body>
</html>
