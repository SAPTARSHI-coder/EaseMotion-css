<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>React Tooltip Component (Modern Corporate)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      background-color: #f8fafc; /* Very light slate */
      color: #0f172a;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
    }
    
    .demo-container {
      background: #ffffff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.025);
      border: 1px solid #e2e8f0;
      text-align: center;
      max-width: 500px;
    }
    
    .demo-title {
      margin: 0 0 16px;
      font-size: 1.25rem;
      font-weight: 600;
    }
    
    .demo-desc {
      color: #64748b;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 32px;
    }

    /* We embed a mock of the rendered React output here for the raw HTML demo */
  </style>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <div class="demo-container">
    <h2 class="demo-title">Data Privacy Compliance</h2>
    <p class="demo-desc">
      To view the specific compliance regulations relevant to your region, please hover over the action button below to reveal the tooltip interaction.
    </p>
    
    <!-- MOCK REACT RENDER OUTPUT FOR DEMO PURPOSES -->
    <div class="ease-corp-tooltip-wrapper">
      <!-- In React, this trigger would be passed as children -->
      <button class="ease-corp-tooltip-trigger" tabindex="0">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
        View Regulations
      </button>
      
      <!-- The Tooltip, hidden by default. In the HTML demo, we can toggle 'is-active' via CSS hover on wrapper to simulate React state -->
      <div class="ease-corp-tooltip" role="tooltip" aria-hidden="true">
        Compliance policies updated for Q3 2026.
      </div>
    </div>
  </div>

  <script>
    // Simple script to mimic the React component's behavior for the standalone demo
    const wrapper = document.querySelector('.ease-corp-tooltip-wrapper');
    const tooltip = document.querySelector('.ease-corp-tooltip');
    let timeout;

    const showTooltip = () => {
      timeout = setTimeout(() => {
        tooltip.classList.add('is-active');
        tooltip.setAttribute('aria-hidden', 'false');
      }, 100);
    };

    const hideTooltip = () => {
      clearTimeout(timeout);
      tooltip.classList.remove('is-active');
      tooltip.setAttribute('aria-hidden', 'true');
    };

    wrapper.addEventListener('mouseenter', showTooltip);
    wrapper.addEventListener('mouseleave', hideTooltip);
    
    const trigger = document.querySelector('.ease-corp-tooltip-trigger');
    trigger.addEventListener('focus', showTooltip);
    trigger.addEventListener('blur', hideTooltip);
  </script>

</body>
</html>
