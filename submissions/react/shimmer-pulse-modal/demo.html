<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>React Shimmer Pulse Modal Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="./style.css">

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 2rem;
      background: #f8fafc;

      display: flex;
      justify-content: center;
      align-items: center;

      min-height: 100vh;

      box-sizing: border-box;
    }

    #root {
      width: 100%;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .demo-container {
      text-align: center;
      max-width: 600px;

      font-family: system-ui, -apple-system, sans-serif;
    }

    .demo-container h1 {
      color: #1e293b;
      margin-bottom: 0.5rem;
    }

    .demo-container p {
      color: #64748b;
      margin-bottom: 2rem;
    }

    .demo-button {
      padding: 0.75rem 1.5rem;

      border: none;
      border-radius: 999px;

      background: #2563eb;
      color: white;

      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>


<body>

<div id="root"></div>


<script type="text/babel">

const { useState, useEffect } = React;


/**
 * Shimmer Pulse Modal Component
 */

const ShimmerPulseModal = ({
  isOpen = false,
  onClose,
  title = "Modal",
  children,
  showClose = true,
  className = "",
}) => {


  useEffect(() => {

    const handleEscape = (event) => {

      if (event.key === "Escape" && isOpen) {
        onClose?.();
      }

    };


    document.addEventListener(
      "keydown",
      handleEscape
    );


    return () => {
      document.removeEventListener(
        "keydown",
        handleEscape
      );
    };

  }, [isOpen, onClose]);



  if (!isOpen) return null;



  return (

    <div
      className="ease-shimmer-modal-overlay ease-fade-in"
      onClick={onClose}
    >

      <div
        className={`ease-shimmer-modal ease-hover-shimmer ${className}`}
        role="dialog"
        aria-modal="true"
        onClick={(e) => e.stopPropagation()}
      >

        <div className="ease-shimmer-modal-header">

          <h2>
            {title}
          </h2>


          {showClose && (

            <button
              className="ease-shimmer-modal-close ease-hover-lift"
              onClick={onClose}
              aria-label="Close modal"
            >
              ×
            </button>

          )}

        </div>


        <div className="ease-shimmer-modal-content">

          {children}

        </div>


      </div>


    </div>

  );

};



const App = () => {

  const [open, setOpen] = useState(false);


  return (

    <div className="demo-container">


      <h1>
        Shimmer Pulse Modal
      </h1>


      <p>
        A React modal component with smooth shimmer interaction
        powered by EaseMotion CSS.
      </p>



      <button
        className="demo-button ease-hover-grow"
        onClick={() => setOpen(true)}
      >
        Open Modal
      </button>



      <ShimmerPulseModal

        isOpen={open}

        title="Welcome to EaseMotion"

        onClose={() => setOpen(false)}

      >

        <p>
          This modal combines smooth entrance motion,
          shimmer pulse effects, and accessible controls.
        </p>


      </ShimmerPulseModal>


    </div>

  );

};


ReactDOM.render(
  <App />,
  document.getElementById("root")
);


</script>

</body>
</html>
