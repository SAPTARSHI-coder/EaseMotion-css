<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Character Portfolio Cards</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="portfolio-container">
    
    <!-- Section Title -->
    <h1 class="portfolio-title">3D Character Showcase</h1>

    <div class="cards-wrapper">
      
      <!-- Card 1: Coraline Doll -->
      <div class="avatar-card theme-olive">
        <div class="window-header">
          <span class="character-title">Coraline</span>
          <div class="window-dots">
            <span class="window-dot dot-purple"></span>
            <span class="window-dot dot-yellow"></span>
            <span class="window-dot dot-yellow"></span>
          </div>
        </div>
        <div class="card-viewport">
          <iframe 
            title="Coraline Doll" 
            src="https://sketchfab.com/models/8a36759408a649839776c5a3d1cf6aa2/embed?autostart=1&ui_controls=0&ui_infos=0" 
            allow="autoplay; fullscreen; xr-spatial-tracking"
            class="sketchfab-iframe">
          </iframe>
        </div>
      </div>

      <!-- Card 2: Elsa -->
      <div class="avatar-card theme-yellow">
        <div class="window-header">
          <span class="character-title">Elsa</span>
          <div class="window-dots">
            <span class="window-dot dot-purple"></span>
            <span class="window-dot dot-yellow"></span>
            <span class="window-dot dot-yellow"></span>
          </div>
        </div>
        <div class="card-viewport">
          <iframe 
            title="Elsa Frozen Adventures" 
            src="https://sketchfab.com/models/9ea3f3fcbf7d404d8f2306af6973077d/embed?autostart=1&ui_controls=0&ui_infos=0" 
            allow="autoplay; fullscreen; xr-spatial-tracking"
            class="sketchfab-iframe">
          </iframe>
        </div>
      </div>

      <!-- Card 3: Daenerys -->
      <div class="avatar-card theme-purple">
        <div class="window-header">
          <span class="character-title">Daenerys</span>
          <div class="window-dots">
            <span class="window-dot dot-purple"></span>
            <span class="window-dot dot-yellow"></span>
            <span class="window-dot dot-yellow"></span>
          </div>
        </div>
        <div class="card-viewport">
          <iframe 
            title="Daenerys Warden of the North" 
            src="https://sketchfab.com/models/daa0697e1f384e2e858f1cb921653523/embed?autostart=1&ui_controls=0&ui_infos=0" 
            allow="autoplay; fullscreen; xr-spatial-tracking"
            class="sketchfab-iframe">
          </iframe>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
