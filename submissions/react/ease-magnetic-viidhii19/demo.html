<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MagneticButton Demo – ease-magnetic-viidhii19</title>

  <!-- EaseMotion CSS utilities -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SAPTARSHI-coder/EaseMotion-css@main/easemotion.min.css" />

  <!-- React 18 (UMD) -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel for in-browser JSX transpilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* ── Reset & base ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 2rem;
      background: #0d0d0d;
      font-family: system-ui, sans-serif;
      color: #e5e5e5;
    }

    /* ── Magnetic button styles ───────────────────────────── */
    .ease-magnetic-btn {
      /* Smooth return / follow transition */
      transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: transform;

      /* Visual styling */
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.875rem 2.5rem;
      border: none;
      border-radius: 9999px;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      color: #fff;
      font-size: 1.125rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow: 0 4px 24px rgba(124, 58, 237, 0.45);
    }

    .ease-magnetic-btn:focus-visible {
      outline: 3px solid #a78bfa;
      outline-offset: 4px;
    }

    .ease-magnetic-btn:hover {
      box-shadow: 0 8px 32px rgba(124, 58, 237, 0.65);
    }

    /* ── Instructions panel ───────────────────────────────── */
    .instructions {
      max-width: 360px;
      text-align: center;
      font-size: 0.9rem;
      color: #9ca3af;
      line-height: 1.6;
    }

    .instructions strong {
      color: #c4b5fd;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useRef } = React;

    /**
     * MagneticButton
     * Tracks cursor position relative to button center via getBoundingClientRect()
     * and moves the button by (strength * offset), snapping back on mouse leave.
     */
    const MagneticButton = ({ children, className = '', strength = 0.25, ...props }) => {
      const buttonRef = useRef(null);

      const handleMouseMove = (e) => {
        const btn = buttonRef.current;
        if (!btn) return;

        const rect = btn.getBoundingClientRect();

        // Distance from cursor to button center
        const x = e.clientX - rect.left - rect.width / 2;
        const y = e.clientY - rect.top - rect.height / 2;

        // Apply only a fraction of the distance for a subtle magnetic pull
        const translateX = x * strength;
        const translateY = y * strength;

        btn.style.transform = `translate(${translateX}px, ${translateY}px)`;
      };

      const handleMouseLeave = () => {
        const btn = buttonRef.current;
        if (!btn) return;
        // Smoothly return to the original position
        btn.style.transform = 'translate(0px, 0px)';
      };

      return (
        <button
          ref={buttonRef}
          className={`ease-magnetic-btn${className ? ` ${className}` : ''}`}
          onMouseMove={handleMouseMove}
          onMouseLeave={handleMouseLeave}
          {...props}
        >
          {children}
        </button>
      );
    };

    const App = () => (
      <>
        <MagneticButton aria-label="Magnetic hover demo button">
          ✦ Hover Me
        </MagneticButton>

        <p className="instructions">
          Move your cursor <strong>over the button</strong> to feel the magnetic
          pull. Move away and it <strong>snaps back</strong> smoothly.
          <br /><br />
          Powered by <strong>MagneticButton</strong> — uses{' '}
          <code>getBoundingClientRect()</code> + inline{' '}
          <code>transform: translate()</code>.
        </p>
      </>
    );

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
