<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>React View Transitions API Declarative Router Animator</title>
  <link rel="stylesheet" href="../../easemotion.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>React View Transitions Router</h1>
    <div class="view-card" id="pageCard">
      <h2>Page 1</h2>
      <p>Native View Transitions API transition.</p>
    </div>
    <button class="btn" onclick="navigatePage()">Navigate Page</button>
  </div>

  <script>
    let page = 1;
    function navigatePage() {
      if (document.startViewTransition) {
        document.startViewTransition(() => updatePage());
      } else {
        updatePage();
      }
    }
    function updatePage() {
      page = page === 1 ? 2 : 1;
      document.getElementById('pageCard').innerHTML = `<h2>Page ${page}</h2><p>Native View Transitions API transition.</p>`;
    }
  </script>
</body>
</html>
