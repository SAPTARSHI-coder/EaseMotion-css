<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Interactive CSS border-radius morph visualizer."
  >
  <title>Border Radius Morph Visualizer</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="visualizer">
    <section class="card" aria-labelledby="title">
      <p class="eyebrow">CSS Animation</p>

      <h1 id="title">Border Radius Morph</h1>

      <p class="description">
        Watch one element smoothly transform between different shapes
        using only CSS <code>border-radius</code>.
      </p>

      <div class="stage" aria-live="polite">
        <div class="shape" id="shape"></div>
      </div>

      <div class="shape-info">
        <span class="info-label">Current shape</span>
        <strong id="shapeName">Rounded Rectangle</strong>
      </div>

      <button class="replay-button" id="replayButton" type="button">
        <span aria-hidden="true">↻</span>
        Replay Animation
      </button>
    </section>
  </main>

  <script>
    const shape = document.getElementById("shape");
    const shapeName = document.getElementById("shapeName");
    const replayButton = document.getElementById("replayButton");

    const shapes = [
      "Rounded Rectangle",
      "Circle",
      "Pill",
      "Organic Blob"
    ];

    const animationDuration = 8000;
    let animationStart;

    function updateShapeName(timestamp) {
      if (!animationStart) {
        animationStart = timestamp;
      }

      const elapsed = (timestamp - animationStart) % animationDuration;
      const progress = elapsed / animationDuration;

      let index;

      if (progress < 0.25) {
        index = 0;
      } else if (progress < 0.5) {
        index = 1;
      } else if (progress < 0.75) {
        index = 2;
      } else {
        index = 3;
      }

      shapeName.textContent = shapes[index];
      requestAnimationFrame(updateShapeName);
    }

    function replayAnimation() {
      shape.classList.remove("is-animating");

      void shape.offsetWidth;

      animationStart = performance.now();
      shape.classList.add("is-animating");
    }

    replayButton.addEventListener("click", replayAnimation);

    shape.classList.add("is-animating");
    requestAnimationFrame(updateShapeName);
  </script>
</body>
</html>
