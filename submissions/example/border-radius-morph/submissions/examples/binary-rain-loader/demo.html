<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="A pure CSS binary rain loading animation."
  >
  <title>CSS Binary Rain Loader</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="loader-card" aria-labelledby="loader-title">
      <div class="binary-loader" role="status" aria-live="polite">
        <span class="sr-only">Loading...</span>

        <div class="binary-rain" aria-hidden="true">
          <span class="binary-column column-1">
            <span>1</span>
            <span>0</span>
            <span>1</span>
            <span>1</span>
            <span>0</span>
            <span>1</span>
            <span>0</span>
            <span>1</span>
          </span>

          <span class="binary-column column-2">
            <span>0</span>
            <span>1</span>
            <span>1</span>
            <span>0</span>
            <span>1</span>
            <span>0</span>
            <span>0</span>
            <span>1</span>
          </span>

          <span class="binary-column column-3">
            <span>1</span>
            <span>1</span>
            <span>0</span>
            <span>1</span>
            <span>0</span>
            <span>1</span>
            <span>1</span>
            <span>0</span>
          </span>

          <span class="binary-column column-4">
            <span>0</span>
            <span>1</span>
            <span>0</span>
            <span>0</span>
            <span>1</span>
            <span>1</span>
            <span>0</span>
            <span>1</span>
          </span>

          <span class="binary-column column-5">
            <span>1</span>
            <span>0</span>
            <span>1</span>
            <span>0</span>
            <span>1</span>
            <span>1</span>
            <span>0</span>
            <span>0</span>
          </span>

          <span class="binary-column column-6">
            <span>0</span>
            <span>0</span>
            <span>1</span>
            <span>1</span>
            <span>0</span>
            <span>1</span>
            <span>0</span>
            <span>1</span>
          </span>

          <span class="binary-column column-7">
            <span>1</span>
            <span>0</span>
            <span>0</span>
            <span>1</span>
            <span>1</span>
            <span>0</span>
            <span>1</span>
            <span>0</span>
          </span>

          <span class="binary-column column-8">
            <span>0</span>
            <span>1</span>
            <span>1</span>
            <span>0</span>
            <span>0</span>
            <span>1</span>
            <span>1</span>
            <span>0</span>
          </span>
        </div>

        <div class="loader-content">
          <div class="loader-icon" aria-hidden="true">
            <span>01</span>
          </div>

          <h1 id="loader-title">Loading</h1>
          <p>Please wait...</p>

          <div class="loading-dots" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
