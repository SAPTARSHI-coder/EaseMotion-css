<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease SCSS Generative Topography Map</title>
    <link rel="stylesheet" href="../../../easemotion.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 
      The Invisible Math Engine!
      We must inject this SVG into the DOM so our CSS `filter: url()` can find it!
      It doesn't render any visible graphics itself.
    -->
    <svg style="display: none;">
        <defs>
            <filter id="ease-topography-filter" x="0" y="0" width="100%" height="100%">
                <!-- 
                  1. Generate the Noise!
                  baseFrequency="0.015": A very low frequency creates massive, smooth continents of noise.
                  numOctaves="3": Adds fine-grain detail to the edges.
                  result="NOISE": Saves this math into a variable!
                -->
                <feTurbulence 
                    type="fractalNoise" 
                    baseFrequency="0.015" 
                    numOctaves="3" 
                    result="NOISE" 
                />
                
                <!-- 
                  2. Warp the Source Graphic (The CSS Circles)!
                  We feed the "NOISE" map into a DisplacementMap.
                  scale="100": This is how violently we warp the circles! The higher the number, the more distorted the contour lines become!
                -->
                <feDisplacementMap 
                    in="SourceGraphic" 
                    in2="NOISE" 
                    scale="100" 
                    xChannelSelector="R" 
                    yChannelSelector="G" 
                />
            </filter>
        </defs>
    </svg>

    <main class="demo-container">
        
        <div class="glass-card">
            <h1>Generative Topography</h1>
            <p>100% CSS & SVG Math. Zero Canvas/WebGL.</p>
        </div>
        
    </main>

</body>
</html>
