<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease SCSS Audio Visualizer</title>
    <link rel="stylesheet" href="../../../easemotion.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="demo-container">
        
        <header class="header">
            <h1>Audio Frequency Visualizer</h1>
            <p>100% CSS. Powered by SCSS modulo loops for pseudo-random delays.</p>
        </header>

        <div class="player-card">
            <div class="album-art">
                <img src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?auto=format&fit=crop&w=400&q=80" alt="Album Cover">
            </div>
            
            <div class="track-info">
                <h2>Synthetic Waves</h2>
                <p>EaseMotion Records</p>
                
                <!-- The Visualizer Container -->
                <div class="audio-bars">
                    <!-- We define 24 bars here, and our SCSS loop will target them all! -->
                    <div></div><div></div><div></div><div></div><div></div><div></div>
                    <div></div><div></div><div></div><div></div><div></div><div></div>
                    <div></div><div></div><div></div><div></div><div></div><div></div>
                    <div></div><div></div><div></div><div></div><div></div><div></div>
                </div>
            </div>
        </div>
        
    </main>

</body>
</html>
