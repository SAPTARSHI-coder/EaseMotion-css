<body>

    <main class="demo-container">

            <p>100% SCSS Generated Clip-Paths. Zero JS.</p>

        <div class="glitch-container">

              CRUCIAL: The data-text attribute must EXACTLY match the inner text!

              to duplicate the typography.
            -->
            <h2 class="glitch-title cyber-style" data-text="SYSTEM FAILURE">
                SYSTEM FAILURE
            </h2>
            
            <h3 class="glitch-subtitle neon-style" data-text="REBOOTING SEQUENCE...">
