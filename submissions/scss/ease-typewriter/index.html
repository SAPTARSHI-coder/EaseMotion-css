<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease SCSS Typewriter Reveal</title>
    <link rel="stylesheet" href="../../../easemotion.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="demo-container">
        
        <header class="header">
            <h1>Typewriter Reveal</h1>
            <p>100% CSS. Powered by `ch` units and `steps()` math.</p>
        </header>

        <div class="terminal-window">
            <div class="terminal-header">
                <span class="dot red"></span>
                <span class="dot yellow"></span>
                <span class="dot green"></span>
                <span class="title">bash - ease-motion</span>
            </div>
            
            <div class="terminal-body">
                <!-- 
                  We apply our SCSS mixin to these lines.
                  Notice we use a monospaced font so the `ch` math works perfectly!
                -->
                <p class="line line-1">> initializing boot sequence...</p>
                <p class="line line-2">> loading css modules...</p>
                <p class="line line-3">> bypassing javascript engine...</p>
                <p class="line line-4">> access granted.</p>
            </div>
        </div>
        
    </main>

</body>
</html>
