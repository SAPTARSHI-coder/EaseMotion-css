<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Flash Pulse Sparkle Glow</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="demo">
      <h1>Flash Pulse Sparkle Glow</h1>

      <p>
        A lightweight sparkle animation using transform and opacity,
        with configurable timing and reduced-motion support.
      </p>

      <div class="sparkle-stage">
        <div class="sparkle-glow"></div>

        <div
          class="sparkle animation-target"
          aria-label="Animated sparkle"
        >
          <span class="sparkle-core"></span>
        </div>
      </div>

      <div class="info">
        <span>1.8s</span>
        <span>•</span>
        <span>ease-in-out</span>
        <span>•</span>
        <span>infinite</span>
      </div>
    </main>
  </body>
</html>
