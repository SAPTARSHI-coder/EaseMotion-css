<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCSS Mixin: Outline Pulse Ring - EaseMotion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="ease-pulse-showcase" aria-labelledby="mixin-title">
    <header>
      <h1 id="mixin-title" style="color: #38bdf8; font-size: 1.75rem; margin: 0 0 0.5rem 0;">Outline Pulse Ring SCSS Mixin</h1>
      <p style="color: #94a3b8; font-size: 0.875rem; line-height: 1.6; margin: 0;">
        Hardware-accelerated pulse ring animation mixin. Leverages <code>transform: scale()</code> and <code>opacity</code> on pseudo-elements for 60 FPS rendering without layout thrashing.
      </p>
    </header>

    <section class="ease-demo-row">
      <button type="button" class="ease-pulse-btn ease-anim-outline-pulse-ring" aria-label="Live Call to Action Button">
        Live CTA Pulse
      </button>

      <div class="ease-pulse-beacon ease-anim-outline-pulse-ring" role="status" aria-label="System active beacon">
        📡
      </div>

      <div class="ease-pulse-badge ease-anim-outline-pulse-ring" role="status">
        Status: Active
      </div>
    </section>
  </main>
</body>
</html>
