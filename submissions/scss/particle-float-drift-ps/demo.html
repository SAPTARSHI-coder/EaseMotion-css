<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Particle Float Drift Demo - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="particle-field">
    <div class="particle ease-anim-particle-float-drift" style="width: 12px; height: 12px; bottom: 10%; left: 20%; --ease-duration: 5s; --ease-delay: 0s;"></div>
    <div class="particle ease-anim-particle-float-drift" style="width: 18px; height: 18px; bottom: 15%; left: 40%; --ease-duration: 7s; --ease-delay: 1s;"></div>
    <div class="particle ease-anim-particle-float-drift" style="width: 10px; height: 10px; bottom: 5%; left: 60%; --ease-duration: 6s; --ease-delay: 0.5s;"></div>
    <div class="particle ease-anim-particle-float-drift" style="width: 22px; height: 22px; bottom: 20%; left: 80%; --ease-duration: 8s; --ease-delay: 1.5s;"></div>
    <div class="particle ease-anim-particle-float-drift" style="width: 14px; height: 14px; bottom: 12%; left: 30%; --ease-duration: 5.5s; --ease-delay: 2s;"></div>
    <div class="particle ease-anim-particle-float-drift" style="width: 16px; height: 16px; bottom: 8%; left: 70%; --ease-duration: 6.5s; --ease-delay: 2.5s;"></div>
  </div>

  <div class="container">
    <h1>Particle Float Drift</h1>
    <p>Hardware-accelerated SCSS animation mixin for EaseMotion CSS core library.</p>
  </div>
</body>
</html>
