<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease SCSS Text Fill</title>
    <link rel="stylesheet" href="../../../easemotion.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="demo-container">
        
        <header class="header">
            <h1>Dynamic Text Fill</h1>
            <p>100% CSS. Powered by `background-clip` and gradient tracking.</p>
        </header>

        <div class="typography-showcase">
            <!-- We apply the mixin to this massive typography element! -->
            <h2 class="filled-text">EASEMOTION</h2>
            <h2 class="filled-text delay-1">CSS</h2>
        </div>
        
    </main>

</body>
</html>
