<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Datepicker Calendar Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calendar-container">
        <h2>Select a Date</h2>
        <div class="datepicker-calendar" role="application" aria-label="Calendar date picker">
            <div class="datepicker-header">
                <button class="datepicker-prev" aria-label="Previous month">&lt;</button>
                <div class="datepicker-title" aria-live="polite">August 2026</div>
                <button class="datepicker-next" aria-label="Next month">&gt;</button>
            </div>
            <table class="datepicker-grid" role="grid" aria-labelledby="datepicker-title">
                <thead>
                    <tr>
                        <th scope="col" aria-label="Sunday">Su</th>
                        <th scope="col" aria-label="Monday">Mo</th>
                        <th scope="col" aria-label="Tuesday">Tu</th>
                        <th scope="col" aria-label="Wednesday">We</th>
                        <th scope="col" aria-label="Thursday">Th</th>
                        <th scope="col" aria-label="Friday">Fr</th>
                        <th scope="col" aria-label="Saturday">Sa</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td role="gridcell" tabindex="-1"><button class="date-btn empty" disabled></button></td>
                        <td role="gridcell" tabindex="-1"><button class="date-btn empty" disabled></button></td>
                        <td role="gridcell" tabindex="-1"><button class="date-btn empty" disabled></button></td>
                        <td role="gridcell" tabindex="-1"><button class="date-btn empty" disabled></button></td>
                        <td role="gridcell" tabindex="-1"><button class="date-btn empty" disabled></button></td>
                        <td role="gridcell" tabindex="-1"><button class="date-btn empty" disabled></button></td>
                        <td role="gridcell" tabindex="-1"><button class="date-btn" aria-label="August 1, 2026">1</button></td>
                    </tr>
                    <tr>
                        <td role="gridcell" tabindex="-1"><button class="date-btn" aria-label="August 2, 2026">2</button></td>
                        <td role="gridcell" tabindex="-1"><button class="date-btn" aria-label="August 3, 2026">3</button></td>
                        <td role="gridcell" tabindex="-1"><button class="date-btn" aria-label="August 4, 2026">4</button></td>
                        <td role="gridcell" tabindex="-1"><button class="date-btn" aria-label="August 5, 2026">5</button></td>
                        <td role="gridcell" tabindex="-1"><button class="date-btn" aria-label="August 6, 2026">6</button></td>
                        <td role="gridcell" tabindex="-1"><button class="date-btn" aria-label="August 7, 2026">7</button></td>
                        <td role="gridcell" tabindex="-1"><button class="date-btn" aria-label="August 8, 2026">8</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
