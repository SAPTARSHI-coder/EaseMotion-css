<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Toggle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <h1>3D Toggle</h1>
    <p>Interactive 3D toggle created using only HTML and CSS.</p>

    <label class="toggle">
      <input type="checkbox">
      <span class="slider">
        <span class="knob"></span>
      </span>
    </label>

    <p class="hint">Click the toggle</p>
  </main>

</body>
</html>
