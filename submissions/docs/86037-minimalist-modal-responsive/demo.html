<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Responsive minimalist modal documentation demo.">
  <title>Minimalist Modal — Responsive</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="page__header">
      <p class="eyebrow">EaseMotion CSS · #86037</p>
      <h1>Responsive Minimalist Modal</h1>
      <p>A compact dialog presentation that adapts its spacing and width to the viewport.</p>
    </header>
    <section class="demo" aria-labelledby="dialog-title">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="dialog-title" aria-describedby="dialog-description">
        <div class="modal__header">
          <div>
            <p class="modal__eyebrow">Responsive example</p>
            <h2 id="dialog-title">Review your settings</h2>
          </div>
          <button class="modal__close" type="button" aria-label="Close dialog">×</button>
        </div>
        <p id="dialog-description">This panel stays readable on desktop and narrow screens while keeping the primary action easy to reach.</p>
        <div class="modal__actions">
          <button class="button button--secondary" type="button">Cancel</button>
          <button class="button button--primary" type="button">Save changes</button>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
