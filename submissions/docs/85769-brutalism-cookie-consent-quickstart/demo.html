<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Brutalism cookie consent quickstart demo.">
  <title>Brutalism Cookie Consent Banner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="demo-shell">
    <header class="demo-header">
      <p class="eyebrow">EaseMotion CSS · #85769</p>
      <h1>Cookie Consent Banner</h1>
      <p>A direct, responsive consent surface with native keyboard-operable actions.</p>
    </header>
    <section class="cookie-banner" aria-labelledby="cookie-title">
      <div>
        <p class="cookie-banner__label">Privacy</p>
        <h2 id="cookie-title">Cookie preferences</h2>
        <p>Choose whether optional cookies may be used to improve the experience.</p>
      </div>
      <div class="cookie-banner__actions">
        <button type="button">Accept</button>
        <button type="button">Decline</button>
      </div>
    </section>
  </main>
</body>
</html>
