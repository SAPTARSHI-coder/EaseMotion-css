<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Basic Retro Pixel Hero Section demonstration.">
  <title>Retro Pixel Hero</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="hero">
    <section class="hero__content" aria-labelledby="hero-title">
      <p class="hero__eyebrow">EaseMotion CSS · Issue #81544</p>
      <h1 id="hero-title">Build the future with a retro pulse.</h1>
      <p class="hero__description">A basic pixel-inspired hero section that combines semantic content with a lightweight decorative treatment.</p>
      <div class="hero__actions">
        <a class="hero__button hero__button--primary" href="#start">Get started</a>
        <a class="hero__button hero__button--secondary" href="#learn">Learn more</a>
      </div>
    </section>

    <div class="hero__visual" aria-hidden="true">
      <span class="pixel pixel--one"></span>
      <span class="pixel pixel--two"></span>
      <span class="pixel pixel--three"></span>
      <span class="pixel pixel--four"></span>
      <div class="hero__screen">
        <span>READY</span>
        <strong>1986 → 2026</strong>
        <small>CSS / MOTION / WEB</small>
      </div>
    </div>
  </main>
</body>
</html>
