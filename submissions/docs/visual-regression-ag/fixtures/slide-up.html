<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Slide Up</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #eee; overflow: hidden; }
    .box { width: 200px; height: 100px; background: mediumseagreen; color: white; display: flex; justify-content: center; align-items: center; font-size: 24px; font-weight: bold; border-radius: 8px; }
    
    @keyframes slide-up {
      0% { transform: translateY(100%); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }
    .ease-slide-up { animation: slide-up 1000ms both; }
  </style>
</head>
<body>
  <div class="box ease-slide-up">EaseMotion</div>
</body>
</html>
