<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hinge</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #eee; }
    .box { width: 200px; height: 100px; background: tomato; color: white; display: flex; justify-content: center; align-items: center; font-size: 24px; font-weight: bold; border-radius: 8px; }
    
    @keyframes hinge {
      0% { transform-origin: top left; animation-timing-function: ease-in-out; }
      20%, 60% { transform: rotate3d(0, 0, 1, 80deg); transform-origin: top left; animation-timing-function: ease-in-out; }
      40%, 80% { transform: rotate3d(0, 0, 1, 60deg); transform-origin: top left; animation-timing-function: ease-in-out; opacity: 1; }
      100% { transform: translate3d(0, 700px, 0); opacity: 0; }
    }
    .ease-hinge { animation: hinge 1000ms both; }
  </style>
</head>
<body>
  <div class="box ease-hinge">EaseMotion</div>
</body>
</html>
