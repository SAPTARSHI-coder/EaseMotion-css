<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flip X</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #eee; }
    .box { width: 200px; height: 100px; background: dodgerblue; color: white; display: flex; justify-content: center; align-items: center; font-size: 24px; font-weight: bold; border-radius: 8px; perspective: 400px; }
    
    @keyframes flip-x {
      0% { transform: perspective(400px) rotate3d(1, 0, 0, 90deg); animation-timing-function: ease-in; opacity: 0; }
      40% { transform: perspective(400px) rotate3d(1, 0, 0, -20deg); animation-timing-function: ease-in; }
      60% { transform: perspective(400px) rotate3d(1, 0, 0, 10deg); opacity: 1; }
      80% { transform: perspective(400px) rotate3d(1, 0, 0, -5deg); }
      100% { transform: perspective(400px); opacity: 1; }
    }
    .ease-flip-x { animation: flip-x 1000ms both; }
  </style>
</head>
<body>
  <div class="box ease-flip-x">EaseMotion</div>
</body>
</html>
