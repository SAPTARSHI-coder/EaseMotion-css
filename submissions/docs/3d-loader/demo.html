<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentation: 3D Loader Component - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-demo-container">
        <!-- Pure CSS 3D Loader Documentation Showcase -->
        <header class="em-loader-card" role="region" aria-label="3D Loader Documentation Showcase" tabindex="0">
            <div class="em-loader-header-bar">
                <span class="em-card-badge">COMPONENT DOCS</span>
                <span class="em-brand-logo">LoaderMotion</span>
            </div>
            <h1 class="em-card-title">3D Loader Documentation</h1>
            <p class="em-card-desc">Complete integration guide and live demo for the EaseMotion 3D Loader component, featuring hardware-accelerated 3D perspective rotation and frosted glassmorphism.</p>
            <div class="em-loader-wrapper">
                <div class="ease-3d-loader" aria-label="Animated 3D Loader Element" tabindex="0">
                    <div class="em-loader-ring"></div>
                    <span class="em-loader-text">LOADING...</span>
                </div>
            </div>
        </header>
    </div>
</body>
</html>
