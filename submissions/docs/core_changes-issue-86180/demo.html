<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Lightning Flash Burst Spark</title>

  <link rel="stylesheet" href="style.css" />

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #080b12;
      color: #f8fafc;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .demo {
      width: min(90vw, 680px);
      text-align: center;
    }

    .demo h1 {
      margin-bottom: 0.5rem;
      font-size: 2rem;
    }

    .demo p {
      margin-top: 0;
      color: #94a3b8;
    }

    .stage {
      position: relative;
      display: grid;
      place-items: center;
      width: 320px;
      height: 220px;
      margin: 2rem auto;
      overflow: hidden;
      border: 1px solid #1e293b;
      border-radius: 20px;
      background:
        radial-gradient(
          circle,
          rgba(255, 255, 255, 0.08),
          transparent 45%
        ),
        #0f172a;
    }

    .spark {
      position: relative;
      width: 120px;
      height: 120px;
      display: grid;
      place-items: center;
    }

    .spark-bolt {
      position: relative;
      z-index: 2;
      font-size: 4rem;
      filter:
        drop-shadow(0 0 8px rgba(255, 255, 255, 0.95))
        drop-shadow(0 0 24px rgba(250, 204, 21, 0.75));
    }

    .spark::before {
      content: "";
      position: absolute;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: rgba(250, 204, 21, 0.22);
      filter: blur(18px);
      transform: scale(0.5);
      opacity: 0;
    }

    .spark-particle {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #fef08a;
      box-shadow: 0 0 10px rgba(250, 204, 21, 0.9);
      opacity: 0;
    }

    .particle-1 {
      transform: translate(-42px, -18px);
    }

    .particle-2 {
      transform: translate(42px, -24px);
    }

    .particle-3 {
      transform: translate(-50px, 20px);
    }

    .particle-4 {
      transform: translate(48px, 28px);
    }

    .particle-5 {
      transform: translate(-15px, -52px);
    }

    .particle-6 {
      transform: translate(18px, 52px);
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    button {
      border: 1px solid #334155;
      border-radius: 999px;
      padding: 0.7rem 1.1rem;
      background: #111827;
      color: #f8fafc;
      cursor: pointer;
      font: inherit;
    }

    button:hover {
      background: #1e293b;
    }

    .duration {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #64748b;
    }
  </style>
</head>

<body>
  <main class="demo">

    <h1>Lightning Flash Burst Spark</h1>

    <p>
      A short flash-and-burst animation using opacity and transform.
    </p>

    <div class="stage">

      <div
        id="spark"
        class="spark ease-anim-lightning-flash-burst-spark"
        aria-label="Lightning flash burst spark"
      >
        <span class="spark-bolt">⚡</span>

        <span class="spark-particle particle-1"></span>
        <span class="spark-particle particle-2"></span>
        <span class="spark-particle particle-3"></span>
        <span class="spark-particle particle-4"></span>
        <span class="spark-particle particle-5"></span>
        <span class="spark-particle particle-6"></span>
      </div>

    </div>

    <div class="controls">

      <button type="button" data-duration="500ms">
        Fast · 500ms
      </button>

      <button type="button" data-duration="800ms">
        Default · 800ms
      </button>

      <button type="button" data-duration="1200ms">
        Slow · 1200ms
      </button>

      <button type="button" id="replay">
        Replay
      </button>

    </div>

    <div class="duration" id="duration-label">
      Duration: 800ms
    </div>

  </main>

  <script>
    const spark = document.getElementById("spark");
    const durationLabel = document.getElementById("duration-label");

    const durationButtons =
      document.querySelectorAll("[data-duration]");

    const replayButton =
      document.getElementById("replay");

    function replayAnimation() {
      spark.classList.remove(
        "ease-anim-lightning-flash-burst-spark"
      );

      void spark.offsetWidth;

      spark.classList.add(
        "ease-anim-lightning-flash-burst-spark"
      );
    }

    function setDuration(duration) {
      spark.style.setProperty(
        "--lightning-duration",
        duration
      );

      durationLabel.textContent =
        `Duration: ${duration}`;

      replayAnimation();
    }

    durationButtons.forEach((button) => {
      button.addEventListener("click", () => {
        setDuration(button.dataset.duration);
      });
    });

    replayButton.addEventListener(
      "click",
      replayAnimation
    );
  </script>

</body>
</html>
