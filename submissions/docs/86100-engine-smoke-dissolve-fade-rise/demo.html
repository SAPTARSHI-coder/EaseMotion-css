<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smoke Dissolve Fade Rise</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo">
    <p class="eyebrow">EaseMotion Core Animation</p>

    <h1>Smoke Dissolve Fade Rise</h1>

    <p class="description">
      A soft smoke-inspired entrance animation that rises upward while
      gradually dissolving into the background.
    </p>

    <section class="stage">
      <div class="smoke-container">

        <div class="smoke smoke-one ease-anim-smoke-dissolve-fade-rise">
          <span>SMOKE</span>
        </div>

        <div class="smoke smoke-two ease-anim-smoke-dissolve-fade-rise">
          <span>RISE</span>
        </div>

        <div class="smoke smoke-three ease-anim-smoke-dissolve-fade-rise">
          <span>FADE</span>
        </div>

      </div>
    </section>

    <button
      type="button"
      onclick="
        document.querySelectorAll('.smoke').forEach((element) => {
          element.classList.remove('ease-anim-smoke-dissolve-fade-rise');
          void element.offsetWidth;
          element.classList.add('ease-anim-smoke-dissolve-fade-rise');
        });
      "
    >
      Replay Animation
    </button>
  </main>

</body>
</html>
