<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Advanced dynamic cookie banner styling demonstration.">
  <title>Dynamic Cookie Banner — Advanced</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="page__header">
      <p class="eyebrow">EaseMotion CSS · #81568</p>
      <h1>Dynamic Cookie Banner</h1>
      <p>Advanced presentation with flexible actions and reusable theme variables.</p>
    </header>

    <section class="cookie-banner cookie-banner--floating" aria-labelledby="cookie-title">
      <div class="cookie-banner__content">
        <p class="cookie-banner__eyebrow">Privacy settings</p>
        <h2 id="cookie-title">Control optional cookies</h2>
        <p>Choose whether optional cookies can be used for analytics and personalization.</p>
      </div>
      <div class="cookie-banner__actions">
        <button class="cookie-banner__button cookie-banner__button--secondary" type="button">Decline</button>
        <button class="cookie-banner__button cookie-banner__button--primary" type="button">Accept</button>
      </div>
    </section>
  </main>
</body>
</html>
