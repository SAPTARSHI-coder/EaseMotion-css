<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Looping Animation Iterations</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Looping Animation Iteration Tests</h1>

    <div class="demo-grid">
      <div class="demo-card ease-bounce">
        <h2>Default</h2>
        <p>Default animation iteration behavior.</p>
      </div>

      <div class="demo-card custom-three">
        <h2>3 Iterations</h2>
        <p>Uses --ease-animation-iterations: 3.</p>
      </div>

      <div class="demo-card custom-five">
        <h2>5 Iterations</h2>
        <p>Uses --ease-animation-iterations: 5.</p>
      </div>

      <div class="demo-card custom-infinite">
        <h2>Infinite</h2>
        <p>Uses infinite animation iterations.</p>
      </div>
    </div>
  </main>
</body>
</html>
