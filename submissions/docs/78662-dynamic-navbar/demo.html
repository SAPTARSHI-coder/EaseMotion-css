<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Dynamic Navbar usage demo for EaseMotion CSS issue 78662">
  <title>Dynamic Navbar | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#home">EaseMotion</a>
    <button class="menu-button" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
    <nav id="site-nav" class="site-nav" aria-label="Primary navigation">
      <a href="#components">Components</a>
      <a href="#patterns">Patterns</a>
      <a href="#docs">Docs</a>
      <a href="#about">About</a>
    </nav>
  </header>
  <main class="page-shell">
    <section aria-labelledby="title">
      <p class="eyebrow">EaseMotion CSS · Issue #78662</p>
      <h1 id="title">Dynamic Navbar</h1>
      <p>Resize the viewport to see the navigation switch between full and compact layouts.</p>
    </section>
  </main>
  <script>
    const menuButton = document.querySelector('.menu-button');
    const nav = document.querySelector('#site-nav');

    menuButton.addEventListener('click', () => {
      const expanded = menuButton.getAttribute('aria-expanded') === 'true';
      menuButton.setAttribute('aria-expanded', String(!expanded));
      nav.classList.toggle('is-open', !expanded);
    });
  </script>
</body>
</html>
