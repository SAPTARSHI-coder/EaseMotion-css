<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Engine Dynamic Theme Palette Injection — EaseMotion CSS</title>
  <link rel="stylesheet" href="../../../easemotion.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="ease-center">
  <div class="theme-card ease-card" em="theme-cyberpunk fade-in">
    <h2>🎨 Dynamic Theme Subtree</h2>
    <p>This card subtree uses <code>em="theme-cyberpunk"</code> to scope theme custom properties without affecting global body styles.</p>
    <button class="theme-btn" em="zoom-in delay-200ms">Cyberpunk Action</button>
  </div>
  <script type="module" src="../../../easemotion/index.js"></script>
</body>
</html>
