<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gradient Glow Filter Bar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="demo-shell">
    <header class="demo-header">
      <p class="eyebrow">EaseMotion CSS · #85762</p>
      <h1>Gradient Glow Filter Bar</h1>
      <p>Accessible native form controls inside a responsive visual header.</p>
    </header>
    <section class="filter-bar" aria-labelledby="filter-title">
      <h2 id="filter-title">Filter results</h2>
      <div class="filter-bar__controls">
        <label>Category <select><option>All</option><option>Design</option><option>Development</option></select></label>
        <label>Sort <select><option>Newest</option><option>Popular</option></select></label>
        <button type="button">Apply filters</button>
      </div>
    </section>
  </main>
</body>
</html>
