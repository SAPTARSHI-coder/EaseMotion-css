<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Basic accessible Neumorphic Drawer demonstration.">
  <title>Neumorphic Drawer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell">
    <header class="page-header">
      <p class="eyebrow">EaseMotion CSS · Issue #81537</p>
      <h1>Neumorphic Drawer</h1>
      <p>A compact navigation drawer with soft surfaces, accessible controls, and responsive behavior.</p>
    </header>

    <section class="drawer-demo" aria-labelledby="drawer-title">
      <div class="drawer__panel">
        <div class="drawer__header">
          <div>
            <p class="eyebrow">Basic usage</p>
            <h2 id="drawer-title">Workspace menu</h2>
          </div>
          <button class="drawer__close" type="button" aria-label="Close menu">×</button>
        </div>
        <nav class="drawer__nav" aria-label="Workspace navigation">
          <a href="#overview">Overview</a>
          <a href="#activity">Activity</a>
          <a href="#settings">Settings</a>
          <a href="#help">Help center</a>
        </nav>
        <p class="drawer__note">Use native links and a real button when connecting the drawer to application logic.</p>
      </div>
      <button class="drawer__trigger" type="button" aria-expanded="true" aria-controls="drawer-panel">Open navigation</button>
    </section>
  </main>
</body>
</html>
