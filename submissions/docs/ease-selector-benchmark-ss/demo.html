<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10,000 Node Selector Benchmark</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ease-bench-card">
    <h1 class="ease-bench-title">10,000 Node Selector Benchmark</h1>
    <div class="ease-bench-stats">
      <span id="stat-nodes">Nodes: 0</span>
      <span id="stat-time">Query Time: 0ms</span>
    </div>
    <button class="ease-bench-btn" id="run-bench">Run DOM Stress Test</button>
  </div>
  <div class="ease-node-grid" id="node-container"></div>

  <script>
    const container = document.getElementById('node-container');
    const runBtn = document.getElementById('run-bench');
    const statNodes = document.getElementById('stat-nodes');
    const statTime = document.getElementById('stat-time');
    
    // Generate 10,000 DOM Nodes
    let html = '';
    for (let i = 0; i < 10000; i++) {
      html += '<div class="ease-flat-node ' + (i % 50 === 0 ? 'ease-deep-target' : '') + '"></div>';
    }
    container.innerHTML = html;
    statNodes.textContent = 'Nodes: 10,000';

    runBtn.addEventListener('click', () => {
      // Force a synchronous layout/style recalculation benchmark
      const t0 = performance.now();
      
      // Querying using flat classes (FAST)
      const nodes = document.querySelectorAll('.ease-flat-node');
      nodes.forEach(n => n.classList.toggle('active'));
      
      // Querying using deep traversal (SLOW in scale)
      const deepNodes = document.querySelectorAll('.ease-bench-card .ease-node-grid div .ease-deep-target');
      
      const t1 = performance.now();
      statTime.textContent = 'Query Time: ' + (t1 - t0).toFixed(2) + 'ms';
    });
  </script>
</body>
</html>
