<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Pastel Modal Demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <button class="modal-trigger-aan" onclick="document.getElementById('pastelModal').classList.add('is-open')">
    Open Modal
  </button>

  <div class="modal-overlay-aan" id="pastelModal">
    <div class="modal-box-aan" role="dialog" aria-modal="true" aria-labelledby="modalTitleAan">
      <button class="modal-close-aan" onclick="document.getElementById('pastelModal').classList.remove('is-open')" aria-label="Close modal">&times;</button>
      <h2 id="modalTitleAan" class="modal-title-aan">Welcome!</h2>
      <p class="modal-body-aan">This is a responsive pastel-themed modal. Resize the window or open it on mobile — it adapts smoothly with no external dependencies.</p>
      <button class="modal-action-aan" onclick="document.getElementById('pastelModal').classList.remove('is-open')">Got it</button>
    </div>
  </div>

  <script>
    var modalAan = document.getElementById('pastelModal');

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        modalAan.classList.remove('is-open');
      }
    });

    modalAan.addEventListener('click', function (e) {
      if (e.target === modalAan) {
        modalAan.classList.remove('is-open');
      }
    });
  </script>

</body>
</html>
