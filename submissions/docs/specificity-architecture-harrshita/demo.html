<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Specificity Layers | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="docs-container">
    <h1>CSS Specificity Architecture</h1>
    <p>EaseMotion uses CSS @layer to manage specificity globally.</p>
    <div class="layer-diagram">
      <div class="layer item-1">1. @layer reset</div>
      <div class="layer item-2">2. @layer base</div>
      <div class="layer item-3">3. @layer components</div>
      <div class="layer item-4">4. @layer utilities</div>
      <div class="layer item-5">5. @layer overrides</div>
    </div>
  </div>
</body>
</html>
