<!DOCTYPE html>
<html lang="en">
<head>

    <title>Documentation: Retro Pixel Avatar Group - Basic Usage - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-demo-container">
        <!-- Pure CSS Retro Pixel Avatar Group Basic Usage Documentation Showcase -->

            <div class="em-avatar-header-bar">

                <span class="em-brand-logo">PixelMotion</span>
