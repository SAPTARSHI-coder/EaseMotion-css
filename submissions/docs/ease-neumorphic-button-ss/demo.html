<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neumorphic Button - Basic Usage Documentation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="ease-neu-card" aria-labelledby="guide-title">
    <header>
      <h1 id="guide-title" style="font-size: 1.75rem; font-weight: 800; margin: 0 0 0.5rem 0;">Neumorphic Button Component</h1>
      <p style="color: #64748b; font-size: 0.875rem; max-width: 580px; margin: 0 auto; line-height: 1.6;">
        Tactile extruded UI components with physical dual-shadow simulation, smooth inset transitions, and accessible WCAG 2.1 AA keyboard navigation.
      </p>
    </header>

    <section class="ease-btn-group" aria-label="Neumorphic Button Variants">
      <button type="button" class="ease-btn-neu" aria-label="Standard action button">
        Standard Button
      </button>

      <button type="button" class="ease-btn-neu ease-btn-neu-accent" aria-label="Accent action button">
        Accent Button
      </button>

      <button type="button" class="ease-btn-neu ease-btn-neu-icon" aria-label="Favorite icon button">
        ♥
      </button>

      <button type="button" class="ease-btn-neu ease-btn-neu-inset" aria-pressed="true" aria-label="Pressed toggle button">
        Inset Active
      </button>
    </section>

    <footer style="border-top: 1px solid var(--neu-shadow-dark); padding-top: 1.5rem; color: #64748b; font-size: 0.8125rem;">
      Click or press <strong>Space / Enter</strong> to preview the inset compression state.
    </footer>
  </main>
</body>
</html>
