<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Badge Demo - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-demo-container">
        <!-- Pure CSS Dynamic Badge Component Showcase -->
        <header class="em-badge-card" role="region" aria-label="Dynamic Badge Showcase" tabindex="0">
            <span class="em-card-badge">DOCUMENTATION</span>
            <h1 class="em-card-title">Dynamic Badge</h1>
            <p class="em-card-desc">A responsive, pure CSS badge component featuring glowing states, smooth scale transitions, and frosted glassmorphism styling.</p>
            <div class="em-badge-wrapper">
                <span class="em-dynamic-badge">LIVE STATUS</span>
            </div>
        </header>
    </div>
</body>
</html>
