<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gradient Glow Hover Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="demo-shell">
    <header>
      <p>EaseMotion example</p>
      <h1>Gradient Glow Hover Card</h1>
      <p>Hover or keyboard-focus the card to preview the effect.</p>
    </header>
    <a class="glow-card" href="#details">
      <span class="glow-card__eyebrow">Featured</span>
      <h2 class="glow-card__title">Product discovery</h2>
      <span class="glow-card__text">A focused card surface with a controlled gradient glow.</span>
    </a>
    <p id="details">The card remains usable without the decorative effect.</p>
  </main>
</body>
</html>
