<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Continuous Animation Memory Audit - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ease-audit-card">
    <h2 style="color: #38bdf8; margin-top: 0;">Continuous Animation Memory Audit</h2>
    <p style="color: #94a3b8; font-size: 0.875rem; margin-bottom: 1.5rem;">Evaluating infinite loops for layout-thrashing properties that cause memory leaks and garbage collection stutters.</p>
    <div style="text-align: center;">
      <h3 style="font-size: 0.875rem; color: #10b981; text-transform: uppercase;">GPU Composited Orbit (Safe)</h3>
      <div class="ease-memory-good"></div>
    </div>
    <div style="text-align: center; margin-top: 3rem;">
      <h3 style="font-size: 0.875rem; color: #ef4444; text-transform: uppercase;">CPU Box-Shadow Pulse (Memory Leak)</h3>
      <div class="ease-memory-bad"></div>
    </div>
  </div>

  <script>
    // Runtime GC and Heap monitor mockup
    setInterval(() => {
      if (performance.memory) {
        const used = Math.round(performance.memory.usedJSHeapSize / 1024 / 1024);
        console.log(`[EaseMotion] JS Heap: ${used} MB`);
      }
    }, 2000);
  </script>
</body>
</html>
