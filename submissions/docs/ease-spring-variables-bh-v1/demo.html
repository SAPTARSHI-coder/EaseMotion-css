<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-spring-variables-bh</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f1f5f9; padding: 2rem; min-height: 100vh; }
    h1 { color: #6366f1; margin-bottom: 1rem; }
    p { color: #94a3b8; margin-bottom: 2rem; }
    .demo-container { display: flex; gap: 3rem; flex-wrap: wrap; }
    .demo-item { text-align: center; }
    .demo-item h3 { margin-bottom: 1rem; color: #e2e8f0; }
    .demo-item p { font-size: 0.875rem; margin-bottom: 0.5rem; }
    code { background: rgba(99, 102, 241, 0.2); padding: 0.25rem 0.5rem; border-radius: 0.25rem; font-size: 0.75rem; }
  </style>
</head>
<body>
  <h1>ease-spring-variables-bh</h1>
  <p>Native Spring Physics Easing Variables - Hover to see bounce effect!</p>
  
  <div class="demo-container">
    <div class="demo-item">
      <h3>--ease-spring-bouncy</h3>
      <div class="ease-spring-demo-box"></div>
      <p><code>cubic-bezier(0.68, -0.55, 0.265, 1.55)</code></p>
    </div>
    
    <div class="demo-item">
      <h3>--ease-spring-stiff</h3>
      <div class="ease-spring-stiff-box"></div>
      <p><code>cubic-bezier(0.175, 0.885, 0.32, 1.275)</code></p>
    </div>
  </div>
</body>
</html>
