<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentation: 3D Dropdown Component - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-demo-container">
        <!-- Pure CSS 3D Dropdown Documentation Showcase -->
        <header class="em-dropdown-doc-card" role="region" aria-label="3D Dropdown Documentation Showcase" tabindex="0">
            <div class="em-dropdown-header-bar">
                <span class="em-card-badge">COMPONENT DOCS</span>
                <span class="em-brand-logo">DropdownMotion</span>
            </div>
            <h1 class="em-card-title">3D Dropdown Documentation</h1>
            <p class="em-card-desc">Complete integration guide and live demo for the EaseMotion 3D Dropdown component, featuring perspective depth and frosted glassmorphism.</p>
            <div class="em-dropdown-wrapper">
                <div class="ease-3d-dropdown" aria-label="3D Dropdown Element" tabindex="0">
                    <button class="em-dropdown-toggle" aria-expanded="true">
                        <span>Select Option</span>
                        <span class="em-arrow">▼</span>
                    </button>
                    <div class="em-dropdown-menu">
                        <a href="#" class="em-dropdown-item">Perspective View</a>
                        <a href="#" class="em-dropdown-item">3D Tilt Effect</a>
                        <a href="#" class="em-dropdown-item">Glassmorphism</a>
                    </div>
                </div>
            </div>
        </header>
    </div>
</body>
</html>
