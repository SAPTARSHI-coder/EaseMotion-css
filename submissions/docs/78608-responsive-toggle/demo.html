<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Responsive Toggle component usage demo for EaseMotion CSS issue 78608">
  <title>Responsive Toggle | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell">
    <section class="demo-card" aria-labelledby="title">
      <p class="eyebrow">EaseMotion CSS · Issue #78608</p>
      <h1 id="title">Responsive Toggle</h1>
      <p class="intro">A compact state control that stays clear and comfortable across viewport sizes.</p>
      <div class="toggle-row">
        <div>
          <strong>Compact mode</strong>
          <p id="state-text">Currently disabled</p>
        </div>
        <button class="toggle" type="button" aria-pressed="false" aria-label="Toggle compact mode">
          <span aria-hidden="true"></span>
        </button>
      </div>
      <p class="hint">Use Tab to focus the control and Enter or Space to change its state.</p>
    </section>
  </main>
  <script>
    const toggle = document.querySelector('.toggle');
    const stateText = document.querySelector('#state-text');

    toggle.addEventListener('click', () => {
      const active = toggle.getAttribute('aria-pressed') === 'true';
      toggle.setAttribute('aria-pressed', String(!active));
      stateText.textContent = !active ? 'Currently enabled' : 'Currently disabled';
    });
  </script>
</body>
</html>
