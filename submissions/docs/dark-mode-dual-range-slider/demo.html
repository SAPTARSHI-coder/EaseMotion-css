<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentation: Dark Mode Dual Range Slider - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-demo-container">
        <!-- Pure CSS Dark Mode Dual Range Slider Quickstart Documentation Showcase -->
        <header class="em-slider-doc-card" role="region" aria-label="Dark Mode Dual Range Slider Documentation Showcase" tabindex="0">
            <div class="em-slider-header-bar">
                <span class="em-card-badge">COMPONENT DOCS</span>
                <span class="em-brand-logo">DarkMotion</span>
            </div>
            <h1 class="em-card-title">Dark Mode Dual Range Slider</h1>
            <p class="em-card-desc">Complete quickstart integration guide, markup examples, and live demo for the EaseMotion Dark Mode Dual Range Slider component.</p>
            <div class="em-slider-wrapper">
                <div class="ease-dark-dual-slider" aria-label="Dark Mode Dual Range Slider Element" tabindex="0">
                    <div class="em-slider-track-bg"></div>
                    <div class="em-slider-track-fill" style="left: 20%; width: 60%;"></div>
                    <input type="range" class="em-range-input em-range-min" min="0" max="100" value="20" aria-label="Minimum Range Value">
                    <input type="range" class="em-range-input em-range-max" min="0" max="100" value="80" aria-label="Maximum Range Value">
                </div>
            </div>
        </header>
    </div>
</body>
</html>
