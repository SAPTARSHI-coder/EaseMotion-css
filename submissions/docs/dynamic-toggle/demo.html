<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dynamic Toggle — Showcase & Usage</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="ease-container">
    <p class="ease-eyebrow">UI Components</p>
    <h1 class="ease-heading">Dynamic Toggle</h1>
    <p class="ease-subtitle">Pure CSS switch toggle featuring fluid thumb motion, ambient status glows, and accessible checkbox state mechanics.</p>

    <div class="ease-card" role="region" aria-label="Dynamic toggle showcase card">
      <div class="ease-toggle-group">
        <!-- Default State Toggle -->
        <div class="ease-toggle-row">
          <label for="ease-toggle-1" class="ease-toggle-label">Push Notifications</label>
          <div class="ease-toggle-wrapper">
            <input type="checkbox" id="ease-toggle-1" class="ease-toggle-input" checked />
            <span class="ease-toggle-track" aria-hidden="true">
              <span class="ease-toggle-thumb"></span>
            </span>
          </div>
        </div>

        <!-- Secondary State Toggle -->
        <div class="ease-toggle-row">
          <label for="ease-toggle-2" class="ease-toggle-label">Dark Mode Protocol</label>
          <div class="ease-toggle-wrapper">
            <input type="checkbox" id="ease-toggle-2" class="ease-toggle-input" />
            <span class="ease-toggle-track" aria-hidden="true">
              <span class="ease-toggle-thumb"></span>
            </span>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
