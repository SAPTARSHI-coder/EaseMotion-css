<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Accessible dark mode range slider demonstration.">
  <title>Dark Mode Range Slider — Accessibility</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="page__header">
      <p class="eyebrow">EaseMotion CSS · #81606</p>
      <h1>Dark Mode Range Slider</h1>
      <p>Native range semantics with visible labeling and keyboard-friendly focus.</p>
    </header>
    <section class="demo-card" aria-labelledby="volume-title">
      <p class="demo-card__eyebrow">Accessibility integration</p>
      <h2 id="volume-title">Playback volume</h2>
      <label class="range-slider" for="volume">
        <span class="range-slider__label">Volume</span>
        <input class="range-slider__input" id="volume" name="volume" type="range" min="0" max="100" value="65">
      </label>
    </section>
  </main>
</body>
</html>
