<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animation Queue Ordering Test</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">

    <h1>Animation Queue Ordering</h1>

    <p>
      Use the controls below to trigger animations sequentially or rapidly.
      The event log shows the order in which animation requests are handled.
    </p>

    <div
      id="demoBox"
      class="demo-box"
      aria-live="polite"
    >
      Ready
    </div>

    <div class="controls">
      <button id="triggerButton">
        Trigger Animation
      </button>

      <button id="rapidButton">
        Rapid Trigger
      </button>

      <button id="resetButton">
        Reset
      </button>
    </div>

    <section class="log-section">
      <h2>Animation Event Log</h2>

      <ol id="eventLog" class="event-log"></ol>
    </section>

  </main>

  <script>
    const demoBox = document.getElementById("demoBox");
    const eventLog = document.getElementById("eventLog");

    const triggerButton = document.getElementById("triggerButton");
    const rapidButton = document.getElementById("rapidButton");
    const resetButton = document.getElementById("resetButton");

    let animationCounter = 0;

    function addLog(message) {
      const item = document.createElement("li");
      item.textContent = message;
      eventLog.appendChild(item);
    }

    function playAnimation() {
      const animationId = ++animationCounter;

      addLog(`Animation ${animationId} requested`);

      demoBox.classList.remove("animate");

      /*
       * Force a layout recalculation so that repeated triggers
       * restart the animation deterministically.
       */
      void demoBox.offsetWidth;

      demoBox.classList.add("animate");

      demoBox.textContent = `Animation ${animationId}`;

      addLog(`Animation ${animationId} started`);

      demoBox.addEventListener(
        "animationend",
        () => {
          addLog(`Animation ${animationId} completed`);
        },
        { once: true }
      );
    }

    triggerButton.addEventListener("click", playAnimation);

    rapidButton.addEventListener("click", () => {
      addLog("Rapid trigger sequence started");

      for (let index = 0; index < 5; index++) {
        setTimeout(() => {
          playAnimation();
        }, index * 50);
      }
    });

    resetButton.addEventListener("click", () => {
      demoBox.classList.remove("animate");

      animationCounter = 0;

      demoBox.textContent = "Ready";

      eventLog.innerHTML = "";

      addLog("Animation state reset");
    });
  </script>

</body>
</html>
