<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Badge Demo - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-demo-container">
        <!-- Pure CSS Animated Badge Component Showcase -->
        <div class="em-badge-card" role="region" aria-label="Animated Badge Showcase" tabindex="0">
            <span class="em-card-badge">DOCUMENTATION</span>
            <h1 class="em-card-title">Animated Badge</h1>
            <p class="em-card-desc">A responsive, pure CSS badge component featuring smooth pulse animations and frosted glassmorphism card styling.</p>
            <div class="em-badge-wrapper">
                <span class="em-animated-badge" role="status" aria-label="New Feature Notification">NEW FEATURE</span>
            </div>
        </div>
    </div>
</body>
</html>
