<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentation: CSS-only Avatar Component - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-demo-container">
        <!-- Pure CSS Avatar Documentation Showcase -->
        <header class="em-avatar-doc-card" role="region" aria-label="CSS-only Avatar Documentation Showcase" tabindex="0">
            <div class="em-avatar-header-bar">
                <span class="em-card-badge">COMPONENT DOCS</span>
                <span class="em-brand-logo">AvatarMotion</span>
            </div>
            <h1 class="em-card-title">CSS-only Avatar Documentation</h1>
            <p class="em-card-desc">Complete integration guide and live demo for the EaseMotion CSS-only Avatar component, featuring indicator badges and frosted glassmorphism.</p>
            <div class="em-avatar-wrapper">
                <div class="ease-css-avatar" aria-label="User Avatar Profile" tabindex="0">
                    <div class="em-avatar-ring">
                        <span class="em-avatar-initials">JS</span>
                    </div>
                    <span class="em-status-indicator online" aria-label="Status: Online"></span>
                </div>
            </div>
        </header>
    </div>
</body>
</html>
