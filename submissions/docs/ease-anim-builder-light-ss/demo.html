<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animation Builder - Light/Dark Theme Verification</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="ease-builder-card" role="region" aria-label="EaseMotion Animation Builder">
    <header class="ease-builder-header">
      <div>
        <h1 style="font-size: 1.25rem; font-weight: 700; margin: 0; color: var(--em-text-primary);">Animation Builder</h1>
        <p style="font-size: 0.8125rem; margin: 0.25rem 0 0 0; color: var(--em-text-secondary);">Interactive Keyframe & Easing Customizer</p>
      </div>
      <button type="button" class="ease-theme-toggle" id="theme-toggle" aria-label="Toggle light and dark color themes">
        <span id="theme-icon">🌙</span> <span id="theme-text">Dark Mode</span>
      </button>
    </header>

    <section class="ease-controls-grid">
      <div class="ease-field-group">
        <label for="easing-select" class="ease-field-label">Easing Preset</label>
        <select id="easing-select" class="ease-builder-select">
          <option value="ease-spring">Spring (Elastic)</option>
          <option value="ease-bounce">Bounce Out</option>
          <option value="ease-smooth">Smooth Transition</option>
        </select>
      </div>
      
      <div class="ease-field-group">
        <label for="duration-input" class="ease-field-label">Duration (ms)</label>
        <input type="number" id="duration-input" class="ease-builder-input" value="600" min="100" max="3000" step="50">
      </div>
      
      <div class="ease-field-group">
        <label for="delay-input" class="ease-field-label">Delay (ms)</label>
        <input type="number" id="delay-input" class="ease-builder-input" value="0" min="0" max="2000" step="50">
      </div>
    </section>

    <div class="ease-preview-stage" aria-label="Live animation preview viewport">
      <div class="ease-anim-target" id="preview-target">EM</div>
    </div>

    <div class="ease-code-output" id="css-output" aria-label="Generated CSS snippet">
      animation: ease-builder-preview 600ms cubic-bezier(0.16, 1, 0.3, 1) 0ms infinite alternate;
    </div>
  </main>

  <script>
    const toggleBtn = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');
    const themeText = document.getElementById('theme-text');
    const htmlEl = document.documentElement;

    toggleBtn.addEventListener('click', () => {
      const currentTheme = htmlEl.getAttribute('data-theme');
      const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';
      htmlEl.setAttribute('data-theme', nextTheme);
      themeIcon.textContent = nextTheme === 'dark' ? '🌙' : '☀️';
      themeText.textContent = nextTheme === 'dark' ? 'Dark Mode' : 'Light Mode';
    });
  </script>
</body>
</html>
