<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Engine Scroll-Scrub Controller — EaseMotion CSS</title>
  <link rel="stylesheet" href="../../../easemotion.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="scroll-spacer">Scroll down to observe frame scrubbing ↓</div>
  <div class="ease-center">
    <div class="scrub-box" em="scroll-scrub spin duration-slow">
      Scroll Progress Scrubbing Box
    </div>
  </div>
  <div class="scroll-spacer">End of scroll section</div>
  <script type="module" src="../../../easemotion/index.js"></script>
</body>
</html>
