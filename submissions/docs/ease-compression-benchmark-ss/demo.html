<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payload Compression Efficiency Benchmark</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ease-metrics-card">
    <h2 class="ease-metrics-title">Payload Compression Efficiency</h2>
    
    <div class="ease-bar-row">
      <div class="ease-bar-label"><span>Raw Minified CSS</span> <span>~45 KB (100%)</span></div>
      <div class="ease-bar-track"><div class="ease-bar-fill original"></div></div>
    </div>
    
    <div class="ease-bar-row">
      <div class="ease-bar-label"><span>Gzip (Level 9)</span> <span>~11.2 KB (25%)</span></div>
      <div class="ease-bar-track"><div class="ease-bar-fill gzip"></div></div>
    </div>
    
    <div class="ease-bar-row">
      <div class="ease-bar-label"><span>Brotli (Level 11)</span> <span>~8.1 KB (18%)</span></div>
      <div class="ease-bar-track"><div class="ease-bar-fill brotli"></div></div>
    </div>
    
    <p style="margin-top: 2rem; font-size: 0.75rem; color: #64748b; text-align: center; line-height: 1.6;">
      This visualizer represents target budget thresholds. The actual CI execution script resides in the README.md to comply with strict folder validation rules.
    </p>
  </div>
</body>
</html>
