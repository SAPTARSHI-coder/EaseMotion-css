<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glowing Breadcrumb</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <h1>Glowing Breadcrumb</h1>
    <p class="description">
      A responsive breadcrumb navigation with a modern neon glow effect.
    </p>

    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="#">Home</a>
      <span class="separator">›</span>

      <a href="#">Products</a>
      <span class="separator">›</span>

      <a href="#">Categories</a>
      <span class="separator">›</span>

      <span class="current" aria-current="page">
        Electronics
      </span>
    </nav>
  </main>

</body>
</html>
