<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tooltip Positioning Boundary Collision Check</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ease-arena" id="arena">
    <div class="ease-tooltip" id="tooltip">Collision Tooltip</div>
    <button class="ease-tooltip-trigger ease-trigger-top" data-placement="top">Top Edge (Forces Flip)</button>
    <button class="ease-tooltip-trigger ease-trigger-center" data-placement="top">Center (Happy Path)</button>
    <button class="ease-tooltip-trigger ease-trigger-right" data-placement="right">Right Edge (Forces Flip)</button>
  </div>

  <script>
    // Pure calculation function for unit testing
    function calculateTooltipPosition(targetRect, tooltipRect, viewportRect, placement) {
      let top, left;
      const gap = 8;
      
      // Baseline happy-path calculation
      if (placement === 'top') {
        top = targetRect.top - tooltipRect.height - gap;
        left = targetRect.left + (targetRect.width / 2) - (tooltipRect.width / 2);
      } else if (placement === 'right') {
        top = targetRect.top + (targetRect.height / 2) - (tooltipRect.height / 2);
        left = targetRect.right + gap;
      }

      // Collision detection & Flipping
      if (placement === 'top' && top < viewportRect.top) {
        // Flip to bottom
        top = targetRect.bottom + gap;
      }
      
      if (placement === 'right' && left + tooltipRect.width > viewportRect.right) {
        // Flip to left
        left = targetRect.left - tooltipRect.width - gap;
      }

      return { top, left };
    }

    // DOM Binding
    const tooltip = document.getElementById('tooltip');
    const arena = document.getElementById('arena');
    const triggers = document.querySelectorAll('.ease-tooltip-trigger');

    triggers.forEach(trigger => {
      trigger.addEventListener('mouseenter', () => {
        tooltip.classList.add('is-visible');
        const targetRect = trigger.getBoundingClientRect();
        const tooltipRect = tooltip.getBoundingClientRect();
        const viewportRect = arena.getBoundingClientRect(); // Using arena as viewport for demo
        
        const pos = calculateTooltipPosition(targetRect, tooltipRect, viewportRect, trigger.dataset.placement);
        
        // Convert back to relative positioning for the demo arena
        tooltip.style.top = (pos.top - viewportRect.top) + 'px';
        tooltip.style.left = (pos.left - viewportRect.left) + 'px';
      });
      
      trigger.addEventListener('mouseleave', () => {
        tooltip.classList.remove('is-visible');
      });
    });
  </script>
</body>
</html>
