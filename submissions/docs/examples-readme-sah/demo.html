<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submission Walkthrough - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="guide-wrapper">
    <h1>🚀 How to Write Your First Example Submission</h1>
    <div class="steps-grid">
      <div class="step-card">
        <div class="step-num">01</div>
        <h3>Create Your Folder</h3>
        <p>Place your folder inside <code>submissions/examples/your-feature-id/</code>.</p>
      </div>
      <div class="step-card">
        <div class="step-num">02</div>
        <h3>Add Exactly 3 Files</h3>
        <p>Include <code>demo.html</code>, <code>style.css</code>, and <code>README.md</code>.</p>
      </div>
      <div class="step-card">
        <div class="step-num">03</div>
        <h3>Test & Push</h3>
        <p>Open <code>demo.html</code> in a browser, verify animations, and open your PR!</p>
      </div>
    </div>
  </div>
</body>
</html>
