<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ease Range Slider Value Change Event Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ease-slider-card">
    <output class="ease-slider-output" id="slider-readout" aria-live="polite">50</output>
    <input type="range" id="ease-slider" class="ease-range-input" min="0" max="100" value="50" aria-label="Volume control">
  </div>

  <script>
    const slider = document.getElementById('ease-slider');
    const readout = document.getElementById('slider-readout');
    
    // Core function to test
    function handleSliderChange(event, displayElement) {
      if (!event || !event.target) return;
      
      let value = parseInt(event.target.value, 10);
      // Guard against NaN or invalid inputs fallback
      if (isNaN(value)) value = 0;
      
      // Clamp logic safety net
      const min = parseInt(event.target.min, 10) || 0;
      const max = parseInt(event.target.max, 10) || 100;
      
      if (value < min) value = min;
      if (value > max) value = max;
      
      displayElement.textContent = value;
      return value;
    }

    // Real-time DOM binding
    slider.addEventListener('input', (e) => handleSliderChange(e, readout));
  </script>
</body>
</html>
