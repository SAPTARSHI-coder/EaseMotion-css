<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cubic Bezier Easing Curves Guide - EaseMotion CSS Docs</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="easing-wrapper">
    <header class="easing-header">
      <span class="badge">TIMING PHYSICS</span>
      <h1>Cubic-Bezier Easing Curves Guide</h1>
      <p>Visualizing custom cubic-bezier math, spring velocity vectors, and keyframe acceleration curves.</p>
    </header>

    <div class="curves-grid">
      <div class="curve-card">
        <h3>Spring Overshoot</h3>
        <code>cubic-bezier(0.175, 0.885, 0.32, 1.275)</code>
        <div class="ball-track">
          <div class="ball spring-ball"></div>
        </div>
      </div>

      <div class="curve-card">
        <h3>Snappy Entrance</h3>
        <code>cubic-bezier(0.16, 1, 0.3, 1)</code>
        <div class="ball-track">
          <div class="ball snappy-ball"></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
