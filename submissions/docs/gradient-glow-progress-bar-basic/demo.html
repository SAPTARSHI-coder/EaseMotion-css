<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gradient Glow Progress Bar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="progress-demo">
    <h1>Gradient Glow Progress Bar</h1>

    <div
      class="progress-bar"
      role="progressbar"
      aria-label="Project completion"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="75"
    >
      <div class="progress-bar__fill" style="width: 75%;"></div>
    </div>

    <p class="progress-text">75% Complete</p>
  </main>

</body>
</html>
