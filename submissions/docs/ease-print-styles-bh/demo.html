<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion CSS - Print Styles Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f1f5f9; padding: 2rem; }
    nav { background: #1e293b; padding: 1rem; margin-bottom: 2rem; }
    .card { background: #1e293b; padding: 2rem; border-radius: 1rem; margin-bottom: 1rem; box-shadow: 0 10px 40px rgba(99, 102, 241, 0.2); }
    h1 { color: #6366f1; margin-bottom: 1rem; }
    p { color: #94a3b8; margin-bottom: 1rem; }
    .ease-no-print { background: #ef4444; padding: 1rem; border-radius: 0.5rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <nav class="ease-no-print">
    <strong>Navigation</strong> - Will NOT print
  </nav>
  
  <div class="card">
    <h1>ease-print-styles-bh</h1>
    <p>Press Ctrl+P (Cmd+P) to test print styles. Notice nav and shadows are hidden!</p>
  </div>
  
  <div class="ease-no-print">
    <strong>This box won't print!</strong>
  </div>
</body>
</html>
