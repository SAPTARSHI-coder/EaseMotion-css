<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion CSS - Minimalist Modal</title>

  <!-- EaseMotion modal component -->
  <link rel="stylesheet" href="../../../components/modals.css">

  <!-- Demo page styles -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo-page">
    <h1>Minimalist Modal</h1>

    <p>
      A basic modal example using the EaseMotion CSS modal component.
    </p>

    <a href="#basic-modal" class="demo-button">
      Open Modal
    </a>
  </main>

  <!-- Modal -->
  <div id="basic-modal" class="ease-modal-overlay">

    <div
      class="ease-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
      aria-describedby="modal-description"
    >

      <header class="ease-modal-header">
        <h2 id="modal-title">Welcome</h2>

        <a
          href="#"
          class="ease-modal-close"
          aria-label="Close modal"
        >
          &times;
        </a>
      </header>

      <div class="ease-modal-body">
        <p id="modal-description">
          This is a basic EaseMotion CSS modal using the
          <code>.ease-modal-overlay</code> and
          <code>.ease-modal</code> classes.
        </p>
      </div>

      <footer class="ease-modal-footer">
        <a href="#" class="demo-button">
          Close
        </a>
      </footer>

    </div>
  </div>
</body>
</html>
