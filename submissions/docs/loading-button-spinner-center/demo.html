<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centered Loading Button Spinner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="demo">
    <h1>Loading Button Spinner</h1>

    <section class="demo-section">
      <h2>Different Button Sizes</h2>

      <div class="button-row">
        <button class="ease-btn ease-btn-primary ease-btn-loading ease-btn-sm">
          Loading
        </button>

        <button class="ease-btn ease-btn-primary ease-btn-loading">
          Loading
        </button>

        <button class="ease-btn ease-btn-primary ease-btn-loading ease-btn-lg">
          Loading
        </button>

        <button class="ease-btn ease-btn-primary ease-btn-loading ease-btn-xl">
          Loading
        </button>
      </div>
    </section>

    <section class="demo-section">
      <h2>Different Button Variants</h2>

      <div class="button-row">
        <button class="ease-btn ease-btn-primary ease-btn-loading">
          Loading
        </button>

        <button class="ease-btn ease-btn-outline ease-btn-loading">
          Loading
        </button>

        <button class="ease-btn ease-btn-ghost ease-btn-loading">
          Loading
        </button>
      </div>
    </section>

    <section class="demo-section">
      <h2>Normal and Disabled Buttons</h2>

      <div class="button-row">
        <button class="ease-btn ease-btn-primary">
          Normal
        </button>

        <button class="ease-btn ease-btn-primary" disabled>
          Disabled
        </button>

        <button class="ease-btn ease-btn-primary ease-btn-loading">
          Loading
        </button>
      </div>
    </section>
  </main>
</body>
</html>
