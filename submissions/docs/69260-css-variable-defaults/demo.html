<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion CSS Variable Defaults</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>CSS Variable Defaults</h1>

    <div class="variable-card">
      <h2>Default Token Demo</h2>
      <p>
        This example demonstrates how EaseMotion CSS custom properties
        can control animation and visual defaults.
      </p>

      <div class="status">
        Duration: var(--ease-duration-medium)<br>
        Easing: var(--ease-easing-standard)<br>
        Radius: var(--ease-radius-md)<br>
        Primary Color: var(--ease-color-primary)
      </div>
    </div>
  </main>
</body>
</html>
