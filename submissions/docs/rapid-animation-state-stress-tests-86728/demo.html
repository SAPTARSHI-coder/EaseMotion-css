<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rapid Animation State Stress Test</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container">
    <h1>Rapid Animation State Stress Test</h1>

    <p class="description">
      Stress testing rapid animation start, stop, restart, direction
      changes, and repeated state transitions.
    </p>

    <div class="stage">
      <div id="box" class="stress-box"></div>
    </div>

    <div class="controls">
      <button id="start">Start</button>
      <button id="stop">Stop</button>
      <button id="restart">Restart</button>
      <button id="reverse">Reverse</button>
      <button id="stress">100x Rapid Test</button>
      <button id="cancelSequence">Cancel → Restart → Cancel</button>
    </div>

    <p id="status" class="status">Status: Ready</p>
  </main>

  <script>
    const box = document.getElementById("box");
    const status = document.getElementById("status");

    function setStatus(message) {
      status.textContent = "Status: " + message;
    }

    function startAnimation() {
      box.style.animationPlayState = "running";
      setStatus("Running");
    }

    function stopAnimation() {
      box.style.animationPlayState = "paused";
      setStatus("Paused");
    }

    function restartAnimation() {
      box.style.animation = "none";

      void box.offsetWidth;

      box.style.animation = "";
      box.style.animationPlayState = "running";

      setStatus("Restarted");
    }

    function reverseAnimation() {
      const currentDirection =
        getComputedStyle(box).animationDirection;

      box.style.animationDirection =
        currentDirection === "reverse" ? "normal" : "reverse";

      box.style.animationPlayState = "running";

      setStatus("Direction changed");
    }

    function rapidStressTest() {
      let count = 0;

      const interval = setInterval(() => {
        if (count % 2 === 0) {
          box.style.animationPlayState = "paused";
        } else {
          box.style.animationPlayState = "running";
        }

        count++;

        if (count >= 100) {
          clearInterval(interval);
          box.style.animationPlayState = "running";
          setStatus("100 rapid transitions completed");
        }
      }, 10);
    }

    function cancelRestartCancel() {
      box.style.animationPlayState = "paused";

      setTimeout(() => {
        restartAnimation();

        setTimeout(() => {
          box.style.animationPlayState = "paused";
          setStatus("Cancel → Restart → Cancel completed");
        }, 50);
      }, 50);
    }

    document.getElementById("start").addEventListener(
      "click",
      startAnimation
    );

    document.getElementById("stop").addEventListener(
      "click",
      stopAnimation
    );

    document.getElementById("restart").addEventListener(
      "click",
      restartAnimation
    );

    document.getElementById("reverse").addEventListener(
      "click",
      reverseAnimation
    );

    document.getElementById("stress").addEventListener(
      "click",
      rapidStressTest
    );

    document.getElementById("cancelSequence").addEventListener(
      "click",
      cancelRestartCancel
    );
  </script>
</body>
</html>
