<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A11y: Switch Toggle Key Handler</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="ease-switch-widget" role="dialog" aria-modal="true" aria-labelledby="switch-title">
    <h2 id="switch-title" class="ease-switch-title">Notification Settings</h2>
    <div style="margin: 2rem 0; display: flex; justify-content: center; align-items: center; gap: 1rem;">
      <label id="switch-label" style="font-weight: 500;">Enable Alerts</label>
      <button type="button" role="switch" class="ease-switch" id="toggle-switch" aria-checked="false" aria-labelledby="switch-label">
        <span class="ease-switch-thumb" aria-hidden="true"></span>
      </button>
    </div>
    <button type="button" style="background: transparent; border: 1px solid var(--sw-track); color: var(--sw-text); padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer;">Save</button>
  </main>

  <script>
    const toggle = document.getElementById('toggle-switch');

    // Toggle State
    toggle.addEventListener('click', () => {
      const isChecked = toggle.getAttribute('aria-checked') === 'true';
      toggle.setAttribute('aria-checked', !isChecked);
    });

    // Key Press Handler (Space/Enter)
    toggle.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        toggle.click();
      }
    });

    // FOCUS TRAP LOGIC
    const focusableElements = document.querySelectorAll('button');
    const first = focusableElements[0];
    const last = focusableElements[focusableElements.length - 1];

    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Tab') return;
      if (e.shiftKey) {
        if (document.activeElement === first) {
          e.preventDefault();
          last.focus();
        }
      } else {
        if (document.activeElement === last) {
          e.preventDefault();
          first.focus();
        }
      }
    });
  </script>
</body>
</html>
