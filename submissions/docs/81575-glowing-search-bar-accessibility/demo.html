<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Accessible glowing search bar demonstration.">
  <title>Glowing Search Bar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="page__header">
      <p class="eyebrow">EaseMotion CSS · #81575</p>
      <h1>Glowing Search Bar</h1>
      <p>Native search semantics with visible labels, keyboard focus, and a restrained glow.</p>
    </header>

    <section class="demo-card" aria-labelledby="search-title">
      <p class="demo-card__eyebrow">Accessibility integration</p>
      <h2 id="search-title">Search documentation</h2>
      <form class="search" role="search">
        <label class="search__label" for="site-search">Search the documentation</label>
        <div class="search__field">
          <span class="search__icon" aria-hidden="true">⌕</span>
          <input class="search__input" id="site-search" name="q" type="search" placeholder="Search topics">
          <button class="search__button" type="submit">Search</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
