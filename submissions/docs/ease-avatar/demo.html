<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion CSS-Only Avatar Showcase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div style="max-width: 900px; width: 100%; padding: 2rem 1rem;">
    <h1 style="text-align: center; font-size: 2.25rem; margin-bottom: 0.5rem; color: #f8fafc;">EaseMotion CSS-Only Avatar</h1>
    <p style="text-align: center; color: #94a3b8; margin-bottom: 3rem;">Pure HTML/CSS Avatar Component with Size Modifiers, Status Badges &amp; Zero-JS Fallback</p>

    <!-- Section 1: Image Avatars -->
    <section class="ease-docs-grid" style="background: #1e293b; border-radius: 12px; margin-bottom: 2.5rem;">
      <h3 style="width: 100%; text-align: center; color: #94a3b8; margin-bottom: 1rem;">Image Avatars (sm, md, lg)</h3>
      <div class="ease-avatar ease-avatar--sm">
        <img src="https://i.pravatar.cc/150?img=1" alt="User Avatar Small">
      </div>
      <div class="ease-avatar ease-avatar--md">
        <img src="https://i.pravatar.cc/150?img=2" alt="User Avatar Medium">
      </div>
      <div class="ease-avatar ease-avatar--lg">
        <img src="https://i.pravatar.cc/150?img=3" alt="User Avatar Large">
      </div>
    </section>

    <!-- Section 2: Initials Fallback -->
    <section class="ease-docs-grid" style="background: #1e293b; border-radius: 12px; margin-bottom: 2.5rem;">
      <h3 style="width: 100%; text-align: center; color: #94a3b8; margin-bottom: 1rem;">Initials Fallback (Zero JS)</h3>
      <div class="ease-avatar ease-avatar--sm" data-initials="SM"></div>
      <div class="ease-avatar ease-avatar--md" data-initials="JD"></div>
      <div class="ease-avatar ease-avatar--lg" data-initials="EM"></div>
    </section>

    <!-- Section 3: Status Indicators -->
    <section class="ease-docs-grid" style="background: #1e293b; border-radius: 12px; margin-bottom: 1rem;">
      <h3 style="width: 100%; text-align: center; color: #94a3b8; margin-bottom: 1rem;">Status Indicators (Online, Busy, Offline)</h3>
      <div class="ease-avatar ease-avatar--md ease-avatar--status ease-avatar--online" data-initials="ON">
        <img src="https://i.pravatar.cc/150?img=4" alt="Online User">
      </div>
      <div class="ease-avatar ease-avatar--md ease-avatar--status ease-avatar--busy" data-initials="BU">
        <img src="https://i.pravatar.cc/150?img=5" alt="Busy User">
      </div>
      <div class="ease-avatar ease-avatar--md ease-avatar--status ease-avatar--offline" data-initials="OFF">
        <img src="https://i.pravatar.cc/150?img=6" alt="Offline User">
      </div>
      <!-- Also showing initials with status indicators -->
      <div class="ease-avatar ease-avatar--md ease-avatar--status ease-avatar--online" data-initials="AB"></div>
      <div class="ease-avatar ease-avatar--md ease-avatar--status ease-avatar--busy" data-initials="CD"></div>
      <div class="ease-avatar ease-avatar--md ease-avatar--status ease-avatar--offline" data-initials="EF"></div>
    </section>
  </div>
</body>
</html>
