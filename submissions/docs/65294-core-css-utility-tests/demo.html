<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Core CSS Utility Tests</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container">
    <h1>Core CSS Utility Tests</h1>

    <section class="test-card">
      <h2>Flexbox Utility</h2>
      <div class="flex-demo">
        <span>Item 1</span>
        <span>Item 2</span>
      </div>
      <p>Expected: <code>display: flex</code></p>
    </section>

    <section class="test-card">
      <h2>Alignment Utility</h2>
      <div class="alignment-demo">
        <span>Centered Item</span>
      </div>
      <p>Expected: centered alignment.</p>
    </section>

    <section class="test-card">
      <h2>Grid Utility</h2>
      <div class="grid-demo">
        <span>1</span>
        <span>2</span>
        <span>3</span>
      </div>
      <p>Expected: <code>display: grid</code></p>
    </section>

    <section class="test-card">
      <h2>Spacing Utility</h2>
      <div class="spacing-demo">
        <span>Spacing example</span>
      </div>
      <p>Expected: consistent padding and spacing.</p>
    </section>
  </main>
</body>
</html>
