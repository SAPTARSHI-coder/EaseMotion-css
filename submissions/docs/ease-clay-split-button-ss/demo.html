<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claymorphism Dropdown Split Button - Quickstart Guide</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="ease-clay-card" aria-labelledby="guide-title">
    <header style="text-align: center;">
      <span style="background: var(--clay-text); color: var(--clay-bg); padding: 6px 12px; border-radius: 12px; font-size: 0.75rem; font-weight: 900; text-transform: uppercase; letter-spacing: 1px;">Quickstart Guide</span>
      <h1 id="guide-title" style="font-size: 2.25rem; font-weight: 900; margin: 1rem 0 0.5rem 0; letter-spacing: -1px;">Claymorphism Split Button</h1>
      <p style="color: #475569; font-size: 1rem; max-width: 500px; margin: 0 auto; line-height: 1.6; font-weight: 600;">
        Inflated 3D buttons with soft inner shadows, distinct main actions, and accessible WAI-ARIA dropdown menus.
      </p>
    </header>

    <div style="display: flex; gap: 2rem; flex-wrap: wrap; justify-content: center; width: 100%;">
      
      <!-- Default Variant -->
      <div class="ease-clay-split-wrapper">
        <div class="ease-clay-split-group">
          <button type="button" class="ease-clay-btn ease-clay-btn-main">Save Draft</button>
          <button type="button" class="ease-clay-btn ease-clay-btn-trigger" aria-haspopup="menu" aria-expanded="false" aria-label="More save options">
            ▼
          </button>
        </div>
        <div class="ease-clay-dropdown" role="menu">
          <button type="button" class="ease-clay-menu-item" role="menuitem">Publish Now</button>
          <button type="button" class="ease-clay-menu-item" role="menuitem">Schedule...</button>
          <div style="height: 1px; background: var(--clay-inner-dark); margin: 0.25rem 0;"></div>
          <button type="button" class="ease-clay-menu-item" role="menuitem" style="color: #ef4444;">Discard</button>
        </div>
      </div>

      <!-- Primary Variant (Blue) -->
      <div class="ease-clay-split-wrapper ease-clay-primary">
        <div class="ease-clay-split-group">
          <button type="button" class="ease-clay-btn ease-clay-btn-main">Merge Pull Request</button>
          <button type="button" class="ease-clay-btn ease-clay-btn-trigger" aria-haspopup="menu" aria-expanded="false" aria-label="More merge options">
            ▼
          </button>
        </div>
        <div class="ease-clay-dropdown" role="menu">
          <button type="button" class="ease-clay-menu-item" role="menuitem">Squash and merge</button>
          <button type="button" class="ease-clay-menu-item" role="menuitem">Rebase and merge</button>
        </div>
      </div>

      <!-- Accent Variant (Pink) + Small -->
      <div class="ease-clay-split-wrapper ease-clay-accent ease-clay-sm">
        <div class="ease-clay-split-group">
          <button type="button" class="ease-clay-btn ease-clay-btn-main">Deploy</button>
          <button type="button" class="ease-clay-btn ease-clay-btn-trigger" aria-haspopup="menu" aria-expanded="false" aria-label="Deploy options">
            ▼
          </button>
        </div>
        <div class="ease-clay-dropdown" role="menu">
          <button type="button" class="ease-clay-menu-item" role="menuitem">Production</button>
          <button type="button" class="ease-clay-menu-item" role="menuitem">Staging</button>
        </div>
      </div>

    </div>
    
    <footer style="font-size: 0.875rem; color: #64748b; font-weight: 600; text-align: center;">
      Interact via click or use <strong>Tab</strong>, <strong>Enter/Space</strong>, and <strong>Arrow Keys</strong> to navigate the menus.
    </footer>
  </main>

  <script>
    // Dropdown & WAI-ARIA Keyboard Controller
    const wrappers = document.querySelectorAll('.ease-clay-split-wrapper');

    wrappers.forEach(wrapper => {
      const triggerBtn = wrapper.querySelector('.ease-clay-btn-trigger');
      const dropdown = wrapper.querySelector('.ease-clay-dropdown');
      const menuItems = Array.from(dropdown.querySelectorAll('.ease-clay-menu-item'));

      function openMenu() {
        dropdown.classList.add('is-open');
        triggerBtn.setAttribute('aria-expanded', 'true');
        triggerBtn.classList.add('is-pressed');
        if (menuItems.length > 0) menuItems[0].focus();
      }

      function closeMenu() {
        dropdown.classList.remove('is-open');
        triggerBtn.setAttribute('aria-expanded', 'false');
        triggerBtn.classList.remove('is-pressed');
        triggerBtn.focus();
      }

      triggerBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const isOpen = dropdown.classList.contains('is-open');
        isOpen ? closeMenu() : openMenu();
      });

      // Keyboard Arrow Navigation within dropdown
      dropdown.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          closeMenu();
          return;
        }
        const currentIndex = menuItems.indexOf(document.activeElement);
        let nextIndex = null;
        if (e.key === 'ArrowDown') {
          nextIndex = (currentIndex + 1) % menuItems.length;
        } else if (e.key === 'ArrowUp') {
          nextIndex = (currentIndex - 1 + menuItems.length) % menuItems.length;
        }
        if (nextIndex !== null) {
          e.preventDefault();
          menuItems[nextIndex].focus();
        }
      });
    });

    // Close menus when clicking outside
    document.addEventListener('click', (e) => {
      wrappers.forEach(wrapper => {
        if (!wrapper.contains(e.target)) {
          const triggerBtn = wrapper.querySelector('.ease-clay-btn-trigger');
          const dropdown = wrapper.querySelector('.ease-clay-dropdown');
          dropdown.classList.remove('is-open');
          triggerBtn.setAttribute('aria-expanded', 'false');
          triggerBtn.classList.remove('is-pressed');
        }
      });
    });
  </script>
</body>
</html>
