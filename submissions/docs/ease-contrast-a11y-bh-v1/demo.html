<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-contrast-a11y-bh</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #f8fafc; color: #1e293b; padding: 2rem; }
    h1 { color: #1e293b; margin-bottom: 1rem; }
    .demo-section { background: white; padding: 2rem; border-radius: 1rem; margin-bottom: 1rem; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    .demo-section h2 { margin-bottom: 1rem; }
    button, input, a { margin: 0.5rem; padding: 0.75rem 1.5rem; }
    button { background: #6366f1; color: white; border: none; border-radius: 0.5rem; cursor: pointer; }
    input { border: 1px solid #cbd5e1; border-radius: 0.5rem; padding: 0.75rem; }
    a { color: #6366f1; }
    .note { background: #fef3c7; padding: 1rem; border-radius: 0.5rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <h1>ease-contrast-a11y-bh</h1>
  <div class="note">Enable "Increase contrast" in your OS accessibility settings to see the effect.</div>
  
  <div class="demo-section">
    <h2>Interactive Elements</h2>
    <button>Button (Focus to see outline)</button>
    <input type="text" placeholder="Input field">
    <a href="#">Link</a>
  </div>
  
  <div class="demo-section">
    <h2>Card Component</h2>
    <div class="card" style="padding: 1rem; border-radius: 0.5rem;">
      <p>This card has box-shadow. With high contrast mode, it gets a solid border instead.</p>
    </div>
  </div>
</body>
</html>
