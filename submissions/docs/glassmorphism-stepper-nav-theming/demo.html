<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism Stepper Nav (Theming) Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="background-wrapper">
        
        <!-- Default Light Theme -->
        <div class="demo-section">
            <h2>Light Frosted Glass</h2>
            <nav aria-label="Registration Progress" class="glass-stepper">
                <ol class="stepper-list">
                    <li class="stepper-item is-complete">
                        <a href="#account" class="stepper-link">
                            <span class="stepper-circle" aria-hidden="true">✓</span>
                            <span class="stepper-label">Account</span>
                        </a>
                    </li>
                    <li class="stepper-item is-active">
                        <a href="#profile" class="stepper-link" aria-current="step">
                            <span class="stepper-circle" aria-hidden="true">2</span>
                            <span class="stepper-label">Profile</span>
                        </a>
                    </li>
                </ol>
            </nav>
        </div>

        <!-- Dark Theme Modifier -->
        <div class="demo-section">
            <h2>Dark Obsidian Glass</h2>
            <nav aria-label="Checkout Progress" class="glass-stepper glass-stepper--dark">
                <ol class="stepper-list">
                    <li class="stepper-item is-complete">
                        <a href="#cart" class="stepper-link">
                            <span class="stepper-circle" aria-hidden="true">✓</span>
                            <span class="stepper-label">Cart</span>
                        </a>
                    </li>
                    <li class="stepper-item is-active">
                        <a href="#payment" class="stepper-link" aria-current="step">
                            <span class="stepper-circle" aria-hidden="true">2</span>
                            <span class="stepper-label">Payment</span>
                        </a>
                    </li>
                </ol>
            </nav>
        </div>

    </main>
</body>
</html>
