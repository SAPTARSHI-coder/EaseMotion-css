<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion Dynamic Input Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ease-docs-grid">
    <h3 style="color: #94a3b8; font-size: 0.875rem; text-transform: uppercase; letter-spacing: 1px; width: 100%; border-bottom: 1px solid #334155; padding-bottom: 0.5rem; margin-bottom: 1rem;">Standard Text Input</h3>
    
    <div class="ease-input-group">
      <input type="text" id="username" class="ease-input" placeholder=" " required />
      <label for="username" class="ease-label">Username</label>
    </div>

    <h3 style="color: #94a3b8; font-size: 0.875rem; text-transform: uppercase; letter-spacing: 1px; width: 100%; border-bottom: 1px solid #334155; padding-bottom: 0.5rem; margin-bottom: 1rem;">Email Validation with Live Feedback</h3>

    <div class="ease-input-group">
      <input type="email" id="email" class="ease-input" placeholder=" " required />
      <label for="email" class="ease-label">Email Address</label>
      <span class="ease-error-msg">Please enter a valid email address</span>
    </div>
  </div>
</body>
</html>
