<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Sidebar Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="layout">
        <nav class="animated-sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Logo</h2>
                <button class="toggle-btn" id="toggleBtn">☰</button>
            </div>
            <ul class="sidebar-menu">
                <li><a href="#"><span class="icon">🏠</span><span class="text">Home</span></a></li>
                <li><a href="#"><span class="icon">📊</span><span class="text">Dashboard</span></a></li>
                <li><a href="#"><span class="icon">✉️</span><span class="text">Messages</span></a></li>
                <li><a href="#"><span class="icon">⚙️</span><span class="text">Settings</span></a></li>
            </ul>
        </nav>
        <main class="main-content">
            <h1>Animated Sidebar</h1>
            <p>Click the hamburger icon to toggle the sidebar smoothly.</p>
        </main>
    </div>
    <script>
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('toggleBtn');
        toggleBtn.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');
        });
    </script>
</body>
</html>
