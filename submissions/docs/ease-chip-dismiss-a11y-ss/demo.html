<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A11y: Chip Dismiss ARIA Label & Focus Trap</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Screen Reader Live Announcer -->
  <div id="chip-announcer" aria-live="polite" style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0;"></div>

  <!-- Focus Trap Widget Container -->
  <main class="ease-chip-widget" id="manage-tags-widget" role="dialog" aria-modal="true" aria-labelledby="widget-title">
    <div class="ease-chip-header">
      <h2 id="widget-title" class="ease-chip-title">Manage Required Skills</h2>
      <button type="button" class="ease-widget-close" id="btn-close-widget" aria-label="Close manage tags dialog">Done</button>
    </div>
    
    <ul class="ease-chip-list" aria-label="Active skills">
      <li class="ease-chip" id="chip-react">
        <span id="label-react">React</span>
        <button type="button" class="ease-chip-dismiss" aria-label="Remove React tag" aria-describedby="label-react">
          <span aria-hidden="true">✕</span>
        </button>
      </li>
      <li class="ease-chip" id="chip-a11y">
        <span id="label-a11y">Accessibility</span>
        <button type="button" class="ease-chip-dismiss" aria-label="Remove Accessibility tag" aria-describedby="label-a11y">
          <span aria-hidden="true">✕</span>
        </button>
      </li>
      <li class="ease-chip" id="chip-node">
        <span id="label-node">Node.js</span>
        <button type="button" class="ease-chip-dismiss" aria-label="Remove Node.js tag" aria-describedby="label-node">
          <span aria-hidden="true">✕</span>
        </button>
      </li>
    </ul>
  </main>

  <script>
    const widget = document.getElementById('manage-tags-widget');
    const closeBtn = document.getElementById('btn-close-widget');
    const announcer = document.getElementById('chip-announcer');
    const chipList = document.querySelector('.ease-chip-list');

    // Handle Chip Dismissal & Focus Management
    chipList.addEventListener('click', (e) => {
      const dismissBtn = e.target.closest('.ease-chip-dismiss');
      if (!dismissBtn) return;

      const chip = dismissBtn.closest('.ease-chip');
      const tagName = chip.querySelector('span:not([aria-hidden])').textContent;
      
      // Determine next element to focus before removing
      const allDismissBtns = Array.from(chipList.querySelectorAll('.ease-chip-dismiss'));
      const currentIndex = allDismissBtns.indexOf(dismissBtn);
      let nextFocusBtn = null;
      
      if (allDismissBtns.length > 1) {
        // Focus next chip if available, otherwise focus previous
        nextFocusBtn = allDismissBtns[currentIndex + 1] || allDismissBtns[currentIndex - 1];
      } else {
        // If it was the last chip, focus the close button
        nextFocusBtn = closeBtn;
      }

      // Remove chip and announce
      chip.remove();
      announcer.textContent = tagName + ' tag removed.';

      // Shift focus to prevent focus loss (document.body reset)
      if (nextFocusBtn) nextFocusBtn.focus();
    });

    // KEYBOARD FOCUS TRAP LOGIC
    widget.addEventListener('keydown', (e) => {
      if (e.key !== 'Tab') return;

      // Get all focusable elements within the widget
      const focusableElements = widget.querySelectorAll('button:not([disabled])');
      if (focusableElements.length === 0) return;
      
      const firstElement = focusableElements[0];
      const lastElement = focusableElements[focusableElements.length - 1];

      if (e.shiftKey) {
        // Shift + Tab: Loop to bottom if at top
        if (document.activeElement === firstElement) {
          e.preventDefault();
          lastElement.focus();
        }
      } else {
        // Tab: Loop to top if at bottom
        if (document.activeElement === lastElement) {
          e.preventDefault();
          firstElement.focus();
        }
      }
    });
  </script>
</body>
</html>
