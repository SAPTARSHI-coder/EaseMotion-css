<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accessible Claymorphism Split Button</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="page__header">
      <p class="eyebrow">EaseMotion CSS · #85833</p>
      <h1>Accessible Split Button</h1>
      <p>Native controls, accurate menu state, visible focus, and responsive presentation.</p>
    </header>
    <section class="demo-card" aria-labelledby="title">
      <h2 id="title">Save document</h2>
      <div class="split-button">
        <button class="split-button__primary" type="button">Save</button>
        <button class="split-button__toggle" type="button" aria-expanded="false" aria-controls="save-menu" aria-label="More save options">⌄</button>
        <div class="split-button__menu" id="save-menu" hidden>
          <button type="button">Save as template</button>
          <button type="button">Save and close</button>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
