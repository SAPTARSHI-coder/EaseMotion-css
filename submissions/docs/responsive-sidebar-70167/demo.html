<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Sidebar Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="layout">
        <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle Sidebar">
            ☰ Menu
        </button>
        
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>EaseMotion</h2>
                <button class="sidebar-close" id="sidebarClose" aria-label="Close Sidebar">×</button>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item">Dashboard</a>
                <a href="#" class="nav-item">Components</a>
                <a href="#" class="nav-item">Settings</a>
            </nav>
        </aside>
        
        <main class="main-content">
            <h1>Responsive Sidebar Example</h1>
            <p>This is a demonstration of a responsive sidebar component for EaseMotion CSS. Resize the window to see how it collapses on smaller screens and uses a slide-in animation.</p>
        </main>
        
        <div class="overlay" id="overlay"></div>
    </div>

    <script>
        const toggleBtn = document.getElementById('sidebarToggle');
        const closeBtn = document.getElementById('sidebarClose');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        function openSidebar() {
            sidebar.classList.add('active');
            overlay.classList.add('active');
        }

        function closeSidebar() {
            sidebar.classList.remove('active');
            overlay.classList.remove('active');
        }

        toggleBtn.addEventListener('click', openSidebar);
        closeBtn.addEventListener('click', closeSidebar);
        overlay.addEventListener('click', closeSidebar);
    </script>
</body>
</html>
