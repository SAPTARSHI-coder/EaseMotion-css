<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interactive Notification Badge — Advanced</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="demo-shell">
    <header>
      <p>EaseMotion example</p>
      <h1>Interactive Notification Badge</h1>
      <p>Advanced styling with semantic interaction and clear focus treatment.</p>
    </header>
    <section class="demo-card" aria-labelledby="heading">
      <div>
        <h2 id="heading">Activity</h2>
        <p>Four notifications are waiting for review.</p>
      </div>
      <button class="notification-badge notification-badge--accent" type="button" aria-label="Open 4 notifications">
        <span aria-hidden="true">4</span>
      </button>
    </section>
  </main>
</body>
</html>
