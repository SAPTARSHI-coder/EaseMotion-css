<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark Mode Tabs</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo">
    <h1>Dark Mode Tabs</h1>

    <div class="tabs" role="tablist" aria-label="Content tabs">

      <button
        class="tabs__tab tabs__tab--active"
        id="tab-home"
        role="tab"
        aria-selected="true"
        aria-controls="panel-home"
        tabindex="0">
        Home
      </button>

      <button
        class="tabs__tab"
        id="tab-profile"
        role="tab"
        aria-selected="false"
        aria-controls="panel-profile"
        tabindex="-1">
        Profile
      </button>

      <button
        class="tabs__tab"
        id="tab-settings"
        role="tab"
        aria-selected="false"
        aria-controls="panel-settings"
        tabindex="-1">
        Settings
      </button>

    </div>

    <section
      class="tabs__panel"
      id="panel-home"
      role="tabpanel"
      aria-labelledby="tab-home">

      <h2>Home</h2>
      <p>Welcome to the Dark Mode Tabs component.</p>

    </section>

    <section
      class="tabs__panel"
      id="panel-profile"
      role="tabpanel"
      aria-labelledby="tab-profile"
      hidden>

      <h2>Profile</h2>
      <p>View your profile information here.</p>

    </section>

    <section
      class="tabs__panel"
      id="panel-settings"
      role="tabpanel"
      aria-labelledby="tab-settings"
      hidden>

      <h2>Settings</h2>
      <p>Manage your application settings here.</p>

    </section>
  </main>

  <script>
    const tabs = document.querySelectorAll('[role="tab"]');
    const panels = document.querySelectorAll('[role="tabpanel"]');

    tabs.forEach((tab) => {
      tab.addEventListener("click", () => {
        tabs.forEach((item) => {
          item.classList.remove("tabs__tab--active");
          item.setAttribute("aria-selected", "false");
          item.tabIndex = -1;
        });

        panels.forEach((panel) => {
          panel.hidden = true;
        });

        tab.classList.add("tabs__tab--active");
        tab.setAttribute("aria-selected", "true");
        tab.tabIndex = 0;

        const panel = document.getElementById(
          tab.getAttribute("aria-controls")
        );

        panel.hidden = false;
        tab.focus();
      });
    });
  </script>

</body>
</html>
