<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flex & Grid Layout Utilities - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="docs-layout">
    <header>
      <h1>Layout Utilities Showcase</h1>
      <p>Live examples for <code>ease-flex</code> and <code>ease-grid</code> (#56089)</p>
    </header>
    <section class="example-panel">
      <h2>1. Flexbox Alignment (<code>ease-flex ease-flex-center</code>)</h2>
      <div class="ease-flex ease-flex-center demo-box">
        <div class="item">Flex Item A</div>
        <div class="item">Flex Item B</div>
        <div class="item">Flex Item C</div>
      </div>
    </section>
    <section class="example-panel">
      <h2>2. Responsive Grid (<code>ease-grid ease-grid-3</code>)</h2>
      <div class="ease-grid ease-grid-3 demo-box">
        <div class="grid-item">Grid Col 1</div>
        <div class="grid-item">Grid Col 2</div>
        <div class="grid-item">Grid Col 3</div>
        <div class="grid-item">Grid Col 4</div>
        <div class="grid-item">Grid Col 5</div>
        <div class="grid-item">Grid Col 6</div>
      </div>
    </section>
  </div>
</body>
</html>
