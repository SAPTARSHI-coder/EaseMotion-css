<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion Animation Preset System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <h1>Animation Preset System</h1>

    <p>
      Choose a predefined animation preset and apply it to multiple elements.
    </p>

    <div class="controls">
      <select id="preset">
        <option value="fade">Fade In</option>
        <option value="slide">Slide Up</option>
        <option value="zoom">Zoom In</option>
        <option value="bounce">Bounce</option>
        <option value="rotate">Rotate</option>
      </select>

      <select id="duration">
        <option value="0.5s">0.5s</option>
        <option value="1s" selected>1s</option>
        <option value="2s">2s</option>
      </select>

      <select id="easing">
        <option value="ease">Ease</option>
        <option value="ease-in">Ease In</option>
        <option value="ease-out">Ease Out</option>
        <option value="linear">Linear</option>
      </select>

      <button id="apply">Apply Preset</button>
    </div>

    <section class="demo-grid">
      <div class="demo-box">Element 1</div>
      <div class="demo-box">Element 2</div>
      <div class="demo-box">Element 3</div>
    </section>

    <p id="status">Preset: None</p>
  </main>

  <script>
    const presetSelect = document.getElementById("preset");
    const durationSelect = document.getElementById("duration");
    const easingSelect = document.getElementById("easing");
    const applyButton = document.getElementById("apply");
    const status = document.getElementById("status");

    const presetMap = {
      fade: "ease-preset-fade",
      slide: "ease-preset-slide",
      zoom: "ease-preset-zoom",
      bounce: "ease-preset-bounce",
      rotate: "ease-preset-rotate"
    };

    const presetClasses = Object.values(presetMap);

    applyButton.addEventListener("click", () => {
      const preset = presetSelect.value;
      const duration = durationSelect.value;
      const easing = easingSelect.value;

      document.querySelectorAll(".demo-box").forEach((element) => {
        element.classList.remove(...presetClasses);

        void element.offsetWidth;

        element.style.setProperty("--preset-duration", duration);
        element.style.setProperty("--preset-easing", easing);

        element.classList.add(presetMap[preset]);
      });

      status.textContent =
        `Preset: ${preset} | Duration: ${duration} | Easing: ${easing}`;
    });
  </script>

</body>
</html>
