<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pastel Pagination - Basic Usage</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <h1>Pastel Pagination</h1>
    <p>Basic usage example of the Pastel Pagination component.</p>

    <nav class="pastel-pagination" aria-label="Pagination">
      <a href="#" class="pagination-item" aria-label="Previous page">
        &laquo;
      </a>

      <a href="#" class="pagination-item active" aria-current="page">
        1
      </a>

      <a href="#" class="pagination-item">2</a>
      <a href="#" class="pagination-item">3</a>
      <a href="#" class="pagination-item">4</a>

      <a href="#" class="pagination-item" aria-label="Next page">
        &raquo;
      </a>
    </nav>
  </main>

</body>
</html>
