<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentation: Retro Pixel Avatar Group with Accessibility Integration - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-demo-container">
        <!-- Pure CSS Retro Pixel Avatar Group Accessibility Integration Documentation Showcase -->
        <header class="em-avatar-doc-card" role="region" aria-label="Retro Pixel Avatar Group Documentation Showcase" tabindex="0">
            <div class="em-avatar-header-bar">
                <span class="em-card-badge">COMPONENT DOCS</span>
                <span class="em-brand-logo">PixelMotion</span>
            </div>
            <h1 class="em-card-title">Retro Pixel Avatar Group (Accessibility)</h1>
            <p class="em-card-desc">Complete integration guide, accessible group grouping markup, and live demo for the EaseMotion Retro Pixel Avatar Group component (#87087).</p>
            <div class="em-avatar-wrapper">
                <div class="ease-pixel-avatar-group em-avatar-accessible" role="group" aria-label="Team Member Pixel Avatars" tabindex="0">
                    <div class="em-pixel-avatar" role="img" aria-label="Avatar of User Alpha" tabindex="0">
                        <span class="em-avatar-text">A1</span>
                    </div>
                    <div class="em-pixel-avatar" role="img" aria-label="Avatar of User Beta" tabindex="0">
                        <span class="em-avatar-text">B2</span>
                    </div>
                    <div class="em-pixel-avatar" role="img" aria-label="Avatar of User Gamma" tabindex="0">
                        <span class="em-avatar-text">G3</span>
                    </div>
                    <div class="em-pixel-badge" aria-label="Plus 4 more members">+4</div>
                </div>
            </div>
        </header>
    </div>
</body>
</html>
