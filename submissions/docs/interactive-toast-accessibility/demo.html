<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessible Interactive Toast</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo">
    <h1>Interactive Toast</h1>
    <p>Accessible toast notification with keyboard-friendly controls.</p>

    <button
      class="toast-trigger"
      type="button"
      onclick="showToast()"
    >
      Show Toast
    </button>

    <section
      id="toast"
      class="toast"
      role="status"
      aria-live="polite"
      aria-atomic="true"
      hidden
    >
      <div class="toast__content">
        <strong class="toast__title">Success</strong>
        <p class="toast__message">
          Your changes have been saved successfully.
        </p>
      </div>

      <button
        class="toast__close"
        type="button"
        aria-label="Close notification"
        onclick="hideToast()"
      >
        &times;
      </button>
    </section>
  </main>

  <script>
    function showToast() {
      const toast = document.getElementById("toast");
      toast.hidden = false;

      const closeButton = toast.querySelector(".toast__close");
      closeButton.focus();
    }

    function hideToast() {
      const toast = document.getElementById("toast");
      toast.hidden = true;
    }
  </script>

</body>
</html>
