<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Badge — Showcase & Usage</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="ease-container">
    <p class="ease-eyebrow">UI Showcase</p>
    <h1 class="ease-heading">Responsive Badge</h1>
    <p class="ease-subtitle">A flexible badge component that seamlessly scales typography, padding, and layout density across screen viewports and container dimensions.</p>

    <div class="ease-card" role="region" aria-label="Responsive badge showcase container">
      <div class="ease-badge-group">
        <!-- Default Responsive Badge -->
        <span class="ease-badge ease-badge-primary" role="status">
          <span class="ease-badge-icon" aria-hidden="true">🚀</span>
          <span class="ease-badge-text">v2.4.0 Release</span>
        </span>

        <!-- Secondary Variant Badge -->
        <span class="ease-badge ease-badge-accent" role="status">
          <span class="ease-badge-dot" aria-hidden="true"></span>
          <span class="ease-badge-text">Production Ready</span>
        </span>

        <!-- Compact Variant Badge -->
        <span class="ease-badge ease-badge-outline" role="status">
          <span class="ease-badge-text">Auto-Scaled</span>
        </span>
      </div>
    </div>
  </main>
</body>
</html>
