<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bubble Pop Expand Burst</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="demo">
    <section class="demo-card">
      <span class="badge">EaseMotion Core</span>

      <div class="animation-stage">
        <div class="bubble ease-anim-bubble-pop-expand-burst">
          <span>✦</span>
        </div>
      </div>

      <h1>Bubble Pop Expand Burst</h1>

      <p>
        A playful bubble-style entrance animation that expands rapidly,
        overshoots slightly, and settles into its final size.
      </p>

      <button type="button" onclick="replayAnimation()">
        Replay Animation
      </button>
    </section>
  </main>

  <script>
    function replayAnimation() {
      const element = document.querySelector(
        ".ease-anim-bubble-pop-expand-burst"
      );

      element.classList.remove("ease-anim-bubble-pop-expand-burst");

      void element.offsetWidth;

      element.classList.add("ease-anim-bubble-pop-expand-burst");
    }
  </script>
</body>
</html>
