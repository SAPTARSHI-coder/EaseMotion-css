<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Advanced SaaS modern switch toggle demonstration.">
  <title>SaaS Modern Switch Toggle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="page__header">
      <p class="eyebrow">EaseMotion CSS · #81608</p>
      <h1>SaaS Modern Switch Toggle</h1>
      <p>A polished setting control built around a native checkbox and reusable theme variables.</p>
    </header>
    <section class="demo-card" aria-labelledby="settings-title">
      <p class="demo-card__eyebrow">Advanced styling</p>
      <h2 id="settings-title">Workspace settings</h2>
      <label class="switch">
        <input class="switch__input" type="checkbox" name="notifications" checked>
        <span class="switch__track" aria-hidden="true"><span class="switch__thumb"></span></span>
        <span class="switch__label">Product notifications</span>
      </label>
    </section>
  </main>
</body>
</html>
