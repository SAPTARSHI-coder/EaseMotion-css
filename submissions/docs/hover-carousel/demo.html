<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hover Carousel — Showcase & Usage</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="ease-container">
    <p class="ease-eyebrow">UI Showcase</p>
    <h1 class="ease-heading">Hover Carousel</h1>
    <p class="ease-subtitle">Hover or focus on cards to highlight featured items.</p>

    <div class="ease-carousel-track" role="region" aria-label="Interactive Carousel">
      <article class="ease-carousel-card" tabindex="0">
        <span class="ease-card-tag">01 / Design</span>
        <h2 class="ease-card-title">Scalable Systems</h2>
        <p class="ease-card-desc">Modular CSS patterns optimized for performance.</p>
      </article>

      <article class="ease-carousel-card" tabindex="0">
        <span class="ease-card-tag">02 / Motion</span>
        <h2 class="ease-card-title">Fluid Animations</h2>
        <p class="ease-card-desc">Smooth spring expansion transforms driven by custom beziers.</p>
      </article>
    </div>
  </main>
</body>
</html>
