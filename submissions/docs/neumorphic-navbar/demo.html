<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neumorphic Navbar — Showcase & Usage</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="ease-nav-header">
    <nav class="ease-neu-navbar" aria-label="Main Navigation">
      <!-- Brand Logo -->
      <a href="#home" class="ease-neu-brand">
        <span class="ease-brand-icon" aria-hidden="true">💎</span>
        <span class="ease-brand-name">SoftUI</span>
      </a>

      <!-- Pure CSS Mobile Menu Toggle Trigger -->
      <input type="checkbox" id="ease-neu-toggle" class="ease-neu-checkbox" aria-label="Toggle navigation menu" />
      <label for="ease-neu-toggle" class="ease-neu-hamburger" aria-label="Open navigation menu">
        <span class="ease-hamburger-line"></span>
        <span class="ease-hamburger-line"></span>
        <span class="ease-hamburger-line"></span>
      </label>

      <!-- Navigation Menu Links -->
      <ul class="ease-neu-menu" role="menubar">
        <li role="none">
          <a href="#home" class="ease-neu-link active" role="menuitem">Home</a>
        </li>
        <li role="none">
          <a href="#features" class="ease-neu-link" role="menuitem">Features</a>
        </li>
        <li role="none">
          <a href="#components" class="ease-neu-link" role="menuitem">Components</a>
        </li>
        <li role="none">
          <a href="#docs" class="ease-neu-link" role="menuitem">Docs</a>
        </li>
      </ul>
    </nav>
  </header>

  <main class="ease-container">
    <p class="ease-eyebrow">Tactile UI Motion</p>
    <h1 class="ease-heading">Neumorphic Navbar</h1>
    <p class="ease-subtitle">Pure CSS soft-shadow header with extruded surfaces, inset pressed active states, and mobile menu toggles.</p>
  </main>
</body>
</html>
