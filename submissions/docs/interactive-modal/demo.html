<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Modal Demo - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-demo-container">
        <!-- Pure CSS Modal Component Showcase -->
        <div class="em-modal-card" role="region" aria-label="Interactive Modal Showcase" tabindex="0">
            <span class="em-card-badge">DOCUMENTATION</span>
            <h1 class="em-card-title">Interactive Modal</h1>
            <p class="em-card-desc">A responsive, pure CSS modal dialog container featuring backdrop blur, smooth fade-in scale transitions, and glowing neon highlights.</p>
            <div class="em-modal-preview" role="dialog" aria-modal="true" aria-labelledby="modal-title">
                <div class="em-modal-header">
                    <h3 id="modal-title" class="em-modal-heading">System Alert</h3>
                    <span class="em-modal-close" aria-label="Close modal">&times;</span>
                </div>
                <p class="em-modal-body">Modal dialogue protocols engaged successfully. Frosted glassmorphism layer active.</p>
            </div>
        </div>
    </div>
</body>
</html>
