<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Glassmorphism Navbar - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Responsive Glassmorphism Navbar -->
  <header class="glass-header">
    <nav class="glass-nav" aria-label="Main Navigation">
      <a href="#" class="glass-logo">EaseMotion</a>

      <!-- CSS-only Checkbox Toggle for Mobile Menu -->
      <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Toggle navigation menu">
      <label for="nav-toggle" class="nav-toggle-label" aria-hidden="true">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </label>

      <ul class="glass-menu">
        <li><a href="#home" class="glass-link">Home</a></li>
        <li><a href="#features" class="glass-link">Features</a></li>
        <li><a href="#docs" class="glass-link active">Docs</a></li>
        <li><a href="#showcase" class="glass-link">Showcase</a></li>
        <li><a href="#github" class="glass-btn">GitHub</a></li>
      </ul>
    </nav>
  </header>

  <!-- Content Section to Showcase Glass Effect -->
  <main class="demo-content">
    <section class="hero">
      <h1>Responsive Glassmorphism Navbar</h1>
      <p>Documentation & Interactive usage guide for a modern frosted-glass CSS navbar.</p>
    </section>
  </main>

</body>
</html>
