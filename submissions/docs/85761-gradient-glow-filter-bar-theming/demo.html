<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gradient Glow Filter Bar — Theming</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="demo-shell">
    <header><p class="eyebrow">EaseMotion CSS · #85761</p><h1>Gradient Glow Filter Bar</h1><p>Themeable filter controls using CSS custom properties.</p></header>
    <section class="filter-bar" aria-labelledby="filter-title">
      <h2 id="filter-title">Filter results</h2>
      <div class="filter-bar__controls">
        <label>Category <select><option>All</option><option>Design</option></select></label>
        <label>Sort <select><option>Newest</option><option>Popular</option></select></label>
        <button type="button">Apply</button>
      </div>
    </section>
  </main>
</body>
</html>
