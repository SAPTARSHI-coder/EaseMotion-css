<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reduced Motion Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .ease-demo {
      animation: ease-kf-spin 2s infinite linear;
      width: 100px;
      height: 100px;
      background: #2196F3;
      margin: 20px 0;
    }
    @keyframes ease-kf-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <h1>Reduced Motion Accessibility</h1>
  <p>If your OS has "Reduce Motion" enabled, the square below will not spin.</p>
  <div class="ease-demo"></div>
</body>
</html>
