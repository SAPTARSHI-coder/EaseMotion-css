<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glassmorphism Video Player - Accessibility Setup</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header style="text-align: center; margin-bottom: 2.5rem; max-width: 700px;">
    <span style="background: #38bdf8; color: #020617; padding: 4px 12px; border-radius: 9999px; font-size: 0.75rem; font-weight: 800; text-transform: uppercase;">A11y Guide</span>
    <h1 style="font-size: 2rem; font-weight: 800; margin: 0.75rem 0 0.5rem 0;">Glassmorphism Player Controls</h1>
    <p style="color: #cbd5e1; font-size: 0.9375rem; line-height: 1.6;">
      A fully accessible, WCAG 2.1 AA compliant video control bar featuring translucent glass tokens, <code>role="toolbar"</code> semantics, and high-contrast <code>:focus-visible</code> rings.
    </p>
  </header>

  <!-- Video Player Region -->
  <section class="ease-player-wrapper" aria-label="Video Player Region" role="region">
    <div class="ease-player-mock-content" aria-hidden="true">Video Content Area</div>

    <!-- Accessible Control Bar -->
    <div class="ease-glass-toolbar" role="toolbar" aria-label="Video playback controls">
      
      <!-- Play/Pause Toggle -->
      <button type="button" class="ease-glass-btn" id="play-btn" aria-label="Play video" aria-pressed="false" title="Play (k)">
        <span id="play-icon" aria-hidden="true">▶</span>
      </button>

      <!-- Timeline Slider (Native Range for A11y) -->
      <div class="ease-slider-wrapper">
        <span class="ease-time-display" aria-hidden="true" id="time-current">0:00</span>
        <input type="range" class="ease-glass-slider" id="timeline-slider" min="0" max="100" value="0" aria-label="Seek video timeline" aria-valuetext="0 percent">
        <span class="ease-time-display" aria-hidden="true" id="time-total">3:45</span>
      </div>

      <!-- Mute Toggle -->
      <button type="button" class="ease-glass-btn" id="mute-btn" aria-label="Mute audio" aria-pressed="false" title="Mute (m)">
        <span id="mute-icon" aria-hidden="true">🔊</span>
      </button>

      <!-- Volume Slider -->
      <input type="range" class="ease-glass-slider" style="max-width: 80px;" id="volume-slider" min="0" max="100" value="80" aria-label="Adjust volume" aria-valuetext="80 percent volume">
      
      <!-- Fullscreen -->
      <button type="button" class="ease-glass-btn" id="fs-btn" aria-label="Enter full screen" title="Full screen (f)">
        <span aria-hidden="true">⛶</span>
      </button>

    </div>
  </section>

  <script>
    // A11y Interactive State Manager
    const playBtn = document.getElementById('play-btn');
    const playIcon = document.getElementById('play-icon');
    const muteBtn = document.getElementById('mute-btn');
    const muteIcon = document.getElementById('mute-icon');
    const timelineSlider = document.getElementById('timeline-slider');
    const volumeSlider = document.getElementById('volume-slider');

    // Toggle Play/Pause
    playBtn.addEventListener('click', () => {
      const isPlaying = playBtn.getAttribute('aria-pressed') === 'true';
      playBtn.setAttribute('aria-pressed', !isPlaying);
      playBtn.setAttribute('aria-label', isPlaying ? 'Play video' : 'Pause video');
      playBtn.classList.toggle('is-active', !isPlaying);
      playIcon.textContent = isPlaying ? '▶' : '⏸';
    });

    // Toggle Mute
    muteBtn.addEventListener('click', () => {
      const isMuted = muteBtn.getAttribute('aria-pressed') === 'true';
      muteBtn.setAttribute('aria-pressed', !isMuted);
      muteBtn.setAttribute('aria-label', isMuted ? 'Mute audio' : 'Unmute audio');
      muteBtn.classList.toggle('is-active', !isMuted);
      muteIcon.textContent = isMuted ? '🔊' : '🔇';
    });

    // Update ARIA valuetext for Screen Readers on Sliders
    timelineSlider.addEventListener('input', (e) => {
      timelineSlider.setAttribute('aria-valuetext', e.target.value + ' percent');
    });
    volumeSlider.addEventListener('input', (e) => {
      volumeSlider.setAttribute('aria-valuetext', e.target.value + ' percent volume');
    });
  </script>
</body>
</html>
