<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Basic Pastel Datepicker demonstration using a native date input.">
  <title>Pastel Datepicker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell">
    <header class="page-header">
      <p class="eyebrow">EaseMotion CSS · Issue #81550</p>
      <h1>Pastel Datepicker</h1>
      <p>A soft form control built around a native date input for dependable browser and keyboard behavior.</p>
    </header>

    <section class="datepicker" aria-labelledby="date-title">
      <p class="eyebrow">Basic usage</p>
      <h2 id="date-title">Choose a delivery date</h2>
      <div class="datepicker__field">
        <label class="datepicker__label" for="delivery-date">Delivery date</label>
        <input id="delivery-date" type="date" min="2026-08-14" aria-describedby="date-hint">
        <span class="datepicker__icon" aria-hidden="true">▣</span>
      </div>
      <p class="datepicker__hint" id="date-hint">Select a date that works for your schedule.</p>
    </section>
  </main>
</body>
</html>
