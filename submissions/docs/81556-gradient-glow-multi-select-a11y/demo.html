<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Accessible Gradient Glow Multi-Select demonstration.">
  <title>Accessible Gradient Glow Multi-Select</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell">
    <header class="page-header">
      <p class="eyebrow">EaseMotion CSS · Issue #81556</p>
      <h1>Accessible Gradient Glow Multi-Select</h1>
      <p>Native checkboxes, clear group labeling, keyboard interaction, and non-color selection cues.</p>
    </header>

    <section class="multi-select" aria-labelledby="choices-title">
      <fieldset>
        <legend id="choices-title">Select the features you want to explore</legend>
        <label class="multi-select__option">
          <input class="multi-select__input" type="checkbox" name="feature" value="animation">
          <span class="multi-select__label">Animation effects</span>
        </label>
        <label class="multi-select__option">
          <input class="multi-select__input" type="checkbox" name="feature" value="components">
          <span class="multi-select__label">UI components</span>
        </label>
        <label class="multi-select__option">
          <input class="multi-select__input" type="checkbox" name="feature" value="accessibility">
          <span class="multi-select__label">Accessibility guidance</span>
        </label>
        <label class="multi-select__option">
          <input class="multi-select__input" type="checkbox" name="feature" value="responsive">
          <span class="multi-select__label">Responsive design</span>
        </label>
      </fieldset>
      <p class="multi-select__status" aria-live="polite">Selections are optional.</p>
    </section>
  </main>
</body>
</html>
