<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentation: 3D Button Component - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-demo-container">
        <!-- Pure CSS 3D Button Documentation Showcase -->
        <header class="em-button-doc-card" role="region" aria-label="3D Button Documentation Showcase" tabindex="0">
            <div class="em-button-header-bar">
                <span class="em-card-badge">COMPONENT DOCS</span>
                <span class="em-brand-logo">ButtonMotion</span>
            </div>
            <h1 class="em-card-title">3D Button Documentation</h1>
            <p class="em-card-desc">Complete integration guide and live demo for the EaseMotion 3D Button component, featuring hardware-accelerated 3D depth shadows and interactive press animations.</p>
            <div class="em-button-wrapper">
                <button class="ease-3d-button" aria-label="Interactive 3D Button" tabindex="0">
                    <span class="em-button-label">Click 3D Depth</span>
                </button>
            </div>
        </header>
    </div>
</body>
</html>
