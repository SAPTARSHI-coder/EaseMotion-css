<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Engine Multi-Layer Keyframe Stagger — EaseMotion CSS</title>
  <link rel="stylesheet" href="../../../easemotion.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="ease-center">
  <div class="stagger-container">
    <h2>⚡ Staggered Item Sequence</h2>
    <div class="stagger-list">
      <div class="stagger-item" em="slide-up stagger-120ms-index-1">Item 1 — Automated Delay 120ms</div>
      <div class="stagger-item" em="slide-up stagger-120ms-index-2">Item 2 — Automated Delay 240ms</div>
      <div class="stagger-item" em="slide-up stagger-120ms-index-3">Item 3 — Automated Delay 360ms</div>
      <div class="stagger-item" em="slide-up stagger-120ms-index-4">Item 4 — Automated Delay 480ms</div>
    </div>
  </div>
  <script type="module" src="../../../easemotion/index.js"></script>
</body>
</html>
