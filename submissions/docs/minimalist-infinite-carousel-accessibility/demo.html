<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Infinite Carousel (Accessibility Setup) Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section class="carousel-section" aria-labelledby="carousel-title">
            <h2 id="carousel-title" class="sr-only">Featured Brands</h2>
            
            <!-- Crucial Accessibility Control -->
            <div class="carousel-controls">
                <button id="motion-toggle" class="motion-toggle-btn" aria-pressed="false">
                    <span class="sr-only">Toggle</span> Pause Animation
                </button>
            </div>
            
            <div class="infinite-carousel" role="region" aria-roledescription="carousel" aria-label="Featured Brands Carousel">
                <div class="carousel-track">
                    <!-- Original Interactive Items -->
                    <div class="carousel-item" role="group" aria-roledescription="slide" aria-label="1 of 3">
                        <a href="#" class="card" aria-label="Visit Brand X">Brand X</a>
                    </div>
                    <div class="carousel-item" role="group" aria-roledescription="slide" aria-label="2 of 3">
                        <a href="#" class="card" aria-label="Visit Brand Y">Brand Y</a>
                    </div>
                    <div class="carousel-item" role="group" aria-roledescription="slide" aria-label="3 of 3">
                        <a href="#" class="card" aria-label="Visit Brand Z">Brand Z</a>
                    </div>
                    
                    <!-- Duplicated Decorative Items (Hidden from assistive tech) -->
                    <div class="carousel-item" aria-hidden="true">
                        <a href="#" tabindex="-1" class="card">Brand X</a>
                    </div>
                    <div class="carousel-item" aria-hidden="true">
                        <a href="#" tabindex="-1" class="card">Brand Y</a>
                    </div>
                    <div class="carousel-item" aria-hidden="true">
                        <a href="#" tabindex="-1" class="card">Brand Z</a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        const motionToggle = document.getElementById('motion-toggle');
        const track = document.querySelector('.carousel-track');
        
        motionToggle.addEventListener('click', () => {
            const isPaused = motionToggle.getAttribute('aria-pressed') === 'true';
            motionToggle.setAttribute('aria-pressed', !isPaused);
            motionToggle.innerHTML = isPaused ? '<span class="sr-only">Toggle</span> Pause Animation' : '<span class="sr-only">Toggle</span> Play Animation';
            track.style.animationPlayState = isPaused ? 'running' : 'paused';
        });
    </script>
</body>
</html>
