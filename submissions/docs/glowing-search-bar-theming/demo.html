<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glowing Search Bar (Theming) Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="demo-container">
        
        <div class="demo-section">
            <h2>Default Theme (Neon Blue)</h2>
            <form action="#" role="search" class="search-form">
                <label for="search-default" class="sr-only">Search</label>
                <div class="search-wrapper">
                    <input type="search" id="search-default" class="glowing-search" placeholder="Search..." autocomplete="off">
                    <button type="submit" class="search-btn" aria-label="Submit search">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </button>
                </div>
            </form>
        </div>

        <div class="demo-section">
            <h2>Cyber Theme (Neon Green/Pink)</h2>
            <!-- Using the modifier class .search-theme-cyber -->
            <form action="#" role="search" class="search-form search-theme-cyber">
                <label for="search-cyber" class="sr-only">Cyber Search</label>
                <div class="search-wrapper">
                    <input type="search" id="search-cyber" class="glowing-search" placeholder="Enter query..." autocomplete="off">
                    <button type="submit" class="search-btn" aria-label="Submit search">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </button>
                </div>
            </form>
        </div>

    </main>
</body>
</html>
