<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scroll Progress Percentage Scroll Offset Calculation Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ease-scroll-progress-wrapper">
    <div class="ease-scroll-progress-bar" id="progress-bar"></div>
  </div>

  <main class="ease-mock-content">
    <h1>Scroll Progress Offset Testing</h1>
    <p>Scroll down to see the real-time calculation updating the DOM. The pure function driving this width calculation is strictly unit-tested against division-by-zero, NaN inputs, and elastic scrolling bounds.</p>
    <!-- Inject tall empty divs to force scrollability -->
    <div style="height: 100vh; border-bottom: 1px dashed #334155; display: flex; align-items: end; padding-bottom: 1rem;">25% Depth</div>
    <div style="height: 100vh; border-bottom: 1px dashed #334155; display: flex; align-items: end; padding-bottom: 1rem;">75% Depth</div>
    <div style="height: 50vh; display: flex; align-items: end; padding-bottom: 1rem;">100% Depth</div>
  </main>

  <script>
    // Pure calculation function for unit testing
    function calculateScrollPercentage(scrollTop, scrollHeight, clientHeight) {
      if (typeof scrollTop !== 'number' || typeof scrollHeight !== 'number' || typeof clientHeight !== 'number') return 0;
      
      const maxScroll = scrollHeight - clientHeight;
      
      // Guard: Prevent division by zero if the page isn't scrollable
      if (maxScroll <= 0) return 0; 
      
      const percentage = (scrollTop / maxScroll) * 100;
      
      // Guard: Clamp between 0 and 100 for macOS/iOS elastic bounce scrolling
      return Math.max(0, Math.min(100, percentage));
    }

    // DOM Binding
    const progressBar = document.getElementById('progress-bar');
    window.addEventListener('scroll', () => {
      const scrollTop = document.documentElement.scrollTop || document.body.scrollTop;
      const scrollHeight = document.documentElement.scrollHeight || document.body.scrollHeight;
      const clientHeight = document.documentElement.clientHeight;
      
      const progress = calculateScrollPercentage(scrollTop, scrollHeight, clientHeight);
      progressBar.style.width = `${progress}%`;
    });
  </script>
</body>
</html>
