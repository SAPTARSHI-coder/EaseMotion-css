<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A11y: Prefers-Reduced-Motion Pulse Audit</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="ease-pulse-container" aria-labelledby="pulse-audit-title">
    <h1 id="pulse-audit-title" style="color: #38bdf8; font-size: 1.5rem; margin-top: 0;">Prefers-Reduced-Motion Pulse Audit</h1>
    <p style="color: #94a3b8; font-size: 0.875rem; line-height: 1.6;">
      Compliant with WCAG 2.1 AA (2.2.2 Pause, Stop, Hide & 2.3.3 Animation from Interactions). Continuous infinite pulse loops are completely suppressed under motion reduction preferences, converting to static indicators.
    </p>
    
    <div class="ease-badge-row">
      <div class="ease-pulse-wrapper" role="status" aria-label="System operational status: live">
        <span class="ease-pulse-dot"></span>
        <span class="ease-pulse-ring" aria-hidden="true"></span>
        <span style="margin-left: 0.75rem; font-size: 0.875rem; font-weight: 600; color: #10b981;">Live Status</span>
      </div>
      
      <button type="button" class="ease-pulse-button" aria-label="Start recording action">
        Record Stream
      </button>
    </div>
  </main>
</body>
</html>
