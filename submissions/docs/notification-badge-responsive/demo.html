<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Notification Badge (Responsive) Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="demo-container">
        
        <header class="demo-header">
            <h2>Resize the window to see responsive changes</h2>
        </header>

        <div class="notification-wrapper">
            <!-- 
                The button contains the icon and the badge.
                aria-label describes the total state for screen readers.
            -->
            <button type="button" class="notification-btn" aria-label="Notifications, 3 unread messages">
                <svg class="bell-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
                
                <!-- aria-hidden="true" because the aria-label on the button handles the announcement -->
                <span class="notification-badge" aria-hidden="true">3</span>
            </button>
        </div>

    </main>
</body>
</html>
