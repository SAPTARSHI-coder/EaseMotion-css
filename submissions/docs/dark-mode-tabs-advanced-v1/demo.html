<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark Mode Tabs - Advanced Styling</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo">
    <h1>Dark Mode Tabs</h1>

    <div class="tabs" role="tablist" aria-label="Content sections">

      <button
        class="tabs__tab tabs__tab--active"
        id="tab-home"
        role="tab"
        aria-selected="true"
        aria-controls="panel-home"
        tabindex="0">
        Home
      </button>

      <button
        class="tabs__tab"
        id="tab-profile"
        role="tab"
        aria-selected="false"
        aria-controls="panel-profile"
        tabindex="-1">
        Profile
      </button>

      <button
        class="tabs__tab"
        id="tab-settings"
        role="tab"
        aria-selected="false"
        aria-controls="panel-settings"
        tabindex="-1">
        Settings
      </button>

    </div>

    <section
      class="tabs__panel"
      id="panel-home"
      role="tabpanel"
      aria-labelledby="tab-home">

      <h2>Home</h2>
      <p>Welcome to the dark mode tabs component.</p>

    </section>

    <section
      class="tabs__panel"
      id="panel-profile"
      role="tabpanel"
      aria-labelledby="tab-profile"
      hidden>

      <h2>Profile</h2>
      <p>View your profile information here.</p>

    </section>

    <section
      class="tabs__panel"
      id="panel-settings"
      role="tabpanel"
      aria-labelledby="tab-settings"
      hidden>

      <h2>Settings</h2>
      <p>Manage your application settings here.</p>

    </section>
  </main>

  <script>
    const tabs = document.querySelectorAll('[role="tab"]');
    const panels = document.querySelectorAll('[role="tabpanel"]');

    function activateTab(tab) {
      tabs.forEach((item) => {
        const active = item === tab;

        item.setAttribute("aria-selected", active);
        item.tabIndex = active ? 0 : -1;
        item.classList.toggle("tabs__tab--active", active);
      });

      panels.forEach((panel) => {
        panel.hidden = panel.id !== tab.getAttribute("aria-controls");
      });

      tab.focus();
    }

    tabs.forEach((tab, index) => {
      tab.addEventListener("click", () => {
        activateTab(tab);
      });

      tab.addEventListener("keydown", (event) => {
        let nextIndex = index;

        if (event.key === "ArrowRight") {
          nextIndex = (index + 1) % tabs.length;
        } else if (event.key === "ArrowLeft") {
          nextIndex = (index - 1 + tabs.length) % tabs.length;
        } else if (event.key === "Home") {
          nextIndex = 0;
        } else if (event.key === "End") {
          nextIndex = tabs.length - 1;
        } else {
          return;
        }

        event.preventDefault();
        activateTab(tabs[nextIndex]);
      });
    });
  </script>

</body>
</html>
