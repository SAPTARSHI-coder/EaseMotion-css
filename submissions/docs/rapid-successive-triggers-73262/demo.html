```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rapid Animation Trigger Regression</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="demo">
    <h1>Rapid Animation Trigger Tests</h1>

    <p class="description">
      Trigger animations repeatedly to verify stable behavior during
      rapid successive state changes.
    </p>

    <section class="controls" aria-label="Animation controls">
      <button id="triggerBtn" type="button">
        Trigger Animation
      </button>

      <button id="cancelBtn" type="button">
        Cancel
      </button>

      <button id="restartBtn" type="button">
        Restart
      </button>
    </section>

    <div class="stage">
      <div
        id="target"
        class="motion-target"
        role="status"
        aria-label="Animation target"
      >
        Motion
      </div>
    </div>

    <p id="status" class="status" aria-live="polite">
      Ready
    </p>
  </main>

  <script>
    const target = document.getElementById("target");
    const triggerBtn = document.getElementById("triggerBtn");
    const cancelBtn = document.getElementById("cancelBtn");
    const restartBtn = document.getElementById("restartBtn");
    const status = document.getElementById("status");

    let animation;

    function triggerAnimation() {
      animation?.cancel();

      animation = target.animate(
        [
          { transform: "translateX(0) scale(1)" },
          { transform: "translateX(80px) scale(1.08)" },
          { transform: "translateX(0) scale(1)" }
        ],
        {
          duration: 700,
          easing: "ease-in-out",
          fill: "both"
        }
      );

      status.textContent = "Animation triggered";

      animation.finished
        .then(() => {
          status.textContent = "Animation completed";
        })
        .catch(() => {
          status.textContent = "Animation cancelled";
        });
    }

    function cancelAnimation() {
      if (animation) {
        animation.cancel();
        status.textContent = "Animation cancelled";
      }
    }

    function restartAnimation() {
      animation?.cancel();
      triggerAnimation();
      status.textContent = "Animation restarted";
    }

    triggerBtn.addEventListener("click", triggerAnimation);
    cancelBtn.addEventListener("click", cancelAnimation);
    restartBtn.addEventListener("click", restartAnimation);

    // Rapid successive triggers.
    window.addEventListener("keydown", (event) => {
      if (event.key === "t") {
        triggerAnimation();
      }

      if (event.key === "r") {
        restartAnimation();
      }

      if (event.key === "Escape") {
        cancelAnimation();
      }
    });
  </script>
</body>
</html>
