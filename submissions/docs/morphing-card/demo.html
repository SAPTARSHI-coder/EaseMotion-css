<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morphing Card Demo - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-demo-container">
        <!-- Pure CSS Morphing Card Component Showcase -->
        <div class="em-morphing-card" role="region" aria-label="Morphing Card Showcase" tabindex="0">
            <span class="em-card-badge">DOCUMENTATION</span>
            <h1 class="em-card-title">Morphing Card</h1>
            <p class="em-card-desc">A responsive, pure CSS morphing container featuring smooth elevation shifts, border radius transformations, and frosted glassmorphism styling.</p>
            <div class="em-morph-content">
                <span class="em-morph-status">MORPH STATE: ACTIVE</span>
            </div>
        </div>
    </div>
</body>
</html>
