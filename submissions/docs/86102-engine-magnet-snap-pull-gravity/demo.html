<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magnet Snap Pull Gravity</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo">
    <p class="eyebrow">EaseMotion Core Animation</p>

    <h1>Magnet Snap Pull Gravity</h1>

    <p class="description">
      A magnetic-style motion preset that pulls an element toward its
      target position with a fast snap followed by a subtle settling motion.
    </p>

    <section class="stage">
      <div class="magnet-field">
        <div class="target">
          <span>MAGNET</span>
        </div>

        <div class="magnet magnet-a ease-anim-magnet-snap-pull-gravity">
          <span>+</span>
        </div>

        <div class="magnet magnet-b ease-anim-magnet-snap-pull-gravity">
          <span>+</span>
        </div>

        <div class="magnet magnet-c ease-anim-magnet-snap-pull-gravity">
          <span>+</span>
        </div>
      </div>
    </section>

    <button
      type="button"
      onclick="
        document.querySelectorAll('.magnet').forEach((element) => {
          element.classList.remove('ease-anim-magnet-snap-pull-gravity');
          void element.offsetWidth;
          element.classList.add('ease-anim-magnet-snap-pull-gravity');
        });
      "
    >
      Replay Animation
    </button>
  </main>

</body>
</html>
