<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion Card Variants</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>EaseMotion Card Variants</h1>

  <div class="card-grid">
    <div class="card card-default">
      <h2>Default Card</h2>
      <p>Basic EaseMotion card variant.</p>
    </div>

    <div class="card card-shadow">
      <h2>Shadow Card</h2>
      <p>Card with elevated shadow styling.</p>
    </div>

    <div class="card card-glass">
      <h2>Glass Card</h2>
      <p>Glass-style card variant.</p>
    </div>

    <div class="card card-neumorphic">
      <h2>Neumorphic Card</h2>
      <p>Soft neumorphic card styling.</p>
    </div>

    <div class="card card-accent">
      <h2>Accent Card</h2>
      <p>Card with accent styling.</p>
    </div>

    <div class="card card-hover">
      <h2>Hover Card</h2>
      <p>Hover over this card.</p>
    </div>
  </div>

</body>
</html>
