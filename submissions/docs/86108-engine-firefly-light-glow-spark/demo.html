<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firefly Light Glow Spark</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo">
    <p class="eyebrow">EaseMotion Core Animation</p>

    <h1>Firefly Light Glow Spark</h1>

    <p class="description">
      A soft glowing spark effect inspired by a firefly's intermittent
      light, using lightweight transform and opacity animation.
    </p>

    <section class="stage" aria-label="Firefly animation demo">
      <div class="firefly firefly-one">
        <span class="firefly-core"></span>
      </div>

      <div class="firefly firefly-two">
        <span class="firefly-core"></span>
      </div>

      <div class="firefly firefly-three">
        <span class="firefly-core"></span>
      </div>

      <div class="firefly firefly-four">
        <span class="firefly-core"></span>
      </div>

      <div class="firefly firefly-five">
        <span class="firefly-core"></span>
      </div>

      <div class="firefly firefly-six">
        <span class="firefly-core"></span>
      </div>
    </section>

    <button
      type="button"
      onclick="
        document.querySelectorAll('.firefly').forEach((element) => {
          element.classList.remove('ease-anim-firefly-light-glow-spark');
          void element.offsetWidth;
          element.classList.add('ease-anim-firefly-light-glow-spark');
        });
      "
    >
      Replay Animation
    </button>
  </main>

</body>
</html>
