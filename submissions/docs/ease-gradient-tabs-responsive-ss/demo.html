<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gradient Glow Tab Bar - Responsive Layout Guide</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="ease-showcase-card" aria-labelledby="guide-title">
    <header style="text-align: center;">
      <span style="background: rgba(59, 130, 246, 0.2); color: #60a5fa; padding: 4px 12px; border-radius: 9999px; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; border: 1px solid rgba(59, 130, 246, 0.3);">Layout Guide</span>
      <h1 id="guide-title" style="font-size: 2rem; font-weight: 800; margin: 1rem 0 0.5rem 0; letter-spacing: -0.5px;">Gradient Glow Tab Bar</h1>
      <p style="color: #94a3b8; font-size: 0.9375rem; max-width: 500px; margin: 0 auto; line-height: 1.6;">
        Hardware-accelerated blurred glows, WAI-ARIA keyboard navigation, and anti-clip mobile scroll viewports.
      </p>
    </header>

    <!-- Default Variant: Hugs content, scrolls on mobile -->
    <section aria-label="Default Inline Variant">
      <h2 style="font-size: 0.875rem; color: #cbd5e1; text-transform: uppercase; margin-bottom: 0.5rem;">1. Default (Scrolls on Mobile, Inline on Desktop)</h2>
      <div class="ease-tab-viewport">
        <div class="ease-tab-bar" role="tablist" aria-label="Application Views">
          <button type="button" class="ease-tab-btn is-active" role="tab" aria-selected="true" tabindex="0">Overview</button>
          <button type="button" class="ease-tab-btn" role="tab" aria-selected="false" tabindex="-1">Integrations</button>
          <button type="button" class="ease-tab-btn" role="tab" aria-selected="false" tabindex="-1">Billing &amp; Usage</button>
          <button type="button" class="ease-tab-btn" role="tab" aria-selected="false" tabindex="-1">Advanced Settings</button>
        </div>
      </div>
    </section>

    <!-- Fluid Variant: Grid layout on desktop -->
    <section aria-label="Fluid Grid Variant">
      <h2 style="font-size: 0.875rem; color: #cbd5e1; text-transform: uppercase; margin-bottom: 0.5rem;">2. Fluid Modifier + Sunset Theme (100% Width Grid on Desktop)</h2>
      <div class="ease-tab-viewport is-fluid ease-theme-sunset">
        <div class="ease-tab-bar ease-tab-fluid" role="tablist" aria-label="Analytics Timeframe">
          <button type="button" class="ease-tab-btn is-active" role="tab" aria-selected="true" tabindex="0">24 Hours</button>
          <button type="button" class="ease-tab-btn" role="tab" aria-selected="false" tabindex="-1">7 Days</button>
          <button type="button" class="ease-tab-btn" role="tab" aria-selected="false" tabindex="-1">30 Days</button>
          <button type="button" class="ease-tab-btn" role="tab" aria-selected="false" tabindex="-1">All Time</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    // WAI-ARIA Roving Tabindex & Keyboard Navigation Controller
    const tabLists = document.querySelectorAll('.ease-tab-bar');

    tabLists.forEach(tabList => {
      const tabs = Array.from(tabList.querySelectorAll('.ease-tab-btn'));

      function selectTab(selectedTab) {
        tabs.forEach(tab => {
          tab.classList.remove('is-active');
          tab.setAttribute('aria-selected', 'false');
          tab.setAttribute('tabindex', '-1');
        });
        selectedTab.classList.add('is-active');
        selectedTab.setAttribute('aria-selected', 'true');
        selectedTab.setAttribute('tabindex', '0');
        selectedTab.focus();
        
        // Scroll tab into view if partially hidden on mobile
        selectedTab.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      }

      tabs.forEach((tab, index) => {
        tab.addEventListener('click', () => selectTab(tab));

        tab.addEventListener('keydown', (e) => {
          let nextIndex = null;
          if (e.key === 'ArrowRight') {
            nextIndex = (index + 1) % tabs.length;
          } else if (e.key === 'ArrowLeft') {
            nextIndex = (index - 1 + tabs.length) % tabs.length;
          }
          
          if (nextIndex !== null) {
            e.preventDefault();
            selectTab(tabs[nextIndex]);
          }
        });
      });
    });
  </script>
</body>
</html>
