<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ease-focus-visible — demo</title>
<link rel="stylesheet" href="style.css" />
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0b0f19;
    color: #f5f5f5;
    display: flex;
    flex-direction: column;
    gap: 2rem;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 3rem;
  }
  p.hint {
    color: #9aa0ad;
    font-size: 0.9rem;
    max-width: 420px;
    text-align: center;
    margin: 0;
  }
  .row {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    font-family: inherit;
    font-size: 0.95rem;
    padding: 0.7rem 1.4rem;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid transparent;
  }
  .btn-primary {
    background: #4f9dff;
    color: #06101f;
    font-weight: 600;
  }
  .btn-secondary {
    background: #232a3a;
    color: #f5f5f5;
  }
  .btn-outline {
    background: transparent;
    border-color: #3a4152;
    color: #f5f5f5;
  }
</style>
</head>
<body>

  <p class="hint">Press <strong>Tab</strong> to navigate between the buttons below — each should show a clear focus ring. Click with a mouse instead, and no ring appears (that's :focus-visible working as intended).</p>

  <div class="row">
    <button class="btn-primary">Primary</button>
    <button class="btn-secondary">Secondary</button>
    <button class="btn-outline">Outline</button>
  </div>

</body>
</html>
