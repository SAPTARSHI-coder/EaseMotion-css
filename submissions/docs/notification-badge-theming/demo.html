<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Notification Badge (Theming) Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="demo-container">
        
        <div class="demo-section">
            <h2>Default Theme (Alert Red)</h2>
            <button type="button" class="notification-btn" aria-label="Notifications, 3 unread alerts">
                <svg class="bell-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
                <span class="notification-badge" aria-hidden="true">3</span>
            </button>
        </div>

        <div class="demo-section">
            <h2>Success Theme Modifier</h2>
            <!-- Using the modifier class .badge-theme-success -->
            <button type="button" class="notification-btn badge-theme-success" aria-label="Tasks, 12 completed">
                <svg class="bell-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
                <span class="notification-badge" aria-hidden="true">12</span>
            </button>
        </div>

        <div class="demo-section">
            <h2>Warning Theme Modifier</h2>
            <!-- Using the modifier class .badge-theme-warning -->
            <button type="button" class="notification-btn badge-theme-warning" aria-label="Warnings, 1 new issue">
                <svg class="bell-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                    <line x1="12" y1="9" x2="12" y2="13"></line>
                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>
                <span class="notification-badge" aria-hidden="true">1</span>
            </button>
        </div>

    </main>
</body>
</html>
