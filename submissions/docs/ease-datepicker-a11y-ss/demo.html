<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A11y: Datepicker Grid & Keyboard Nav Audit</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Screen Reader Announcer -->
  <div id="dp-announcer" aria-live="polite" class="visually-hidden" style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0;"></div>

  <main class="ease-dp-card" aria-label="Datepicker component">
    <header class="ease-dp-header">
      <h2 class="ease-dp-month-year" id="dp-title" aria-live="polite">August 2026</h2>
      <div class="ease-dp-nav-group">
        <button type="button" class="ease-dp-nav-btn" id="btn-prev-month" aria-label="Previous month, July 2026">◄</button>
        <button type="button" class="ease-dp-nav-btn" id="btn-next-month" aria-label="Next month, September 2026">►</button>
      </div>
    </header>

    <div role="grid" aria-labelledby="dp-title" class="ease-dp-table">
      <div role="row" class="ease-dp-grid">
        <span role="columnheader" aria-label="Sunday" class="ease-dp-day-header">Su</span>
        <span role="columnheader" aria-label="Monday" class="ease-dp-day-header">Mo</span>
        <span role="columnheader" aria-label="Tuesday" class="ease-dp-day-header">Tu</span>
        <span role="columnheader" aria-label="Wednesday" class="ease-dp-day-header">We</span>
        <span role="columnheader" aria-label="Thursday" class="ease-dp-day-header">Th</span>
        <span role="columnheader" aria-label="Friday" class="ease-dp-day-header">Fr</span>
        <span role="columnheader" aria-label="Saturday" class="ease-dp-day-header">Sa</span>
      </div>
      
      <!-- Simulated Weeks (Days 1 to 14 for Demo) -->
      <div role="row" class="ease-dp-grid">
        <button type="button" role="gridcell" class="ease-dp-cell" disabled aria-label="July 26" tabindex="-1">26</button>
        <button type="button" role="gridcell" class="ease-dp-cell" disabled aria-label="July 27" tabindex="-1">27</button>
        <button type="button" role="gridcell" class="ease-dp-cell" disabled aria-label="July 28" tabindex="-1">28</button>
        <button type="button" role="gridcell" class="ease-dp-cell" disabled aria-label="July 29" tabindex="-1">29</button>
        <button type="button" role="gridcell" class="ease-dp-cell" disabled aria-label="July 30" tabindex="-1">30</button>
        <button type="button" role="gridcell" class="ease-dp-cell" disabled aria-label="July 31" tabindex="-1">31</button>
        <button type="button" role="gridcell" class="ease-dp-cell" aria-label="August 1, 2026" tabindex="-1">1</button>
      </div>
      <div role="row" class="ease-dp-grid">
        <button type="button" role="gridcell" class="ease-dp-cell" aria-label="August 2, 2026" tabindex="-1">2</button>
        <button type="button" role="gridcell" class="ease-dp-cell" aria-label="August 3, 2026" tabindex="-1">3</button>
        <button type="button" role="gridcell" class="ease-dp-cell" aria-label="August 4, 2026" tabindex="-1">4</button>
        <button type="button" role="gridcell" class="ease-dp-cell" aria-label="August 5, 2026" tabindex="-1">5</button>
        <button type="button" role="gridcell" class="ease-dp-cell" aria-label="August 6, 2026" tabindex="-1">6</button>
        <button type="button" role="gridcell" class="ease-dp-cell is-selected" aria-label="August 7, 2026, selected" aria-selected="true" tabindex="0">7</button>
        <button type="button" role="gridcell" class="ease-dp-cell" aria-label="August 8, 2026" tabindex="-1">8</button>
      </div>
      <div role="row" class="ease-dp-grid">
        <button type="button" role="gridcell" class="ease-dp-cell" aria-label="August 9, 2026" tabindex="-1">9</button>
        <button type="button" role="gridcell" class="ease-dp-cell" aria-label="August 10, 2026" tabindex="-1">10</button>
        <button type="button" role="gridcell" class="ease-dp-cell" aria-label="August 11, 2026" tabindex="-1">11</button>
        <button type="button" role="gridcell" class="ease-dp-cell" aria-label="August 12, 2026" tabindex="-1">12</button>
        <button type="button" role="gridcell" class="ease-dp-cell" aria-label="August 13, 2026" tabindex="-1">13</button>
        <button type="button" role="gridcell" class="ease-dp-cell" aria-label="August 14, 2026" tabindex="-1">14</button>
        <button type="button" role="gridcell" class="ease-dp-cell" aria-label="August 15, 2026" tabindex="-1">15</button>
      </div>
    </div>
  </main>

  <script>
    // Roving Tabindex & Grid Navigation Logic
    const gridCells = Array.from(document.querySelectorAll('.ease-dp-cell:not([disabled])'));
    const announcer = document.getElementById('dp-announcer');

    function setFocus(index) {
      if (index < 0 || index >= gridCells.length) return;
      gridCells.forEach(cell => cell.setAttribute('tabindex', '-1'));
      gridCells[index].setAttribute('tabindex', '0');
      gridCells[index].focus();
    }

    gridCells.forEach((cell, index) => {
      cell.addEventListener('keydown', (e) => {
        let targetIndex = null;
        switch (e.key) {
          case 'ArrowLeft': targetIndex = index - 1; break;
          case 'ArrowRight': targetIndex = index + 1; break;
          case 'ArrowUp': targetIndex = index - 7; break;
          case 'ArrowDown': targetIndex = index + 7; break;
          case 'Home': targetIndex = 0; break;
          case 'End': targetIndex = gridCells.length - 1; break;
        }
        if (targetIndex !== null && targetIndex >= 0 && targetIndex < gridCells.length) {
          e.preventDefault();
          setFocus(targetIndex);
        }
      });

      cell.addEventListener('click', () => {
        gridCells.forEach(c => {
          c.classList.remove('is-selected');
          c.removeAttribute('aria-selected');
          c.setAttribute('tabindex', '-1');
        });
        cell.classList.add('is-selected');
        cell.setAttribute('aria-selected', 'true');
        cell.setAttribute('tabindex', '0');
        announcer.textContent = 'Selected ' + cell.getAttribute('aria-label');
      });
    });

    // Month Nav Simulation
    document.getElementById('btn-next-month').addEventListener('click', () => {
      announcer.textContent = 'Navigated to September 2026';
    });
    document.getElementById('btn-prev-month').addEventListener('click', () => {
      announcer.textContent = 'Navigated to July 2026';
    });
  </script>
</body>
</html>
