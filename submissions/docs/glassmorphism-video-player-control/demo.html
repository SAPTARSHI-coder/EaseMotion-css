<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentation: Glassmorphism Video Player Control - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-demo-container">
        <!-- Pure CSS Glassmorphism Video Player Control Documentation Showcase -->
        <header class="em-video-doc-card" role="region" aria-label="Glassmorphism Video Player Control Documentation Showcase" tabindex="0">
            <div class="em-video-header-bar">
                <span class="em-card-badge">COMPONENT DOCS</span>
                <span class="em-brand-logo">GlassMotion</span>
            </div>
            <h1 class="em-card-title">Glassmorphism Video Player Control</h1>
            <p class="em-card-desc">Complete integration guide, theming configuration, and live demo for the EaseMotion Glassmorphism Video Player Control component.</p>
            <div class="em-video-wrapper">
                <div class="ease-glass-video-control" aria-label="Glassmorphic Video Control Bar" tabindex="0">
                    <button class="em-vid-btn" aria-label="Play or Pause Video">▶</button>
                    <div class="em-vid-progress-bar" role="slider" aria-label="Video Progress" aria-valuenow="45" aria-valuemin="0" aria-valuemax="100" tabindex="0">
                        <div class="em-vid-progress-fill" style="width: 45%;"></div>
                    </div>
                    <span class="em-vid-time">02:15 / 05:00</span>
                    <button class="em-vid-btn" aria-label="Toggle Fullscreen">⛶</button>
                </div>
            </div>
        </header>
    </div>
</body>
</html>
