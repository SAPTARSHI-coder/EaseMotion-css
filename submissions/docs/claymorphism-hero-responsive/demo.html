<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claymorphism Hero Banner (Responsive) Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <header class="hero-section">
        
        <!-- Text Content Area -->
        <div class="hero-content">
            <h1 class="hero-title">Experience 3D Web Design</h1>
            <p class="hero-text">
                Claymorphism combines friendly, inflated aesthetics with soft pastel colors and deep inset shadows to create tactile, playful user interfaces.
            </p>
            <div class="hero-actions">
                <button type="button" class="clay-btn primary-btn">Get Started</button>
                <button type="button" class="clay-btn secondary-btn">View Gallery</button>
            </div>
        </div>

        <!-- Visual / Graphic Area -->
        <div class="hero-visual" aria-hidden="true">
            <!-- 
                A decorative claymorphic element representing a floating 3D object 
            -->
            <div class="clay-object"></div>
        </div>

    </header>

</body>
</html>
