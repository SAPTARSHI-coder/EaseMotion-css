<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentation: Interactive Notification Badge - Basic Usage - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-demo-container">
        <!-- Pure CSS Interactive Notification Badge Basic Usage Documentation Showcase -->
        <header class="em-badge-doc-card" role="region" aria-label="Interactive Notification Badge Documentation Showcase" tabindex="0">
            <div class="em-badge-header-bar">
                <span class="em-card-badge">COMPONENT DOCS</span>
                <span class="em-brand-logo">BadgeMotion</span>
            </div>
            <h1 class="em-card-title">Interactive Notification Badge</h1>
            <p class="em-card-desc">Complete integration guide, basic usage, and live demo for the EaseMotion Interactive Notification Badge component (#65912).</p>
            <div class="em-badge-wrapper">
                <div class="ease-notification-badge em-badge-basic" role="status" aria-label="Unread Notifications Count" tabindex="0">
                    <span class="em-badge-icon" aria-hidden="true">🔔</span>
                    <span class="em-badge-label">Updates</span>
                    <span class="em-badge-count" aria-live="polite">3</span>
                </div>
            </div>
        </header>
    </div>
</body>
</html>
