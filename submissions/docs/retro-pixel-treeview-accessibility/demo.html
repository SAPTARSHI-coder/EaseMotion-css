<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Pixel Treeview (Accessibility) Demo</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <main>
        <div class="pixel-treeview">
            <h2 class="tree-title">INVENTORY</h2>
            
            <!-- 
                CRITICAL ACCESSIBILITY:
                The root ul must have role="tree" 
            -->
            <ul class="tree-list" role="tree">
                
                <!-- 
                    Nodes with children must have aria-expanded tracking the details state.
                    (Note: JS is usually required to sync aria-expanded with the details toggle event,
                    but modern screen readers infer it from the details tag natively.) 
                -->
                <li role="treeitem" aria-expanded="true">
                    <details open>
                        <summary class="tree-node">
                            <span class="icon folder-icon"></span>
                            WEAPONS
                        </summary>
                        
                        <!-- The nested list containing children must have role="group" -->
                        <ul role="group">
                            <li role="treeitem">
                                <!-- Leaf nodes are focusable links/buttons -->
                                <a href="#" class="tree-node tree-leaf">
                                    <span class="icon file-icon"></span>
                                    SWORD_LV1
                                </a>
                            </li>
                            <li role="treeitem">
                                <a href="#" class="tree-node tree-leaf">
                                    <span class="icon file-icon"></span>
                                    BOW_LV3
                                </a>
                            </li>
                        </ul>
                    </details>
                </li>

            </ul>
        </div>
        
        <p class="a11y-note">Press Tab to focus, Space/Enter to expand the WEAPONS folder.</p>
    </main>
</body>
</html>
