<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="3D Hero Section usage example for EaseMotion CSS" />
    <title>3D Hero Section — EaseMotion CSS</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="hero">
      <section class="hero__content" aria-labelledby="hero-title">
        <p class="eyebrow">EaseMotion CSS · Component documentation</p>
        <h1 id="hero-title">Build depth into your first impression.</h1>
        <p>
          A layered hero layout combines perspective, a floating visual card,
          and restrained motion without JavaScript.
        </p>
        <div class="hero__actions">
          <a class="button button--primary" href="#start">Get started</a>
          <a class="button button--secondary" href="#docs">View docs</a>
        </div>
      </section>

      <div class="hero__scene" aria-label="3D decorative preview">
        <div class="hero__card">
          <span>01</span>
          <strong>Depth</strong>
          <small>Perspective layer</small>
        </div>
        <div class="hero__orb" aria-hidden="true"></div>
      </div>
    </main>
  </body>
</html>
