<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A11y: Rating Star Screen Reader Audit</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Screen Reader Live Announcer -->
  <div id="rating-announcer" aria-live="polite" class="visually-hidden"></div>

  <main class="ease-rating-card">
    <h2 id="rating-label" class="ease-rating-title">How was your experience?</h2>
    
    <div class="ease-rating-group" role="radiogroup" aria-labelledby="rating-label" id="rating-group">
      <button type="button" role="radio" aria-checked="false" aria-label="1 Star" tabindex="0" class="ease-star-btn" data-value="1">★</button>
      <button type="button" role="radio" aria-checked="false" aria-label="2 Stars" tabindex="-1" class="ease-star-btn" data-value="2">★</button>
      <button type="button" role="radio" aria-checked="false" aria-label="3 Stars" tabindex="-1" class="ease-star-btn" data-value="3">★</button>
      <button type="button" role="radio" aria-checked="false" aria-label="4 Stars" tabindex="-1" class="ease-star-btn" data-value="4">★</button>
      <button type="button" role="radio" aria-checked="false" aria-label="5 Stars" tabindex="-1" class="ease-star-btn" data-value="5">★</button>
    </div>
  </main>

  <script>
    const stars = Array.from(document.querySelectorAll('.ease-star-btn'));
    const announcer = document.getElementById('rating-announcer');
    let currentValue = 0;

    function updateStars(value) {
      currentValue = value;
      stars.forEach((star, index) => {
        const isFilled = index < value;
        star.classList.toggle('is-filled', isFilled);
        star.setAttribute('aria-checked', index === value - 1 ? 'true' : 'false');
      });
      announcer.textContent = 'You rated this ' + value + ' out of 5 stars.';
    }

    function setFocus(index) {
      if (index < 0 || index >= stars.length) return;
      stars.forEach(star => star.setAttribute('tabindex', '-1'));
      stars[index].setAttribute('tabindex', '0');
      stars[index].focus();
    }

    stars.forEach((star, index) => {
      // Hover visual effect (independent of selection)
      star.addEventListener('mouseenter', () => {
        stars.forEach((s, i) => s.classList.toggle('is-filled', i <= index));
      });

      star.addEventListener('mouseleave', () => {
        stars.forEach((s, i) => s.classList.toggle('is-filled', i < currentValue));
      });

      // Click / Selection
      star.addEventListener('click', () => {
        updateStars(index + 1);
        setFocus(index);
      });

      // WAI-ARIA Keyboard Navigation (Roving Tabindex)
      star.addEventListener('keydown', (e) => {
        let targetIndex = null;
        switch (e.key) {
          case 'ArrowLeft':
          case 'ArrowUp':
            targetIndex = index - 1;
            break;
          case 'ArrowRight':
          case 'ArrowDown':
            targetIndex = index + 1;
            break;
          case 'Home':
            targetIndex = 0;
            break;
          case 'End':
            targetIndex = stars.length - 1;
            break;
        }
        if (targetIndex !== null && targetIndex >= 0 && targetIndex < stars.length) {
          e.preventDefault();
          setFocus(targetIndex);
        }
      });
    });
  </script>
</body>
</html>
