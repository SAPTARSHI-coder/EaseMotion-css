<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A11y: Breadcrumb ARIA Current & Overflow Audit</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="ease-breadcrumb-card">
    <nav aria-label="Breadcrumb">
      <ol class="ease-breadcrumb-list">
        <li class="ease-breadcrumb-item">
          <a href="#" class="ease-breadcrumb-link">Home</a>
          <span class="ease-breadcrumb-separator" aria-hidden="true">/</span>
        </li>
        
        <li class="ease-breadcrumb-item ease-overflow-container">
          <button type="button" class="ease-overflow-btn" id="overflow-trigger" aria-haspopup="dialog" aria-expanded="false" aria-label="Show hidden breadcrumbs">…</button>
          
          <!-- Overflow Focus Trap Dialog -->
          <div id="overflow-dialog" class="ease-overflow-dialog" role="dialog" aria-modal="true" aria-label="Hidden breadcrumbs">
            <button type="button" class="ease-overflow-close" id="overflow-close" aria-label="Close overflow menu">✕</button>
            <a href="#" class="ease-breadcrumb-link">Products</a>
            <a href="#" class="ease-breadcrumb-link">Electronics</a>
            <a href="#" class="ease-breadcrumb-link">Computers</a>
          </div>
          
          <span class="ease-breadcrumb-separator" aria-hidden="true" style="margin-left: 0.5rem;">/</span>
        </li>

        <li class="ease-breadcrumb-item">
          <a href="#" class="ease-breadcrumb-link">Laptops</a>
          <span class="ease-breadcrumb-separator" aria-hidden="true">/</span>
        </li>
        
        <li class="ease-breadcrumb-item">
          <a href="#" class="ease-breadcrumb-link" aria-current="page">MacBook Pro M3</a>
        </li>
      </ol>
    </nav>
  </main>

  <script>
    const trigger = document.getElementById('overflow-trigger');
    const dialog = document.getElementById('overflow-dialog');
    const closeBtn = document.getElementById('overflow-close');

    // Open / Close Logic
    function openDialog() {
      dialog.classList.add('is-open');
      trigger.setAttribute('aria-expanded', 'true');
      closeBtn.focus();
    }

    function closeDialog() {
      dialog.classList.remove('is-open');
      trigger.setAttribute('aria-expanded', 'false');
      trigger.focus();
    }

    trigger.addEventListener('click', openDialog);
    closeBtn.addEventListener('click', closeDialog);

    // KEYBOARD FOCUS TRAP LOGIC
    dialog.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeDialog();
        return;
      }
      if (e.key !== 'Tab') return;

      const focusable = dialog.querySelectorAll('button, a[href]');
      const first = focusable[0];
      const last = focusable[focusable.length - 1];

      if (e.shiftKey) {
        if (document.activeElement === first) {
          e.preventDefault();
          last.focus();
        }
      } else {
        if (document.activeElement === last) {
          e.preventDefault();
          first.focus();
        }
      }
    });
  </script>
</body>
</html>
