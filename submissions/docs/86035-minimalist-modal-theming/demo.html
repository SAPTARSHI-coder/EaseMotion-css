<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minimalist Modal — Theming</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="page__header">
      <p class="eyebrow">EaseMotion CSS · #86035</p>
      <h1>Themeable Minimalist Modal</h1>
      <p>Design tokens make the panel, border, text, accent, and spacing easy to adapt.</p>
    </header>
    <section class="modal" aria-labelledby="modal-title">
      <div class="modal__header">
        <div>
          <p class="modal__eyebrow">Theming example</p>
          <h2 id="modal-title">Customize the experience</h2>
        </div>
        <button class="modal__close" type="button" aria-label="Close dialog">×</button>
      </div>
      <p>Override the component custom properties to match an existing product theme without changing the markup.</p>
      <div class="modal__actions">
        <button class="button button--secondary" type="button">Later</button>
        <button class="button button--primary" type="button">Continue</button>
      </div>
    </section>
  </main>
</body>
</html>
