<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Water Drop Ripple Expand</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo">
    <section class="card">
      <span class="badge">EaseMotion Core</span>

      <h1>Water Drop Ripple Expand</h1>

      <p>
        A smooth ripple-style animation inspired by a water drop spreading
        across a surface.
      </p>

      <div class="stage">
        <div class="drop ease-anim-water-drop-ripple-expand">
          <span>💧</span>
        </div>
      </div>

      <button type="button" id="replay">
        Replay Animation
      </button>
    </section>
  </main>

  <script>
    const button = document.getElementById("replay");
    const drop = document.querySelector(
      ".ease-anim-water-drop-ripple-expand"
    );

    button.addEventListener("click", () => {
      drop.classList.remove(
        "ease-anim-water-drop-ripple-expand"
      );

      void drop.offsetWidth;

      drop.classList.add(
        "ease-anim-water-drop-ripple-expand"
      );
    });
  </script>
</body>
</html>
