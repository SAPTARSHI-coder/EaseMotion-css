<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A11y: Modal Backdrop Click Event Dismiss</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button type="button" id="open-modal" class="ease-modal-btn">Open Modal</button>

  <div class="ease-modal-backdrop" id="modal-backdrop" role="presentation">
    <div class="ease-modal-dialog" id="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
      <h2 id="modal-title" class="ease-modal-title">Confirm Action</h2>
      <p>Are you sure you want to proceed? You cannot undo this.</p>
      <button type="button" class="ease-modal-btn" id="close-modal" aria-label="Close modal">Dismiss</button>
    </div>
  </div>

  <script>
    const trigger = document.getElementById('open-modal');
    const backdrop = document.getElementById('modal-backdrop');
    const dialog = document.getElementById('modal-dialog');
    const closeBtn = document.getElementById('close-modal');

    function openModal() {
      backdrop.classList.add('is-open');
      dialog.focus();
    }

    function closeModal() {
      backdrop.classList.remove('is-open');
      trigger.focus();
    }

    trigger.addEventListener('click', openModal);
    closeBtn.addEventListener('click', closeModal);
    backdrop.addEventListener('click', (e) => {
      if (e.target === backdrop) closeModal();
    });

    // KEYBOARD FOCUS TRAP & ESCAPE
    document.addEventListener('keydown', (e) => {
      if (!backdrop.classList.contains('is-open')) return;

      if (e.key === 'Escape') {
        closeModal();
        return;
      }

      if (e.key === 'Tab') {
        const focusable = dialog.querySelectorAll('button');
        const first = focusable[0];
        const last = focusable[focusable.length - 1];

        if (e.shiftKey) {
          if (document.activeElement === first) { e.preventDefault(); last.focus(); }
        } else {
          if (document.activeElement === last) { e.preventDefault(); first.focus(); }
        }
      }
    });
  </script>
</body>
</html>
