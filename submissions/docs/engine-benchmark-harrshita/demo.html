<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Engine Benchmark | EaseMotion CSS Docs</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="demo-header">
    <h1>EaseMotion Engine Benchmark</h1>
    <p>Performance showcase comparing CSS Keyframe AST compile times vs JS runtime animation.</p>
  </header>

  <main class="demo-main">
    <section class="demo-section">
      <h2>60 FPS Frame Rate Guarantee</h2>
      <div class="ease-bench-card">
        <div class="ease-bench-stat">
          <span class="ease-bench-val">60 FPS</span>
          <span class="ease-bench-lbl">Render Performance</span>
        </div>
        <div class="ease-bench-stat">
          <span class="ease-bench-val">0.4 ms</span>
          <span class="ease-bench-lbl">AST Compile Time</span>
        </div>
      </div>
    </section>
  </main>
  <footer class="demo-footer"><p>EaseMotion CSS Documentation</p></footer>
</body>
</html>
