<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Accessible Claymorphism Rating demonstration.">
  <title>Claymorphism Rating Accessibility</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell">
    <header class="page-header">
      <p class="eyebrow">EaseMotion CSS · Issue #81560</p>
      <h1>Accessible Claymorphism Rating</h1>
      <p>A rating group built around native radios with visible focus and selection states.</p>
    </header>

    <section class="rating" aria-labelledby="rating-title">
      <fieldset>
        <legend id="rating-title">How helpful was this documentation?</legend>
        <div class="rating__group">
          <label class="rating__option">
            <input class="rating__input" type="radio" name="helpfulness" value="1">
            <span class="rating__label">1 · Not helpful</span>
          </label>
          <label class="rating__option">
            <input class="rating__input" type="radio" name="helpfulness" value="2">
            <span class="rating__label">2 · Slightly helpful</span>
          </label>
          <label class="rating__option">
            <input class="rating__input" type="radio" name="helpfulness" value="3">
            <span class="rating__label">3 · Helpful</span>
          </label>
          <label class="rating__option">
            <input class="rating__input" type="radio" name="helpfulness" value="4">
            <span class="rating__label">4 · Very helpful</span>
          </label>
          <label class="rating__option">
            <input class="rating__input" type="radio" name="helpfulness" value="5">
            <span class="rating__label">5 · Excellent</span>
          </label>
        </div>
      </fieldset>
      <p class="rating__note">Use the keyboard to move through the native rating options.</p>
    </section>
  </main>
</body>
</html>
