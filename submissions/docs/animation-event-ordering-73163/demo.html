<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animation Event Ordering Regression Test</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Animation Event Ordering Test</h1>

    <div id="target" class="motion-target">Animate Me</div>

    <div class="controls">
      <button id="start">Start</button>
      <button id="restart">Restart</button>
      <button id="cancel">Cancel</button>
      <button id="rapid">Rapid Transition</button>
      <button id="clear">Clear Log</button>
    </div>

    <h2>Event Log</h2>
    <ol id="eventLog"></ol>
  </main>

  <script>
    const target = document.getElementById("target");
    const eventLog = document.getElementById("eventLog");

    let animation;

    function logEvent(name) {
      const item = document.createElement("li");
      item.textContent = name;
      eventLog.appendChild(item);
    }

    function attachListeners() {
      target.onanimationstart = () => logEvent("animationstart");
      target.onanimationend = () => logEvent("animationend");
      target.onanimationcancel = () => logEvent("animationcancel");
      target.onanimationiteration = () => logEvent("animationiteration");
    }

    function startAnimation() {
      target.classList.remove("animate");

      void target.offsetWidth;

      target.classList.add("animate");
      logEvent("start-request");
    }

    document.getElementById("start").addEventListener("click", () => {
      startAnimation();
    });

    document.getElementById("restart").addEventListener("click", () => {
      target.classList.remove("animate");

      void target.offsetWidth;

      logEvent("restart-request");
      target.classList.add("animate");
    });

    document.getElementById("cancel").addEventListener("click", () => {
      logEvent("cancel-request");
      target.classList.remove("animate");
    });

    document.getElementById("rapid").addEventListener("click", () => {
      logEvent("rapid-start");

      target.classList.add("animate");

      setTimeout(() => {
        target.classList.remove("animate");
        logEvent("rapid-cancel");
      }, 150);

      setTimeout(() => {
        target.classList.add("animate");
        logEvent("rapid-restart");
      }, 300);
    });

    document.getElementById("clear").addEventListener("click", () => {
      eventLog.innerHTML = "";
    });

    attachListeners();
  </script>
</body>
</html>
