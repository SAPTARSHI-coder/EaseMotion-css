<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Notification Badge (Accessibility) Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="demo-container">
        
        <!-- 
            CRITICAL ACCESSIBILITY: aria-live="polite"
            If the notification count updates dynamically via JavaScript (e.g. from 3 to 4), 
            the screen reader will gracefully announce the change to the user.
        -->
        <div class="notification-region" aria-live="polite">
            
            <!-- 
                CRITICAL ACCESSIBILITY: aria-label
                Screen readers will read "Notifications, 3 unread messages" 
                instead of "Button, Graphic, 3".
            -->
            <button type="button" class="notification-btn" aria-label="Notifications, 3 unread messages">
                
                <!-- Decorative SVG -->
                <svg class="bell-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
                
                <!-- 
                    CRITICAL ACCESSIBILITY: aria-hidden="true"
                    Hide the physical badge text from the accessibility tree 
                    so the screen reader doesn't redundantly read "3" after the aria-label.
                -->
                <span class="notification-badge" aria-hidden="true">3</span>
                
            </button>
            
        </div>

    </main>
</body>
</html>
