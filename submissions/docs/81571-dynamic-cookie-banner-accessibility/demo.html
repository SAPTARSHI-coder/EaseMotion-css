<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Accessible dynamic cookie banner demonstration.">
  <title>Dynamic Cookie Banner — Accessibility</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="page__header">
      <p class="eyebrow">EaseMotion CSS · #81571</p>
      <h1>Dynamic Cookie Banner</h1>
      <p>Semantic consent actions with visible focus and responsive presentation.</p>
    </header>

    <section class="cookie-banner" aria-labelledby="cookie-title">
      <div class="cookie-banner__content">
        <p class="cookie-banner__eyebrow">Accessibility integration</p>
        <h2 id="cookie-title">Cookie preferences</h2>
        <p>Optional cookies help us understand usage. Choose an action to continue.</p>
      </div>
      <div class="cookie-banner__actions">
        <button class="cookie-banner__button cookie-banner__button--secondary" type="button">Decline optional cookies</button>
        <button class="cookie-banner__button cookie-banner__button--primary" type="button">Accept optional cookies</button>
      </div>
    </section>
  </main>
</body>
</html>
