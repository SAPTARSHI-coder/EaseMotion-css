<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Accessible claymorphism hero banner demo.">
  <title>Claymorphism Hero Banner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="demo-shell">
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero__content">
        <p class="hero__eyebrow">Accessibility setup</p>
        <h1 id="hero-title">Build better interfaces</h1>
        <p class="hero__summary">A soft claymorphism surface with semantic content and a keyboard-accessible action.</p>
        <a class="hero__action" href="#learn">Learn more</a>
      </div>
      <div class="hero__shape" aria-hidden="true"></div>
    </section>
  </main>
</body>
</html>
