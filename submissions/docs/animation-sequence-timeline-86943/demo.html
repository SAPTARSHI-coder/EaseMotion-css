<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animation Sequence / Timeline</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container">
    <h1>Animation Sequence / Timeline</h1>

    <p class="description">
      Demonstrates sequential, parallel, delayed, restartable, and
      cancellable animation sequences.
    </p>

    <div class="stage">
      <div id="box" class="box">EaseMotion</div>
    </div>

    <div class="controls">
      <button id="playBtn">Play Sequence</button>
      <button id="restartBtn">Restart</button>
      <button id="cancelBtn">Cancel</button>
    </div>

    <div class="status">
      Status: <strong id="status">Ready</strong>
    </div>
  </main>

  <script>
    const box = document.getElementById("box");
    const status = document.getElementById("status");

    let cancelled = false;
    let running = false;

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function setStatus(message) {
      status.textContent = message;
    }

    function resetBox() {
      box.className = "box";
      box.style.transform = "";
      box.style.opacity = "";
    }

    async function runStep(className, duration = 700, delay = 0) {
      if (cancelled) return false;

      await wait(delay);

      if (cancelled) return false;

      box.classList.remove(
        "fade-in",
        "slide-up",
        "scale-up",
        "fade-out"
      );

      void box.offsetWidth;

      box.classList.add(className);

      await wait(duration);

      return !cancelled;
    }

    async function playSequence() {
      if (running) return;

      running = true;
      cancelled = false;
      resetBox();

      setStatus("Running");

      // Step 1: Fade in
      if (!await runStep("fade-in", 700)) return finish();

      // Step 2: Slide up
      if (!await runStep("slide-up", 700, 150)) return finish();

      // Step 3: Scale
      if (!await runStep("scale-up", 700, 150)) return finish();

      // Step 4: Fade out
      if (!await runStep("fade-out", 700, 150)) return finish();

      setStatus("Completed");
      running = false;
    }

    function finish() {
      running = false;
      setStatus("Cancelled");
    }

    document.getElementById("playBtn").addEventListener("click", () => {
      playSequence();
    });

    document.getElementById("restartBtn").addEventListener("click", () => {
      cancelled = true;
      running = false;

      resetBox();

      setTimeout(() => {
        playSequence();
      }, 50);
    });

    document.getElementById("cancelBtn").addEventListener("click", () => {
      cancelled = true;
      running = false;

      resetBox();
      setStatus("Cancelled");
    });
  </script>
</body>
</html>
