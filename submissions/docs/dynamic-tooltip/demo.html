<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dynamic Tooltip</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="demo-container">

    <h1>Dynamic Tooltip</h1>

    <p class="description">
      Hover over the elements below to see the dynamic tooltips.
    </p>

    <div class="tooltip-wrapper">

      <button
        class="tooltip-trigger"
        data-tooltip="This is a dynamic tooltip">
        Hover Me
      </button>

      <span class="tooltip tooltip-top">
        This tooltip appears on top
      </span>

    </div>

    <div class="tooltip-wrapper">

      <button
        class="tooltip-trigger"
        data-tooltip="Learn more about this feature">
        Information
      </button>

      <span class="tooltip tooltip-bottom">
        Learn more about this feature
      </span>

    </div>

    <div class="tooltip-wrapper">

      <button
        class="tooltip-trigger"
        data-tooltip="Click to continue">
        Continue
      </button>

      <span class="tooltip tooltip-right">
        Click to continue
      </span>

    </div>

  </main>

</body>
</html>
