<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Animated Modal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <div class="retro-card">
      <span class="badge">RETRO UI</span>
      <h1>Animated Modal</h1>
      <p>A pure HTML & CSS modal with a classic retro-inspired design.</p>

      <a href="#retro-modal" class="open-btn">
        OPEN MODAL
      </a>
    </div>
  </main>

  <!-- Modal -->
  <div class="modal" id="retro-modal">
    <div class="modal-box">

      <a href="#" class="close-btn" aria-label="Close modal">
        &times;
      </a>

      <div class="modal-header">
        <span class="modal-icon">★</span>
        <h2>WELCOME!</h2>
      </div>

      <div class="modal-body">
        <p>
          You've discovered a retro-style animated modal built
          entirely with HTML and CSS.
        </p>

        <div class="pixel-line"></div>

        <p class="small-text">
          No JavaScript required.
        </p>
      </div>

      <a href="#" class="modal-btn">GOT IT!</a>

    </div>
  </div>

</body>
</html>
