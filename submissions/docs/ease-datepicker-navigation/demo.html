<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Datepicker Month Year Navigation Calculation Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ease-picker-card">
    <div class="ease-picker-header">
      <button class="ease-picker-btn" id="prev-btn">&larr;</button>
      <div class="ease-picker-title" id="picker-display">January 2026</div>
      <button class="ease-picker-btn" id="next-btn">&rarr;</button>
    </div>
    <div class="ease-picker-grid">
      <div class="ease-picker-day-header">Su</div>
      <div class="ease-picker-day-header">Mo</div>
      <div class="ease-picker-day-header">Tu</div>
      <div class="ease-picker-day-header">We</div>
      <div class="ease-picker-day-header">Th</div>
      <div class="ease-picker-day-header">Fr</div>
      <div class="ease-picker-day-header">Sa</div>
      <!-- Mock calendar days rendered via script -->
      <div class="ease-picker-day is-muted">28</div>
      <div class="ease-picker-day is-muted">29</div>
      <div class="ease-picker-day is-muted">30</div>
      <div class="ease-picker-day is-muted">31</div>
      <div class="ease-picker-day">1</div>
      <div class="ease-picker-day">2</div>
      <div class="ease-picker-day">3</div>
    </div>
  </div>

  <script>
    function calculateNextMonth(year, month) {
      if (month === 11) { return { year: year + 1, month: 0 }; }
      return { year: year, month: month + 1 };
    }
    function calculatePrevMonth(year, month) {
      if (month === 0) { return { year: year - 1, month: 11 }; }
      return { year: year, month: month - 1 };
    }
    // Wire up simple demo interactivity
    let currentYear = 2026, currentMonth = 0; // January 2026
    const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    document.getElementById('next-btn').addEventListener('click', () => {
      const res = calculateNextMonth(currentYear, currentMonth);
      currentYear = res.year; currentMonth = res.month;
      document.getElementById('picker-display').textContent = `${months[currentMonth]} ${currentYear}`;
    });
    document.getElementById('prev-btn').addEventListener('click', () => {
      const res = calculatePrevMonth(currentYear, currentMonth);
      currentYear = res.year; currentMonth = res.month;
      document.getElementById('picker-display').textContent = `${months[currentMonth]} ${currentYear}`;
    });
  </script>
</body>
</html>
