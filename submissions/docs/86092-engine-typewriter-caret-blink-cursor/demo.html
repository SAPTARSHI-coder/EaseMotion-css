<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>Typewriter Caret Blink Cursor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo">
    <p class="eyebrow">EaseMotion Core Animation</p>

    <h1>Typewriter Caret Blink Cursor</h1>

    <p class="description">
      A lightweight blinking caret utility for typewriter-style interfaces,
      terminals, editors, and animated text experiences.
    </p>

    <section class="terminal" aria-label="Typewriter cursor demonstration">
      <div class="terminal-bar">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div class="terminal-content">
        <p class="terminal-label">~/easemotion</p>

        <p class="typewriter-line">
          <span>npm install easemotion-css</span><span
            class="caret ease-anim-typewriter-caret-blink-cursor"
            aria-hidden="true"
          ></span>
        </p>

        <p class="terminal-line">
          <span class="prompt">&gt;</span>
          Animation ready.
        </p>
      </div>
    </section>

    <section class="examples">
      <article class="example-card">
        <span class="example-label">EDITOR</span>
        <p>
          const motion = "smooth"<span
            class="caret small-caret ease-anim-typewriter-caret-blink-cursor"
            aria-hidden="true"
          ></span>
        </p>
      </article>

      <article class="example-card">
        <span class="example-label">TERMINAL</span>
        <p>
          $ npm run dev<span
            class="caret small-caret ease-anim-typewriter-caret-blink-cursor"
            aria-hidden="true"
          ></span>
        </p>
      </article>
    </section>

    <button
      type="button"
      onclick="
        document.querySelectorAll('.ease-anim-typewriter-caret-blink-cursor')
          .forEach((element) => {
            element.classList.remove(
              'ease-anim-typewriter-caret-blink-cursor'
            );
            void element.offsetWidth;
            element.classList.add(
              'ease-anim-typewriter-caret-blink-cursor'
            );
          });
      "
    >
      Replay Blink
    </button>
  </main>

</body>
</html>
