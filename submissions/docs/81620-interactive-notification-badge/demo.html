<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interactive Notification Badge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="demo-shell">
    <header class="demo-header">
      <p class="eyebrow">EaseMotion example</p>
      <h1>Interactive Notification Badge</h1>
      <p>Keyboard-accessible notification count with a visible focus state.</p>
    </header>
    <section class="demo-card" aria-labelledby="notifications-title">
      <div>
        <h2 id="notifications-title">Notifications</h2>
        <p>Open the notification area to review recent activity.</p>
      </div>
      <button class="notification-badge" type="button" aria-label="Open 4 notifications">
        <span aria-hidden="true">4</span>
      </button>
    </section>
  </main>
</body>
</html>
