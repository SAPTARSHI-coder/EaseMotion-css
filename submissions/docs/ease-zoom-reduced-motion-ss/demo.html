<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A11y: Prefers-Reduced-Motion Zoom Audit</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header style="text-align: center; margin-bottom: 2.5rem;">
      <h1 style="color: #38bdf8; margin: 0 0 0.5rem 0; font-size: 1.75rem;">Prefers-Reduced-Motion Zoom Audit</h1>
      <p style="color: #94a3b8; font-size: 0.875rem; max-width: 600px; margin: 0 auto;">
        Compliant with WCAG 2.1 AA (2.3.3 Animation from Interactions). Elements safely replace vestibular-triggering scale transforms with subtle opacity fades when system motion reduction is enabled.
      </p>
    </header>
    <div class="ease-card-grid">
      <button type="button" class="ease-zoom-card ease-zoom-in" aria-label="Entrance Zoom Card Example">
        <h2 style="font-size: 1.125rem; color: #f8fafc; margin-bottom: 0.5rem;">Entrance Zoom</h2>
        <p style="color: #64748b; font-size: 0.75rem; margin: 0;">Scales from 0.6 to 1.0 (Fades only under reduced-motion)</p>
      </button>
      <button type="button" class="ease-zoom-card ease-zoom-hover" aria-label="Hover Zoom Card Example">
        <h2 style="font-size: 1.125rem; color: #f8fafc; margin-bottom: 0.5rem;">Interactive Hover</h2>
        <p style="color: #64748b; font-size: 0.75rem; margin: 0;">Scales to 1.08 on hover (Border highlight only under reduced-motion)</p>
      </button>
    </div>
  </main>
</body>
</html>
