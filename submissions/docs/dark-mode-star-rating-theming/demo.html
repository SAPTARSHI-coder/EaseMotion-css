<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Mode Star Rating (Theming) Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="demo-container">
        
        <!-- Default Gold Theme -->
        <form action="#" class="rating-form">
            <h2>Classic Gold</h2>
            <fieldset class="star-rating">
                <legend class="sr-only">Rate this product (Classic Gold)</legend>
                <div class="star-rating__group">
                    <input type="radio" id="gold-5" name="rating-gold" value="5" class="sr-only">
                    <label for="gold-5" aria-label="5 stars" class="star-label"></label>
                    <input type="radio" id="gold-4" name="rating-gold" value="4" class="sr-only">
                    <label for="gold-4" aria-label="4 stars" class="star-label"></label>
                    <input type="radio" id="gold-3" name="rating-gold" value="3" class="sr-only">
                    <label for="gold-3" aria-label="3 stars" class="star-label"></label>
                    <input type="radio" id="gold-2" name="rating-gold" value="2" class="sr-only">
                    <label for="gold-2" aria-label="2 stars" class="star-label"></label>
                    <input type="radio" id="gold-1" name="rating-gold" value="1" class="sr-only">
                    <label for="gold-1" aria-label="1 star" class="star-label"></label>
                </div>
            </fieldset>
        </form>

        <!-- Neon Purple Theme Modifier -->
        <form action="#" class="rating-form">
            <h2>Neon Purple</h2>
            <fieldset class="star-rating star-rating--neon-purple">
                <legend class="sr-only">Rate this product (Neon Purple)</legend>
                <div class="star-rating__group">
                    <input type="radio" id="purple-5" name="rating-purple" value="5" class="sr-only">
                    <label for="purple-5" aria-label="5 stars" class="star-label"></label>
                    <input type="radio" id="purple-4" name="rating-purple" value="4" class="sr-only">
                    <label for="purple-4" aria-label="4 stars" class="star-label"></label>
                    <input type="radio" id="purple-3" name="rating-purple" value="3" class="sr-only">
                    <label for="purple-3" aria-label="3 stars" class="star-label"></label>
                    <input type="radio" id="purple-2" name="rating-purple" value="2" class="sr-only">
                    <label for="purple-2" aria-label="2 stars" class="star-label"></label>
                    <input type="radio" id="purple-1" name="rating-purple" value="1" class="sr-only">
                    <label for="purple-1" aria-label="1 star" class="star-label"></label>
                </div>
            </fieldset>
        </form>

    </main>
</body>
</html>
