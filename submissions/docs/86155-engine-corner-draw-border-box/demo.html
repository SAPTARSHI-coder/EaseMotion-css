<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corner Draw Border Box</title>

  <style>
    :root {
      --ease-corner-duration: 2s;
      --ease-corner-timing: ease-in-out;
      --ease-corner-size: 100%;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #0f1117;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .box {
      position: relative;
      width: min(420px, 85vw);
      padding: 70px 40px;
      text-align: center;
      background: #171a21;
      border-radius: 18px;
    }

    .box::before,
    .box::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 2px solid transparent;
      border-radius: inherit;
      pointer-events: none;
    }

    .box::before {
      border-top-color: #7c3aed;
      border-left-color: #7c3aed;
      transform-origin: top left;
    }

    .box::after {
      border-right-color: #06b6d4;
      border-bottom-color: #06b6d4;
      transform-origin: bottom right;
    }

    .ease-anim-corner-draw-border-box::before {
      animation:
        ease-corner-draw-border-box
        var(--ease-corner-duration)
        var(--ease-corner-timing)
        infinite;
    }

    .ease-anim-corner-draw-border-box::after {
      animation:
        ease-corner-draw-border-box
        var(--ease-corner-duration)
        var(--ease-corner-timing)
        infinite reverse;
    }

    @keyframes ease-corner-draw-border-box {
      0% {
        clip-path: inset(0 100% 100% 0);
        opacity: 0;
      }

      50% {
        clip-path: inset(0 0 0 0);
        opacity: 1;
      }

      100% {
        clip-path: inset(100% 0 0 100%);
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .ease-anim-corner-draw-border-box::before,
      .ease-anim-corner-draw-border-box::after {
        animation: none;
        clip-path: none;
        opacity: 1;
      }
    }

    h1 {
      margin: 0 0 12px;
      font-size: 2rem;
    }

    p {
      margin: 0;
      opacity: 0.65;
    }
  </style>
</head>

<body>
  <div
    class="box ease-anim-corner-draw-border-box"
    aria-label="Corner Draw Border Box"
  >
    <h1>Corner Draw</h1>
    <p>EaseMotion border animation preset</p>
  </div>
</body>
</html>
