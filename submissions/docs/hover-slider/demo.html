<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover Slider Demo - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-demo-container">
        <!-- Pure CSS Hover Slider Component Showcase -->
        <div class="em-slider-card" role="region" aria-label="Hover Slider Showcase" tabindex="0">
            <span class="em-card-badge">DOCUMENTATION</span>
            <h1 class="em-card-title">Hover Slider</h1>
            <p class="em-card-desc">A responsive, pure CSS hover slider component featuring smooth scroll snap tracking, interactive card elevations, and frosted glassmorphism.</p>
            <div class="em-slider-wrapper" aria-label="Hover Carousel">
                <div class="em-slider-container">
                    <div class="em-slider-item">
                        <span class="em-item-tag">SLIDE 01</span>
                        <h3 class="em-item-title">Motion Track</h3>
                    </div>
                    <div class="em-slider-item">
                        <span class="em-item-tag">SLIDE 02</span>
                        <h3 class="em-item-title">Smooth Snap</h3>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
