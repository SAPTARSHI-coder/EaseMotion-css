<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claymorphism Hero Banner (Quickstart) Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- Hero Section Container -->
    <header class="hero-section">
        
        <!-- Typography and Call to Action -->
        <div class="hero-content">
            <h1 class="hero-title">Build Fluffy, 3D Interfaces</h1>
            <p class="hero-text">
                Claymorphism is a friendly design trend that uses inflated shapes, pastel colors, and deep inset shadows to create a tactile, playful user experience.
            </p>
            <div class="hero-actions">
                <button type="button" class="clay-btn primary-btn">Start Building</button>
                <button type="button" class="clay-btn secondary-btn">Learn More</button>
            </div>
        </div>

        <!-- Decorative Graphic -->
        <div class="hero-visual" aria-hidden="true">
            <!-- Example of a floating claymorphic shape -->
            <div class="clay-blob"></div>
        </div>

    </header>

</body>
</html>
