<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion CSS — Vue 3 Integration Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="demo-container">
    <h1 class="demo-title">Vue 3 Integration Guide</h1>
    <p>This demo simulates how EaseMotion CSS works inside a Vue 3 Single File Component using standard class binding.</p>

    <div class="card ease-card-demo">
      <p>Static binding: <code>:class="['ease-fade-in']"</code></p>
    </div>

    <div class="card ease-card-demo ease-slide-up-demo" style="animation-delay: 200ms;">
      <p>Delayed entrance: <code>:class="{ 'ease-slide-up': isVisible }"</code></p>
    </div>

    <div class="card ease-card-demo ease-blur-demo" style="animation-delay: 400ms;">
      <p>Blur entrance: <code>:class="[{ 'ease-blur-in': isVisible }]"</code></p>
    </div>
  </div>
</body>
</html>
