name: Stylelint

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  stylelint:
    name: Stylelint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: |
          npm ci

      - name: Run Stylelint (fail on warnings)
        run: |
          npx stylelint "**/*.css" --max-warnings=0
