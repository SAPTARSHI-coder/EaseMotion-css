<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Hero Section Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hero-container">
    <div class="hero-content">
      <h1 class="hero-title ease-in-up">Welcome to EaseMotion</h1>
      <p class="hero-subtitle ease-in-up">Experience smooth and dynamic web animations with our simple CSS framework.</p>
      <div class="hero-buttons ease-in-up">
        <button class="hero-btn primary ease-hover-grow">Get Started</button>
        <button class="hero-btn secondary ease-hover-grow">Learn More</button>
      </div>
    </div>
    <div class="hero-background">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
    </div>
  </div>
</body>
</html>
