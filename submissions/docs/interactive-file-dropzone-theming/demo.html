<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive File Dropzone (Theming) Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="demo-container">
        
        <!-- Default State -->
        <div class="dropzone-container">
            <input type="file" id="dz-default" class="dropzone-input sr-only" multiple>
            <label for="dz-default" class="dropzone-label">
                <div class="dropzone-content">
                    <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    <span class="dropzone-title">Default State</span>
                </div>
            </label>
        </div>

        <!-- Success Theme Modifier (.theme-success) -->
        <div class="dropzone-container">
            <input type="file" id="dz-success" class="dropzone-input sr-only" multiple>
            <label for="dz-success" class="dropzone-label theme-success">
                <div class="dropzone-content">
                    <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                    </svg>
                    <span class="dropzone-title">Upload Complete!</span>
                </div>
            </label>
        </div>

        <!-- Error Theme Modifier (.theme-error) -->
        <div class="dropzone-container">
            <input type="file" id="dz-error" class="dropzone-input sr-only" multiple>
            <label for="dz-error" class="dropzone-label theme-error">
                <div class="dropzone-content">
                    <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <span class="dropzone-title">File too large</span>
                </div>
            </label>
        </div>

    </main>
</body>
</html>
