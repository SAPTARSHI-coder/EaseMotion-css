<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dynamic Navbar — Showcase & Usage</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="ease-nav-header">
    <nav class="ease-dynamic-navbar" aria-label="Main Navigation">
      <a href="#home" class="ease-nav-brand">⚡ EaseMotion</a>

      <input type="checkbox" id="ease-nav-toggle" class="ease-nav-checkbox" />
      <label for="ease-nav-toggle" class="ease-nav-hamburger" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </label>

      <ul class="ease-nav-menu" role="menubar">
        <li role="none"><a href="#home" class="ease-nav-link active" role="menuitem">Home</a></li>
        <li role="none"><a href="#components" class="ease-nav-link" role="menuitem">Components</a></li>
        <li role="none"><a href="#docs" class="ease-nav-link" role="menuitem">Docs</a></li>
      </ul>
    </nav>
  </header>
</body>
</html>
