<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentation: Floating Stat Card with Accessibility Integration - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-demo-container">
        <!-- Pure CSS Floating Stat Card Accessibility Integration Documentation Showcase -->
        <header class="em-stat-doc-card" role="region" aria-label="Floating Stat Card Documentation Showcase" tabindex="0">
            <div class="em-stat-header-bar">
                <span class="em-card-badge">COMPONENT DOCS</span>
                <span class="em-brand-logo">StatMotion</span>
            </div>
            <h1 class="em-card-title">Floating Stat Card (Accessibility)</h1>
            <p class="em-card-desc">Complete integration guide, accessible metrics markup, and live demo for the EaseMotion Floating Stat Card component (#15397).</p>
            <div class="em-stat-wrapper">
                <div class="ease-floating-stat em-card-accessible" role="region" aria-label="Floating Statistics Metric Card" tabindex="0">
                    <span class="em-stat-badge">LIVE METRIC</span>
                    <h2 class="em-stat-metric-value" aria-label="Metric value: 99.9 percent">99.9%</h2>
                    <p class="em-stat-metric-label">System Uptime Performance</p>
                    <div class="em-stat-trend positive" aria-label="Trend: Up 4.5 percent from last month">+4.5%</div>
                </div>
            </div>
        </header>
    </div>
</body>
</html>
