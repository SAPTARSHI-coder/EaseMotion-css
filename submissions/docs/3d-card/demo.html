<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentation: 3D Card Component - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-demo-container">
        <!-- Pure CSS 3D Card Documentation Showcase -->
        <header class="em-card-doc-wrapper" role="region" aria-label="3D Card Documentation Showcase" tabindex="0">
            <div class="em-card-header-bar">
                <span class="em-card-badge">COMPONENT DOCS</span>
                <span class="em-brand-logo">CardMotion</span>
            </div>
            <h1 class="em-card-title">3D Card Documentation</h1>
            <p class="em-card-desc">Complete integration guide and live demo for the EaseMotion 3D Card component, featuring hardware-accelerated perspective tilt and frosted glassmorphism.</p>
            <div class="em-component-stage">
                <div class="ease-3d-card" aria-label="Interactive 3D Card Element" tabindex="0">
                    <div class="em-card-content">
                        <span class="em-card-tag">EASEMOTION 3D</span>
                        <h2 class="em-inner-title">Immersive Depth</h2>
                        <p class="em-inner-text">Pure CSS perspective transformation and lighting gradients.</p>
                    </div>
                </div>
            </div>
        </header>
    </div>
</body>
</html>
