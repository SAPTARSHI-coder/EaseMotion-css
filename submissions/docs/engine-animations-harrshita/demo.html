<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion Engine Showcase: Proposed Animations</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="showcase-container">
    <h1 class="showcase-title">EaseMotion Engine Animation Proposal</h1>
    <p>This demo previews the proposed keyframe designs for the <code>blur-in</code>, <code>shimmer</code>, and <code>glitch</code> runtime features.</p>

    <div id="preview-box" class="demo-box">
      Preview Box
    </div>

    <div class="btn-group">
      <button class="showcase-btn" onclick="triggerAnimation('blur-in-active', 'Blur Entrance Active')">Blur-In</button>
      <button class="showcase-btn" onclick="triggerAnimation('shimmer-active', 'Skeleton Loader Active')">Shimmer</button>
      <button class="showcase-btn" onclick="triggerAnimation('glitch-active', 'Cyberpunk Glitch Active')">Glitch</button>
    </div>
  </div>

  <script>
    function triggerAnimation(cls, text) {
      const box = document.getElementById('preview-box');
      box.className = 'demo-box';
      box.textContent = text;
      // Trigger reflow
      void box.offsetWidth;
      box.classList.add(cls);
    }
  </script>
</body>
</html>
