<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Advanced dark mode File Dropzone styling demonstration.">
  <title>Dark Mode File Dropzone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell">
    <header class="page-header">
      <p class="eyebrow">EaseMotion CSS · Issue #81548</p>
      <h1>Dark Mode File Dropzone</h1>
      <p>Advanced dark-theme styling for a file upload area with clear focus and selection states.</p>
    </header>

    <section class="dropzone" aria-labelledby="dropzone-title">
      <div class="dropzone__content">
        <div class="dropzone__icon" aria-hidden="true">↑</div>
        <h2 id="dropzone-title">Drop your files here</h2>
        <p>PNG, JPG, PDF, and TXT files up to 10 MB.</p>
        <label class="dropzone__button" for="file-input">Choose files</label>
        <input class="dropzone__input" id="file-input" type="file" multiple accept="image/png,image/jpeg,application/pdf,text/plain">
        <p class="dropzone__status" aria-live="polite">No files selected.</p>
      </div>
    </section>
  </main>

  <script>
    const input = document.querySelector('#file-input');
    const status = document.querySelector('.dropzone__status');
    input.addEventListener('change', () => {
      const count = input.files.length;
      status.textContent = count ? `${count} file${count === 1 ? '' : 's'} selected.` : 'No files selected.';
    });
  </script>
</body>
</html>
