<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pastel Stat Metric Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="demo-shell">
    <header><p class="eyebrow">EaseMotion CSS · #85757</p><h1>Pastel Stat Metric Card</h1><p>A themeable metric surface for dashboards and product summaries.</p></header>
    <section class="stats" aria-label="Project metrics">
      <article class="stat-card"><p class="stat-card__label">Active users</p><strong class="stat-card__value">24.8K</strong><p>Across all workspaces</p></article>
      <article class="stat-card stat-card--mint"><p class="stat-card__label">Conversion</p><strong class="stat-card__value">18.6%</strong><p>Up from last month</p></article>
    </section>
  </main>
</body>
</html>
