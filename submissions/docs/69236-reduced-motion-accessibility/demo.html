<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reduced Motion Accessibility Test</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="demo">
    <h1>Reduced Motion Test</h1>

    <p>
      This demo verifies that motion is minimized when
      <code>prefers-reduced-motion: reduce</code> is enabled.
    </p>

    <div class="motion-box" aria-label="Animated demonstration">
      EaseMotion
    </div>

    <p class="status">
      Change your browser or operating-system motion preference
      to compare normal and reduced-motion behavior.
    </p>
  </main>
</body>
</html>
