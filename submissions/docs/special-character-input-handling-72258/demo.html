<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Special Character Input Handling</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Special Character Input Handling</h1>

    <p>
      This demo provides representative inputs for validating
      special-character handling.
    </p>

    <section class="test-card">
      <h2>Input Cases</h2>

      <label for="symbols">Symbols and punctuation</label>
      <input
        id="symbols"
        type="text"
        value="!@#$%^&amp;*()_+-=[]{}"
      >

      <label for="mixed">Mixed characters</label>
      <input
        id="mixed"
        type="text"
        value="Hello @World! 123"
      >

      <label for="spaces">Spaces and special characters</label>
      <input
        id="spaces"
        type="text"
        value="  test &amp; input  "
      >

      <label for="repeated">Repeated special characters</label>
      <input
        id="repeated"
        type="text"
        value="!!!@@@###"
      >

      <button type="button" id="validateButton">
        Validate Inputs
      </button>

      <p id="result" class="result" aria-live="polite"></p>
    </section>
  </main>

  <script>
    const button = document.getElementById("validateButton");
    const result = document.getElementById("result");

    button.addEventListener("click", () => {
      const inputs = document.querySelectorAll("input");
      const allPresent = [...inputs].every(input => input.value.length > 0);

      result.textContent = allPresent
        ? "All representative special-character inputs are present."
        : "One or more inputs are empty.";
    });
  </script>
</body>
</html>
