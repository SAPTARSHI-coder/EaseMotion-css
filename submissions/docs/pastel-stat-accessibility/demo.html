<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastel Stat Metric Card (Accessibility) Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="demo-container">
        
        <!-- 
            CRITICAL ACCESSIBILITY: Semantic Structure
            A metric card should be wrapped in an article or section if it stands alone,
            or a list item if it's part of a dashboard grid.
            Use aria-labelledby to connect the card container to its title.
        -->
        <article class="stat-card pastel-blue" aria-labelledby="stat-title-1">
            
            <div class="stat-header">
                <h3 id="stat-title-1" class="stat-title">Total Revenue</h3>
                
                <!-- 
                    Icons must be decorative (aria-hidden) OR have alternative text 
                    if they convey unique meaning. 
                -->
                <div class="stat-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="1" x2="12" y2="23"></line>
                        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                    </svg>
                </div>
            </div>

            <div class="stat-body">
                <!-- 
                    The primary metric. 
                    Ensure the color used here contrasts sufficiently against the pastel background.
                -->
                <p class="stat-value">$124,500</p>
                
                <div class="stat-trend trend-up">
                    <span aria-hidden="true">↑</span>
                    <!-- 
                        Visually hidden text for screen readers. 
                        "↑ 12%" is not read well by all screen readers. 
                        "Up 12% from last month" is explicitly clear.
                    -->
                    <span class="sr-only">Increased by</span> 
                    <span>12%</span> 
                    <span class="sr-only">from last month</span>
                </div>
            </div>

            <div class="stat-footer">
                <!-- 
                    Interactive elements must have a visible focus ring 
                -->
                <a href="#" class="stat-link" aria-label="View detailed revenue report">
                    View Report
                    <svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </a>
            </div>

        </article>

    </main>
</body>
</html>
