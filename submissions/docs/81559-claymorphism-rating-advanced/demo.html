<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Advanced Claymorphism Rating demonstration.">
  <title>Claymorphism Rating</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="page__header">
      <p class="eyebrow">EaseMotion CSS · #81559</p>
      <h1>Claymorphism Rating</h1>
      <p>Soft raised surfaces with semantic radio controls and clear selected states.</p>
    </header>

    <section class="rating-card" aria-labelledby="rating-title">
      <p class="rating-card__eyebrow">Advanced styling</p>
      <h2 id="rating-title">How was your experience?</h2>
      <fieldset class="rating">
        <legend class="rating__label">Choose a rating from one to five</legend>
        <div class="rating__options">
          <label class="rating__option"><input name="rating" type="radio" value="1"><span>1</span></label>
          <label class="rating__option"><input name="rating" type="radio" value="2"><span>2</span></label>
          <label class="rating__option"><input name="rating" type="radio" value="3"><span>3</span></label>
          <label class="rating__option"><input name="rating" type="radio" value="4"><span>4</span></label>
          <label class="rating__option"><input name="rating" type="radio" value="5"><span>5</span></label>
        </div>
      </fieldset>
    </section>
  </main>
</body>
</html>
