<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Basic Gradient Glow Multi-Select demonstration.">
  <title>Gradient Glow Multi-Select</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell">
    <header class="page-header">
      <p class="eyebrow">EaseMotion CSS · Issue #81554</p>
      <h1>Gradient Glow Multi-Select</h1>
      <p>Multiple native checkbox options with a gradient glow presentation and responsive layout.</p>
    </header>

    <section class="multi-select" aria-labelledby="multi-select-title">
      <fieldset>
        <legend id="multi-select-title">Choose project interests</legend>
        <label class="multi-select__option">
          <input class="multi-select__input" type="checkbox" name="interest" value="motion">
          <span class="multi-select__label">Motion effects</span>
        </label>
        <label class="multi-select__option">
          <input class="multi-select__input" type="checkbox" name="interest" value="components">
          <span class="multi-select__label">Components</span>
        </label>
        <label class="multi-select__option">
          <input class="multi-select__input" type="checkbox" name="interest" value="responsive">
          <span class="multi-select__label">Responsive layouts</span>
        </label>
        <label class="multi-select__option">
          <input class="multi-select__input" type="checkbox" name="interest" value="accessibility">
          <span class="multi-select__label">Accessibility</span>
        </label>
      </fieldset>
    </section>
  </main>
</body>
</html>
