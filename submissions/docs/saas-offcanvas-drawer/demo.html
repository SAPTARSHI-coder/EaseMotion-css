<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Offcanvas Drawer (Quickstart) Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="demo-container">
        
        <button type="button" class="saas-btn trigger-drawer" aria-expanded="false" aria-controls="drawer-1">
            Open Settings Drawer
        </button>

        <!-- 
            CRITICAL ACCESSIBILITY:
            The backdrop must be distinctly separate from the dialog container, 
            or it can interfere with click/focus trapping.
        -->
        <div class="drawer-backdrop" aria-hidden="true" id="drawer-backdrop"></div>

        <!-- 
            CRITICAL ACCESSIBILITY:
            role="dialog" and aria-modal="true" tell the screen reader that 
            this overlays the main content and background content is inactive.
        -->
        <aside 
            class="saas-drawer" 
            id="drawer-1"
            role="dialog" 
            aria-modal="true" 
            aria-labelledby="drawer-title"
            hidden
        >
            <div class="drawer-header">
                <h2 id="drawer-title" class="drawer-title">Account Settings</h2>
                <button type="button" class="drawer-close" aria-label="Close drawer">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            
            <div class="drawer-body">
                <p>Configure your SaaS account preferences here.</p>
                <!-- Form elements would go here -->
                <input type="text" class="saas-input" placeholder="Organization Name">
            </div>
            
            <div class="drawer-footer">
                <button type="button" class="saas-btn btn-secondary close-btn">Cancel</button>
                <button type="button" class="saas-btn btn-primary">Save Changes</button>
            </div>
        </aside>

    </main>

    <script>
        // Minimal script to demonstrate drawer toggle mechanics
        const trigger = document.querySelector('.trigger-drawer');
        const drawer = document.getElementById('drawer-1');
        const backdrop = document.getElementById('drawer-backdrop');
        const closeBtns = document.querySelectorAll('.drawer-close, .close-btn');

        function openDrawer() {
            drawer.removeAttribute('hidden');
            backdrop.classList.add('is-active');
            trigger.setAttribute('aria-expanded', 'true');
            // Allow a small tick for display:block to apply before animating transform
            setTimeout(() => {
                drawer.classList.add('is-open');
            }, 10);
        }

        function closeDrawer() {
            drawer.classList.remove('is-open');
            backdrop.classList.remove('is-active');
            trigger.setAttribute('aria-expanded', 'false');
            // Wait for transition to finish before hiding
            setTimeout(() => {
                drawer.setAttribute('hidden', '');
            }, 300); // Matches CSS transition time
        }

        trigger.addEventListener('click', openDrawer);
        backdrop.addEventListener('click', closeDrawer);
        closeBtns.forEach(btn => btn.addEventListener('click', closeDrawer));
    </script>
</body>
</html>
