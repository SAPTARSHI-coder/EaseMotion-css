<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hardware Acceleration Verification Benchmark</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div>
    <h2 style="text-align: center; margin-bottom: 2rem; color: #94a3b8; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; font-size: 0.875rem;">GPU Accelerated Animation</h2>
    <div class="ease-accel-card">60 FPS</div>
  </div>

  <script>
    let frameCount = 0;
    let lastTime = performance.now();
    const monitor = document.createElement('div');
    monitor.style.cssText = 'position: fixed; bottom: 20px; right: 20px; background: #000; color: #0f0; padding: 10px; font-family: monospace; border-radius: 8px; font-size: 14px; z-index: 9999;';
    document.body.appendChild(monitor);
    
    function measureFPS() {
      const now = performance.now();
      frameCount++;
      if (now >= lastTime + 1000) {
        monitor.textContent = `FPS: ${Math.round((frameCount * 1000) / (now - lastTime))}`;
        frameCount = 0;
        lastTime = now;
      }
      requestAnimationFrame(measureFPS);
    }
    requestAnimationFrame(measureFPS);
  </script>
</body>
</html>
