<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Neumorphic tooltip usage demonstration.">
  <title>Neumorphic Tooltip</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="page__header">
      <p class="eyebrow">EaseMotion CSS · #80005</p>
      <h1>Neumorphic Tooltip</h1>
      <p>Focus or hover the trigger to reveal a soft, accessible explanation.</p>
    </header>
    <section class="demo-card" aria-labelledby="tooltip-title">
      <h2 id="tooltip-title">Account settings</h2>
      <div class="tooltip">
        <button class="tooltip__trigger" type="button" aria-describedby="tip">?</button>
        <span class="tooltip__content" id="tip" role="tooltip">Your account settings control notification and privacy preferences.</span>
      </div>
    </section>
  </main>
</body>
</html>
