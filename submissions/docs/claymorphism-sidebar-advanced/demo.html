<!DOCTYPE html>

<head>

  <title>Claymorphism Sidebar - Advanced Styling</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<button
 class="sidebar-toggle"
 type="button"
 aria-controls="advanced-sidebar"
 aria-expanded="false">
Open Menu </button>

  <aside
    id="advanced-sidebar"
    class="clay-sidebar clay-sidebar--elevated"
    aria-label="Advanced navigation">

```
<div class="clay-sidebar__header">
  <div>
    <span class="clay-sidebar__eyebrow">Dashboard</span>
    <h2 class="clay-sidebar__title">Navigation</h2>
  </div>

  <button
    class="clay-sidebar__close"
    type="button"
    aria-label="Close navigation">
    &times;
  </button>
</div>

<nav aria-label="Primary navigation">
  <ul class="clay-sidebar__menu">

    <li>
      <a
        class="clay-sidebar__link clay-sidebar__link--active"
        href="#home">
        <span aria-hidden="true">⌂</span>
        <span>Home</span>
      </a>
    </li>

    <li>
      <a
        class="clay-sidebar__link"
        href="#projects">
        <span aria-hidden="true">◆</span>
        <span>Projects</span>
      </a>
    </li>

    <li>
      <a
        class="clay-sidebar__link"
        href="#analytics">
        <span aria-hidden="true">▣</span>
        <span>Analytics</span>
      </a>
    </li>

    <li>
      <a
        class="clay-sidebar__link"
        href="#settings">
        <span aria-hidden="true">⚙</span>
        <span>Settings</span>
      </a>
    </li>

  </ul>
</nav>
