<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Modal Demo - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-demo-container">
        <!-- Pure CSS Dynamic Modal Component Showcase -->
        <div class="em-modal-card" role="region" aria-label="Dynamic Modal Showcase" tabindex="0">
            <span class="em-card-badge">DOCUMENTATION</span>
            <h1 class="em-card-title">Dynamic Modal</h1>
            <p class="em-card-desc">A responsive, pure CSS dynamic modal container featuring backdrop blur, smooth entry scale transitions, and glowing indigo-purple accents.</p>
            <div class="em-modal-preview" role="dialog" aria-modal="true" aria-labelledby="modal-title">
                <div class="em-modal-header">
                    <h3 id="modal-title" class="em-modal-heading">Dynamic Dialog</h3>
                    <span class="em-modal-close" aria-label="Close modal">&times;</span>
                </div>
                <p class="em-modal-body">Dynamic modal component layer initialized successfully with frosted glassmorphism.</p>
            </div>
        </div>
    </div>
</body>
</html>
