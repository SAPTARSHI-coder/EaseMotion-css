<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion Animation Playback Controls</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <h1>Animation Playback Controls</h1>
    <p class="subtitle">
      Play, pause, resume, restart, reverse and cancel CSS animations.
    </p>

    <section class="demo-card">
      <div class="stage">
        <div class="animated-box" id="animatedBox"></div>
      </div>

      <div class="controls">
        <button type="button" id="playBtn">▶ Play</button>
        <button type="button" id="pauseBtn">⏸ Pause</button>
        <button type="button" id="resumeBtn">▶ Resume</button>
        <button type="button" id="restartBtn">↻ Restart</button>
        <button type="button" id="reverseBtn">↔ Reverse</button>
        <button type="button" id="cancelBtn">✕ Cancel</button>
      </div>

      <p class="status">
        Status: <strong id="statusText">Ready</strong>
      </p>
    </section>

    <section class="demo-card multi-demo">
      <h2>Multiple Animations</h2>

      <div class="multi-stage">
        <div class="animated-item item-one"></div>
        <div class="animated-item item-two"></div>
        <div class="animated-item item-three"></div>
      </div>

      <button type="button" id="multiPlayBtn">▶ Play All</button>
      <button type="button" id="multiPauseBtn">⏸ Pause All</button>
      <button type="button" id="multiRestartBtn">↻ Restart All</button>
      <button type="button" id="multiCancelBtn">✕ Cancel All</button>
    </section>
  </main>

  <script>
    const box = document.getElementById("animatedBox");
    const statusText = document.getElementById("statusText");

    let animation = null;

    function setStatus(message) {
      statusText.textContent = message;
    }

    function createAnimation() {
      return box.animate(
        [
          {
            transform: "translateX(0) rotate(0deg)",
            opacity: 0.5
          },
          {
            transform: "translateX(260px) rotate(360deg)",
            opacity: 1
          }
        ],
        {
          duration: 1800,
          easing: "ease-in-out",
          fill: "both"
        }
      );
    }

    document.getElementById("playBtn").addEventListener("click", () => {
      if (!animation) {
        animation = createAnimation();
      }

      animation.play();
      setStatus("Playing");
    });

    document.getElementById("pauseBtn").addEventListener("click", () => {
      if (!animation) {
        setStatus("Nothing to pause");
        return;
      }

      animation.pause();
      setStatus("Paused");
    });

    document.getElementById("resumeBtn").addEventListener("click", () => {
      if (!animation) {
        animation = createAnimation();
      }

      animation.play();
      setStatus("Resumed");
    });

    document.getElementById("restartBtn").addEventListener("click", () => {
      if (animation) {
        animation.cancel();
      }

      animation = createAnimation();
      animation.play();

      setStatus("Restarted");
    });

    document.getElementById("reverseBtn").addEventListener("click", () => {
      if (!animation) {
        animation = createAnimation();
      }

      animation.reverse();
      setStatus("Reversed");
    });

    document.getElementById("cancelBtn").addEventListener("click", () => {
      if (!animation) {
        setStatus("Already cancelled");
        return;
      }

      animation.cancel();
      animation = null;

      setStatus("Cancelled");
    });

    /*
     * Multiple animation controls
     */
    const items = document.querySelectorAll(".animated-item");
    let multiAnimations = [];

    function createMultiAnimations() {
      return Array.from(items).map((item, index) => {
        return item.animate(
          [
            {
              transform: "translateX(0)",
              opacity: 0.4
            },
            {
              transform: "translateX(220px)",
              opacity: 1
            }
          ],
          {
            duration: 1200 + index * 300,
            easing: "ease-in-out",
            fill: "both"
          }
        );
      });
    }

    document.getElementById("multiPlayBtn").addEventListener("click", () => {
      if (!multiAnimations.length) {
        multiAnimations = createMultiAnimations();
      }

      multiAnimations.forEach((itemAnimation) => itemAnimation.play());
    });

    document.getElementById("multiPauseBtn").addEventListener("click", () => {
      multiAnimations.forEach((itemAnimation) => itemAnimation.pause());
    });

    document.getElementById("multiRestartBtn").addEventListener("click", () => {
      multiAnimations.forEach((itemAnimation) => itemAnimation.cancel());

      multiAnimations = createMultiAnimations();

      multiAnimations.forEach((itemAnimation) => itemAnimation.play());
    });

    document.getElementById("multiCancelBtn").addEventListener("click", () => {
      multiAnimations.forEach((itemAnimation) => itemAnimation.cancel());
      multiAnimations = [];
    });
  </script>

</body>
</html>
