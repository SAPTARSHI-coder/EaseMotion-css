<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bubble Pop Expand Burst | EaseMotion</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <section class="demo-card">

      <div class="eyebrow">
        EaseMotion Core Animation
      </div>

      <h1>Bubble Pop Expand Burst</h1>

      <p class="description">
        A playful entrance animation that pops an element into view,
        expands beyond its final size, and smoothly settles into place.
      </p>

      <div class="animation-stage">

        <div
          class="bubble ease-anim-bubble-pop-expand-burst"
          aria-label="Bubble Pop Expand Burst animation preview"
        >
          <span>✦</span>
        </div>

      </div>

      <button
        type="button"
        class="replay-button"
        id="replayButton"
      >
        Replay Animation
      </button>

    </section>

  </main>

  <script>
    const replayButton = document.getElementById("replayButton");
    const bubble = document.querySelector(
      ".ease-anim-bubble-pop-expand-burst"
    );

    replayButton.addEventListener("click", () => {
      bubble.classList.remove(
        "ease-anim-bubble-pop-expand-burst"
      );

      void bubble.offsetWidth;

      bubble.classList.add(
        "ease-anim-bubble-pop-expand-burst"
      );
    });
  </script>

</body>
</html>
