<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parallel Worker Farm Test Runner Architecture</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <header class="header">
      <h1>⚡ Parallel Worker-Farm Test Suite</h1>
      <p>Architecture benchmark comparison: Sequential vs. Parallel execution</p>
    </header>

    <section class="benchmark-grid">
      <div class="benchmark-card sequential">
        <h3>Sequential Execution</h3>
        <span class="badge">1 Thread</span>
        <div class="progress-bar"><div class="fill seq-fill"></div></div>
        <p class="time">~12.4s total runtime</p>
      </div>

      <div class="benchmark-card parallel">
        <h3>Parallel Worker-Farm</h3>
        <span class="badge active">8 Workers</span>
        <div class="progress-bar"><div class="fill par-fill"></div></div>
        <p class="time">~1.8s total runtime (85% faster)</p>
      </div>
    </section>
  </main>
</body>
</html>
