<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Accessible responsive video player documentation demo.">
  <title>Responsive Video Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="page__header">
      <p class="eyebrow">EaseMotion CSS · #81623</p>
      <h1>Responsive Video Player</h1>
      <p>Accessible media markup that remains usable across viewport sizes.</p>
    </header>
    <section class="video-player" aria-labelledby="video-title">
      <h2 id="video-title">Product walkthrough</h2>
      <video class="video-player__media" controls preload="metadata" aria-describedby="video-caption">
        <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
        Your browser does not support embedded video.
      </video>
      <p id="video-caption" class="video-player__caption">Use the native controls and provide captions for production media.</p>
    </section>
  </main>
</body>
</html>
