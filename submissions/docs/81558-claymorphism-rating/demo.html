<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Basic Claymorphism Rating demonstration.">
  <title>Claymorphism Rating</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell">
    <header class="page-header">
      <p class="eyebrow">EaseMotion CSS · Issue #81558</p>
      <h1>Claymorphism Rating</h1>
      <p>A soft rating control using native radio inputs with a tactile clay-style visual treatment.</p>
    </header>

    <section class="rating" aria-labelledby="rating-title">
      <fieldset>
        <legend id="rating-title">Rate your experience</legend>
        <div class="rating__group">
          <label class="rating__option">
            <input class="rating__input" type="radio" name="rating" value="1">
            <span class="rating__label">1 · Needs work</span>
          </label>
          <label class="rating__option">
            <input class="rating__input" type="radio" name="rating" value="2">
            <span class="rating__label">2 · Fair</span>
          </label>
          <label class="rating__option">
            <input class="rating__input" type="radio" name="rating" value="3">
            <span class="rating__label">3 · Good</span>
          </label>
          <label class="rating__option">
            <input class="rating__input" type="radio" name="rating" value="4">
            <span class="rating__label">4 · Great</span>
          </label>
          <label class="rating__option">
            <input class="rating__input" type="radio" name="rating" value="5">
            <span class="rating__label">5 · Excellent</span>
          </label>
        </div>
      </fieldset>
    </section>
  </main>
</body>
</html>
