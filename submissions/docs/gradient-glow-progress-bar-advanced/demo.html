<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gradient Glow Progress Bar - Advanced</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="progress-demo">
    <h1>Advanced Gradient Glow Progress Bar</h1>

    <div
      class="progress-bar progress-bar--large"
      role="progressbar"
      aria-label="Project completion"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="75"
    >
      <div class="progress-bar__fill" style="width: 75%;">
        <span class="progress-bar__shine" aria-hidden="true"></span>
      </div>
    </div>

    <div class="progress-bar__info">
      <span>Project Progress</span>
      <strong>75%</strong>
    </div>
  </main>

</body>
</html>
