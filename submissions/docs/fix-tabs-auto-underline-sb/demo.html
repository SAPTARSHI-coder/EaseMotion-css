<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabs Auto Variant — Underline Hidden Fix</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #eee; padding: 2rem; }
    h1 { color: #fff; margin-bottom: 0.5rem; }
    p { color: #aaa; margin-bottom: 2rem; }
    section { margin-bottom: 2rem; padding: 1.5rem; border-radius: 0.5rem; background: #252542; }
    section h2 { color: #fff; margin-bottom: 1rem; }
  </style>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Tabs Auto Variant — Underline Hidden Fix</h1>
  <p>The sliding underline should be hidden when using <code>ease-tabs-auto</code>.</p>
  <section>
    <h2>Fixed: ease-tabs-auto with hidden underline</h2>
    <div class="ease-tabs ease-tabs-auto">
      <div class="ease-tabs-nav">
        <label class="ease-tab">
          <input type="radio" name="tab-auto" class="ease-tab-input" checked>
          <span class="ease-tab-label">Home</span>
        </label>
        <label class="ease-tab">
          <input type="radio" name="tab-auto" class="ease-tab-input">
          <span class="ease-tab-label">About</span>
        </label>
        <label class="ease-tab">
          <input type="radio" name="tab-auto" class="ease-tab-input">
          <span class="ease-tab-label">Contact</span>
        </label>
      </div>
      <div class="ease-tabs-content">
        <div class="ease-tab-panel"><h3>Home Content</h3></div>
        <div class="ease-tab-panel"><h3>About Content</h3></div>
        <div class="ease-tab-panel"><h3>Contact Content</h3></div>
      </div>
    </div>
  </section>
</body>
</html>
