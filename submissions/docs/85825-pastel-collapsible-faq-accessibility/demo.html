<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pastel FAQ Accordion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="page__header">
      <p class="eyebrow">EaseMotion CSS · #85825</p>
      <h1>Pastel FAQ Accordion</h1>
      <p>Accessible questions with explicit expanded state and responsive content.</p>
    </header>
    <section class="faq" aria-labelledby="faq-title">
      <h2 id="faq-title">Frequently asked questions</h2>
      <article class="faq__item">
        <h3><button class="faq__trigger" type="button" aria-expanded="false" aria-controls="faq-answer-1">How does it work?</button></h3>
        <div class="faq__answer" id="faq-answer-1" hidden>Each trigger controls its associated answer region.</div>
      </article>
      <article class="faq__item">
        <h3><button class="faq__trigger" type="button" aria-expanded="false" aria-controls="faq-answer-2">Can it be themed?</button></h3>
        <div class="faq__answer" id="faq-answer-2" hidden>Yes. CSS custom properties control the visual treatment.</div>
      </article>
    </section>
  </main>
</body>
</html>
