<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Toggle Demo - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-demo-container">
        <!-- Pure CSS Interactive Toggle Component Showcase -->
        <div class="em-toggle-card" role="region" aria-label="Interactive Toggle Showcase" tabindex="0">
            <span class="em-card-badge">DOCUMENTATION</span>
            <h1 class="em-card-title">Interactive Toggle</h1>
            <p class="em-card-desc">A responsive, pure CSS toggle switch component featuring smooth sliding states and frosted glassmorphism card styling.</p>
            <div class="em-toggle-wrapper">
                <label class="em-toggle-switch">
                    <input type="checkbox" aria-label="Toggle Switch">
                    <span class="em-toggle-slider"></span>
                </label>
            </div>
        </div>
    </div>
</body>
</html>
