<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentation: Interactive Toggle Component - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-demo-container">
        <!-- Pure CSS Interactive Toggle Documentation Showcase -->
        <header class="em-toggle-doc-card" role="region" aria-label="Interactive Toggle Documentation Showcase" tabindex="0">
            <div class="em-toggle-header-bar">
                <span class="em-card-badge">COMPONENT DOCS</span>
                <span class="em-brand-logo">ToggleMotion</span>
            </div>
            <h1 class="em-card-title">Interactive Toggle Documentation</h1>
            <p class="em-card-desc">Complete integration guide and live demo for the EaseMotion Interactive Toggle component, featuring smooth sliding transitions and frosted glassmorphism.</p>
            <div class="em-toggle-wrapper">
                <label class="ease-interactive-toggle" aria-label="Interactive Toggle Switch Element" tabindex="0">
                    <input type="checkbox" class="em-toggle-checkbox" checked>
                    <span class="em-toggle-slider"></span>
                </label>
            </div>
        </header>
    </div>
</body>
</html>
