<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Engine Shadow DOM Injector — EaseMotion CSS</title>
  <link rel="stylesheet" href="../../../easemotion.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="ease-center">
  <div class="shadow-demo-container">
    <h2>⚡ Shadow DOM Component Test</h2>
    <custom-animated-card></custom-animated-card>
  </div>

  <script type="module">
    class CustomAnimatedCard extends HTMLElement {
      constructor() {
        super();
        const shadow = this.attachShadow({ mode: 'open' });
        shadow.innerHTML = `
          <style>
            .card {
              padding: 1.5rem;
              background: #181825;
              border-radius: 0.75rem;
              color: #cdd6f4;
              border: 1px solid rgba(255,255,255,0.1);
            }
          </style>
          <div class="card" em="fade-in duration-medium">
            Shadow Root Encapsulated Card Content
          </div>
        `;
      }
    }
    customElements.define('custom-animated-card', CustomAnimatedCard);
  </script>
  <script type="module" src="../../../easemotion/index.js"></script>
</body>
</html>
