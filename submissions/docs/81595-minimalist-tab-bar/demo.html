<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Minimalist Tab Bar</title><link rel="stylesheet" href="style.css"></head>
<body><main class="demo-shell"><header><p>EaseMotion example</p><h1>Minimalist Tab Bar</h1><p>Semantic tab controls with selected state and keyboard-oriented markup.</p></header><div class="tabs" role="tablist" aria-label="Account sections"><button class="tab" role="tab" aria-selected="true" aria-controls="panel-profile" id="tab-profile">Profile</button><button class="tab" role="tab" aria-selected="false" aria-controls="panel-security" id="tab-security" tabindex="-1">Security</button></div><section id="panel-profile" role="tabpanel" aria-labelledby="tab-profile"><h2>Profile</h2><p>Profile content is visible in this static demonstration.</p></section></main></body></html>
