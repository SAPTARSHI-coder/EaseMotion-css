<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Custom Audio Player Widget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="demo-shell">
    <header class="demo-header">
      <p class="eyebrow">EaseMotion CSS · #85799</p>
      <h1>Custom Audio Player Widget</h1>
      <p>A themeable audio surface using CSS variables and native media controls.</p>
    </header>
    <section class="audio-widget" aria-labelledby="audio-title">
      <p class="audio-widget__label">Theming configuration</p>
      <h2 id="audio-title">Episode preview</h2>
      <audio class="audio-widget__media" controls preload="metadata">
        <source src="episode.mp3" type="audio/mpeg">
        Your browser does not support HTML audio.
      </audio>
      <p class="audio-widget__note">Replace the sample source with the project's media asset.</p>
    </section>
  </main>
</body>
</html>
