<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Engine Motion Path Path-Follower — EaseMotion CSS</title>
  <link rel="stylesheet" href="../../../easemotion.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="ease-center">
  <div class="path-demo-area">
    <svg class="path-svg" viewBox="0 0 400 200">
      <path id="motionPath" d="M 20 100 Q 100 20, 200 100 T 380 100" fill="none" stroke="rgba(255,255,255,0.2)" strokeWidth="2" />
    </svg>
    <div class="path-follower" em="path-follow(motionPath) duration-slow repeat-infinite">
      🚀
    </div>
  </div>
  <script type="module" src="../../../easemotion/index.js"></script>
</body>
</html>
