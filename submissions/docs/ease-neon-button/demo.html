<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion - Responsive Neon Button Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ease-docs-grid">

    <!-- Section 1: Fluid Responsiveness Showcase -->
    <section style="width: 100%; display: flex; flex-direction: column; align-items: center;">
      <h3 style="color: #94a3b8; font-size: 0.875rem; text-transform: uppercase; letter-spacing: 1px; width: 100%; text-align: center; margin-bottom: 2rem;">
        01. Fluid Responsiveness (Resize browser to scale)
      </h3>
      <div class="ease-btn-row">
        <button type="button" class="ease-neon-btn">
          Fluid Scale
        </button>
      </div>
      <p style="color: #64748b; font-size: 0.8rem; margin-top: 1rem; text-align: center;">
        Padding and typography scale dynamically from mobile to desktop without media queries.
      </p>
    </section>

    <!-- Section 2: Color Variants Showcase -->
    <section style="width: 100%; display: flex; flex-direction: column; align-items: center;">
      <h3 style="color: #94a3b8; font-size: 0.875rem; text-transform: uppercase; letter-spacing: 1px; width: 100%; text-align: center; margin-bottom: 2rem;">
        02. Color Variants (CSS Custom Property Override)
      </h3>
      <div class="ease-btn-row">
        <button type="button" class="ease-neon-btn">
          Default Cyan
        </button>

        <button type="button" class="ease-neon-btn ease-neon-btn--matrix">
          Matrix Green
        </button>

        <button type="button" class="ease-neon-btn ease-neon-btn--cyber">
          Cyber Pink
        </button>

        <a href="#" class="ease-neon-btn ease-neon-btn--warning">
          Warning Amber
        </a>
      </div>
    </section>

  </div>
</body>
</html>
