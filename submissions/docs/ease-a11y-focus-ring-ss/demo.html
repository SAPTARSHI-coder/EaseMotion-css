<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A11y: Dark Background Focus Rings</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="ease-a11y-container" aria-labelledby="audit-title">
    <div style="width: 100%; margin-bottom: 1rem;">
      <h1 id="audit-title" style="margin: 0; font-size: 1.5rem;">Focus Ring Visibility Audit</h1>
      <p style="color: #94a3b8; font-size: 0.875rem; margin-top: 0.5rem;">Use the <strong>Tab</strong> key to navigate. Notice the dual-layer high-contrast ring.</p>
    </div>
    <button class="ease-btn" aria-label="Submit application form">Submit Action</button>
    <button class="ease-btn" style="background: transparent; border: 1px solid #3b82f6; color: #38bdf8;" aria-label="Cancel and go back">Secondary Action</button>
    <a href="#" class="ease-link" aria-label="Read our accessibility documentation">Documentation Link</a>
  </main>
</body>
</html>
