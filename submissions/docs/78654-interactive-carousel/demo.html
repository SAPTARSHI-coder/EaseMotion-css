<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive Carousel usage demo for EaseMotion CSS issue 78654">
  <title>Interactive Carousel | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell">
    <section class="demo" aria-labelledby="title">
      <p class="eyebrow">EaseMotion CSS · Issue #78654</p>
      <h1 id="title">Interactive Carousel</h1>
      <div class="carousel" data-carousel>
        <div class="viewport">
          <div class="track">
            <article class="slide"><span>01</span><h2>Motion</h2><p>Keep movement purposeful and easy to follow.</p></article>
            <article class="slide"><span>02</span><h2>Structure</h2><p>Separate content, controls, and presentation.</p></article>
            <article class="slide"><span>03</span><h2>Responsive</h2><p>Adapt the visible card width to the viewport.</p></article>
            <article class="slide"><span>04</span><h2>Accessible</h2><p>Use native buttons with clear accessible names.</p></article>
          </div>
        </div>
        <div class="controls">
          <button type="button" data-prev aria-label="Previous slide">Previous</button>
          <button type="button" data-next aria-label="Next slide">Next</button>
        </div>
      </div>
    </section>
  </main>
  <script>
    const track = document.querySelector('.track');
    const slides = [...document.querySelectorAll('.slide')];
    let index = 0;

    function moveCarousel(nextIndex) {
      index = Math.max(0, Math.min(nextIndex, slides.length - 1));
      track.style.transform = `translateX(-${index * 100}%)`;
    }

    document.querySelector('[data-prev]').addEventListener('click', () => moveCarousel(index - 1));
    document.querySelector('[data-next]').addEventListener('click', () => moveCarousel(index + 1));
  </script>
</body>
</html>
