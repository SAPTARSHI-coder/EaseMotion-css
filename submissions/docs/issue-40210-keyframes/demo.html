<!-- Create: submissions/docs/issue-40210-keyframes/demo.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Missing Keyframes Fix — Issue #40210</title>
  <link rel="stylesheet" href="../../easemotion.css">
  <style>
    body {
      margin: 0;
      padding: 2rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: system-ui, sans-serif;
      min-height: 100vh;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      color: white;
      text-align: center;
      margin-bottom: 3rem;
    }

    .demo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 2rem;
    }

    .demo-card {
      background: white;
      border-radius: 12px;
      padding: 2rem;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .demo-card h3 {
      margin: 0 0 1rem 0;
      color: #667eea;
      font-size: 1rem;
    }

    .animation-box {
      width: 80px;
      height: 80px;
      margin: 1rem auto;
      background: #667eea;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }

    .animation-box.heartbeat {
      animation: ease-kf-heartbeat 1.3s infinite;
    }

    .animation-box.rubber-band {
      animation: ease-kf-rubber-band 1s infinite;
    }

    .animation-box.spin {
      animation: ease-kf-spin 1.2s linear infinite;
    }

    .animation-box.wobble {
      animation: ease-kf-wobble 1s infinite;
    }

    .code {
      background: #f0f0f0;
      padding: 0.5rem;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.85rem;
      color: #333;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>✨ Missing Keyframes Fix — Issue #40210</h1>

    <div class="demo-grid">
      <!-- Heartbeat -->
      <div class="demo-card">
        <h3>Heartbeat 💓</h3>
        <div class="animation-box heartbeat">❤️</div>
        <div class="code">ease-kf-heartbeat</div>
      </div>

      <!-- Rubber Band -->
      <div class="demo-card">
        <h3>Rubber Band 🎯</h3>
        <div class="animation-box rubber-band">🎈</div>
        <div class="code">ease-kf-rubber-band</div>
      </div>

      <!-- Spin -->
      <div class="demo-card">
        <h3>Spin 🌀</h3>
        <div class="animation-box spin">⚡</div>
        <div class="code">ease-kf-spin</div>
      </div>

      <!-- Wobble -->
      <div class="demo-card">
        <h3>Wobble 🪩</h3>
        <div class="animation-box wobble">🎵</div>
        <div class="code">ease-kf-wobble</div>
      </div>
    </div>

    <div style="color: white; margin-top: 3rem; text-align: center;">
      <p>✅ All 4 keyframes are now properly defined and working!</p>
      <p>❌ Removed: flip-x, flip-y (niche 3D effects)</p>
    </div>
  </div>
</body>
</html>
