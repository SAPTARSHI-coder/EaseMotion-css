<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A11y: Sidebar Drawer Focus Trap &amp; Release</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button type="button" id="drawer-trigger" class="ease-trigger-btn" aria-haspopup="dialog" aria-expanded="false">Open Navigation</button>

  <div class="ease-drawer-backdrop" id="drawer-backdrop" role="presentation"></div>

  <aside class="ease-drawer" id="sidebar-drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" tabindex="-1">
    <div class="ease-drawer-header">
      <h2 id="drawer-title" class="ease-drawer-title">Navigation Menu</h2>
      <button type="button" class="ease-drawer-close" id="drawer-close" aria-label="Close navigation menu">✕</button>
    </div>

    <nav class="ease-drawer-nav" aria-label="Sidebar Navigation">
      <a href="#" class="ease-drawer-link">Dashboard</a>
      <a href="#" class="ease-drawer-link">Analytics</a>
      <a href="#" class="ease-drawer-link">Team Settings</a>
      <a href="#" class="ease-drawer-link">System Integration</a>
      <a href="#" class="ease-drawer-link">Billing &amp; Invoices</a>
    </nav>
  </aside>

  <script>
    const trigger = document.getElementById('drawer-trigger');
    const backdrop = document.getElementById('drawer-backdrop');
    const drawer = document.getElementById('sidebar-drawer');
    const closeBtn = document.getElementById('drawer-close');

    function openDrawer() {
      backdrop.classList.add('is-open');
      drawer.classList.add('is-open');
      trigger.setAttribute('aria-expanded', 'true');
      drawer.focus();
    }

    function closeDrawer() {
      backdrop.classList.remove('is-open');
      drawer.classList.remove('is-open');
      trigger.setAttribute('aria-expanded', 'false');
      trigger.blur();
      trigger.focus();
    }

    trigger.addEventListener('click', openDrawer);
    closeBtn.addEventListener('click', closeDrawer);
    backdrop.addEventListener('click', closeDrawer);

    // KEYBOARD FOCUS TRAP & ESCAPE
    document.addEventListener('keydown', (e) => {
      if (!drawer.classList.contains('is-open')) return;

      if (e.key === 'Escape') {
        closeDrawer();
        return;
      }

      if (e.key === 'Tab') {
        const focusable = drawer.querySelectorAll('button, a[href]');
        const first = focusable[0];
        const last = focusable[focusable.length - 1];

        if (e.shiftKey) {
          if (document.activeElement === first) {
            e.preventDefault();
            last.focus();
          }
        } else {
          if (document.activeElement === last) {
            e.preventDefault();
            first.focus();
          }
        }
      }
    });
  </script>
</body>
</html>
