<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matrix Rain Fall Code</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo">
    <p class="eyebrow">EaseMotion Core Animation</p>

    <h1>Matrix Rain Fall Code</h1>

    <p class="description">
      A cyber-inspired falling code animation that creates a continuous
      digital rain effect using compositor-friendly transforms and opacity.
    </p>

    <section class="matrix-stage" aria-label="Matrix rain animation">
      <div class="matrix-column column-1">
        <span class="matrix-code ease-anim-matrix-rain-fall-code">01<br>10<br>11<br>00<br>101</span>
      </div>

      <div class="matrix-column column-2">
        <span class="matrix-code ease-anim-matrix-rain-fall-code">A<br>7<br>F<br>0<br>1<br>C</span>
      </div>

      <div class="matrix-column column-3">
        <span class="matrix-code ease-anim-matrix-rain-fall-code">101<br>010<br>110<br>001</span>
      </div>

      <div class="matrix-column column-4">
        <span class="matrix-code ease-anim-matrix-rain-fall-code">X<br>Y<br>Z<br>9<br>8<br>7</span>
      </div>

      <div class="matrix-column column-5">
        <span class="matrix-code ease-anim-matrix-rain-fall-code">10<br>01<br>00<br>11<br>10</span>
      </div>

      <div class="matrix-column column-6">
        <span class="matrix-code ease-anim-matrix-rain-fall-code">C<br>0<br>D<br>E<br>5</span>
      </div>

      <div class="matrix-column column-7">
        <span class="matrix-code ease-anim-matrix-rain-fall-code">110<br>001<br>101<br>010</span>
      </div>

      <div class="matrix-column column-8">
        <span class="matrix-code ease-anim-matrix-rain-fall-code">M<br>A<br>T<br>R<br>I<br>X</span>
      </div>
    </section>

    <button
      type="button"
      onclick="
        document.querySelectorAll('.matrix-code').forEach((element) => {
          element.classList.remove('ease-anim-matrix-rain-fall-code');
          void element.offsetWidth;
          element.classList.add('ease-anim-matrix-rain-fall-code');
        });
      "
    >
      Replay Animation
    </button>
  </main>

</body>
</html>
