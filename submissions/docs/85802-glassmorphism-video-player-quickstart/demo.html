<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Glassmorphism video player quickstart demo.">
  <title>Glassmorphism Video Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="demo-shell">
    <header class="demo-header">
      <p class="eyebrow">EaseMotion CSS · #85802</p>
      <h1>Glassmorphism Video Player</h1>
      <p>A responsive media surface with native controls and a translucent visual treatment.</p>
    </header>
    <section class="glass-player" aria-labelledby="player-title">
      <div class="glass-player__intro">
        <p class="glass-player__label">Quickstart</p>
        <h2 id="player-title">Product preview</h2>
      </div>
      <div class="glass-player__frame">
        <video class="glass-player__media" controls preload="metadata" poster="https://dummyimage.com/1280x720/152033/ffffff&text=Glass+Player">
          <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
          <track kind="captions" srclang="en" label="English" src="captions.vtt">
          Your browser does not support HTML video.
        </video>
      </div>
      <p class="glass-player__note">Replace the sample source and caption track with project assets.</p>
    </section>
  </main>
</body>
</html>
