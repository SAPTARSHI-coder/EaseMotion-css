<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spiral Spin Rotate Twist - EaseMotion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="demo">
    <section class="demo-card">
      <span class="badge">EaseMotion Core</span>

      <div class="demo-orbit">
        <div class="spiral-object ease-anim-spiral-spin-rotate-twist">
          ✦
        </div>
      </div>

      <h1>Spiral Spin Rotate Twist</h1>

      <p>
        A smooth spiral entrance motion combining rotation, scaling,
        and a subtle vertical twist.
      </p>

      <button
        type="button"
        onclick="replayAnimation()"
      >
        Replay Animation
      </button>
    </section>
  </main>

  <script>
    function replayAnimation() {
      const element = document.querySelector(
        ".ease-anim-spiral-spin-rotate-twist"
      );

      element.classList.remove("ease-anim-spiral-spin-rotate-twist");

      void element.offsetWidth;

      element.classList.add("ease-anim-spiral-spin-rotate-twist");
    }
  </script>
</body>
</html>
