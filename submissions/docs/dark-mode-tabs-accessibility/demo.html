<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark Mode Tabs</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo">
    <h1>Dark Mode Tabs</h1>

    <div class="tabs" role="tablist" aria-label="Content sections">
      <button
        class="tabs__tab tabs__tab--active"
        id="tab-overview"
        role="tab"
        aria-selected="true"
        aria-controls="panel-overview"
        tabindex="0">
        Overview
      </button>

      <button
        class="tabs__tab"
        id="tab-features"
        role="tab"
        aria-selected="false"
        aria-controls="panel-features"
        tabindex="-1">
        Features
      </button>

      <button
        class="tabs__tab"
        id="tab-settings"
        role="tab"
        aria-selected="false"
        aria-controls="panel-settings"
        tabindex="-1">
        Settings
      </button>
    </div>

    <section
      class="tabs__panel"
      id="panel-overview"
      role="tabpanel"
      aria-labelledby="tab-overview">
      <h2>Overview</h2>
      <p>
        This is the overview section of the dark mode tabs component.
      </p>
    </section>

    <section
      class="tabs__panel"
      id="panel-features"
      role="tabpanel"
      aria-labelledby="tab-features"
      hidden>
      <h2>Features</h2>
      <p>
        Explore the features available in this component.
      </p>
    </section>

    <section
      class="tabs__panel"
      id="panel-settings"
      role="tabpanel"
      aria-labelledby="tab-settings"
      hidden>
      <h2>Settings</h2>
      <p>
        Configure the component according to your requirements.
      </p>
    </section>
  </main>

  <script>
    const tabs = document.querySelectorAll('[role="tab"]');
    const panels = document.querySelectorAll('[role="tabpanel"]');

    function activateTab(tab) {
      tabs.forEach((item) => {
        const active = item === tab;

        item.setAttribute("aria-selected", active);
        item.tabIndex = active ? 0 : -1;
        item.classList.toggle("tabs__tab--active", active);
      });

      panels.forEach((panel) => {
        panel.hidden = panel.id !== tab.getAttribute("aria-controls");
      });

      tab.focus();
    }

    tabs.forEach((tab, index) => {
      tab.addEventListener("click", () => {
        activateTab(tab);
      });

      tab.addEventListener("keydown", (event) => {
        let nextIndex = index;

        if (event.key === "ArrowRight") {
          nextIndex = (index + 1) % tabs.length;
        }

        if (event.key === "ArrowLeft") {
          nextIndex = (index - 1 + tabs.length) % tabs.length;
        }

        if (event.key === "Home") {
          nextIndex = 0;
        }

        if (event.key === "End") {
          nextIndex = tabs.length - 1;
        }

        if (
          ["ArrowRight", "ArrowLeft", "Home", "End"].includes(event.key)
        ) {
          event.preventDefault();
          activateTab(tabs[nextIndex]);
        }
      });
    });
  </script>

</body>
</html>
