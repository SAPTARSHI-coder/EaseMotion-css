<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="EaseMotion documentation demo for a neumorphic progress bar">
  <title>Neumorphic Progress Bar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <article class="card" aria-labelledby="title">
      <p class="eyebrow">EaseMotion Docs</p>
      <h1 id="title">Neumorphic Progress</h1>
      <p class="intro">A soft-shadow progress indicator that works with semantic HTML and CSS only.</p>

      <section class="progress-section" aria-label="Project progress">
        <div class="progress-heading">
          <span>Project completion</span>
          <strong>72%</strong>
        </div>
        <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="72" aria-label="Project completion: 72 percent">
          <span class="progress-fill"></span>
        </div>
        <p class="hint">The fill animates smoothly when the page loads.</p>
      </section>

      <div class="examples">
        <span>Pure CSS</span>
        <span>Responsive</span>
        <span>Accessible</span>
      </div>
    </article>
  </main>
</body>
</html>
