<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist User Testimonial Card - Responsive Layout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="ease-showcase-wrapper" aria-labelledby="guide-title">
    <header style="margin-bottom: 3rem; text-align: center;">
      <span style="background: var(--tm-text-primary); color: var(--tm-surface); padding: 4px 12px; border-radius: 9999px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;">Documentation</span>
      <h1 id="guide-title" style="font-size: 2.25rem; font-weight: 800; letter-spacing: -0.5px; margin: 1rem 0 0.5rem 0;">Minimalist Testimonial Cards</h1>
      <p style="color: var(--tm-text-secondary); font-size: 1rem; max-width: 600px; margin: 0 auto; line-height: 1.6;">
        A purely semantic, highly accessible <code>&lt;figure&gt;</code> and <code>&lt;blockquote&gt;</code> component built on a fluid responsive grid system.
      </p>
    </header>

    <section class="ease-testimonial-grid" aria-label="Customer Testimonials">
      
      <!-- Card 1 -->
      <figure class="ease-tm-card">
        <div class="ease-tm-rating" aria-label="Rated 5 out of 5 stars" title="5 out of 5 stars">
          <span aria-hidden="true">★</span><span aria-hidden="true">★</span><span aria-hidden="true">★</span><span aria-hidden="true">★</span><span aria-hidden="true">★</span>
        </div>
        <blockquote class="ease-tm-quote">
          "The minimalist design system allowed our engineering team to ship the beta three weeks ahead of schedule. The focus on pure semantics and accessibility is unparalleled."
        </blockquote>
        <figcaption class="ease-tm-author">
          <div class="ease-tm-avatar" role="img" aria-label="Avatar for Sarah Jenkins"></div>
          <div class="ease-tm-meta">
            <strong class="ease-tm-name">Sarah Jenkins</strong>
            <span class="ease-tm-role">VP of Engineering, CloudScale</span>
          </div>
        </figcaption>
      </figure>

      <!-- Card 2 -->
      <figure class="ease-tm-card">
        <div class="ease-tm-rating" aria-label="Rated 5 out of 5 stars" title="5 out of 5 stars">
          <span aria-hidden="true">★</span><span aria-hidden="true">★</span><span aria-hidden="true">★</span><span aria-hidden="true">★</span><span aria-hidden="true">★</span>
        </div>
        <blockquote class="ease-tm-quote">
          "By removing heavy shadows and arbitrary structural wrappers, our page payload dropped significantly. Beautiful, stark, and perfectly responsive out of the box."
        </blockquote>
        <figcaption class="ease-tm-author">
          <div class="ease-tm-avatar" role="img" aria-label="Avatar for Marcus Chen"></div>
          <div class="ease-tm-meta">
            <strong class="ease-tm-name">Marcus Chen</strong>
            <span class="ease-tm-role">Lead Designer, Studio Null</span>
          </div>
        </figcaption>
      </figure>

      <!-- Card 3 -->
      <figure class="ease-tm-card">
        <div class="ease-tm-rating" aria-label="Rated 4 out of 5 stars" title="4 out of 5 stars">
          <span aria-hidden="true">★</span><span aria-hidden="true">★</span><span aria-hidden="true">★</span><span aria-hidden="true">★</span><span aria-hidden="true" style="color: #e4e4e7;">★</span>
        </div>
        <blockquote class="ease-tm-quote">
          "I was skeptical about migrating away from our bloated component library, but the WAI-ARIA compliance and semantic HTML 5 tags sold me immediately."
        </blockquote>
        <figcaption class="ease-tm-author">
          <div class="ease-tm-avatar" role="img" aria-label="Avatar for Elena Rostova"></div>
          <div class="ease-tm-meta">
            <strong class="ease-tm-name">Elena Rostova</strong>
            <span class="ease-tm-role">Accessibility Advocate</span>
          </div>
        </figcaption>
      </figure>

    </section>
  </main>
</body>
</html>
