<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Pagination</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <h1>Interactive Pagination</h1>
    <p class="description">
      A clean and responsive pagination component with interactive states.
    </p>

    <nav class="pagination" aria-label="Pagination">
      <button class="page-btn" aria-label="Previous page">&laquo;</button>

      <button class="page-btn active">1</button>
      <button class="page-btn">2</button>
      <button class="page-btn">3</button>
      <button class="page-btn">4</button>
      <button class="page-btn">5</button>

      <button class="page-btn" aria-label="Next page">&raquo;</button>
    </nav>
  </main>

</body>
</html>
