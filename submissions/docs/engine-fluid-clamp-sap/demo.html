<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Engine Fluid Clamp Typography — EaseMotion CSS</title>
  <link rel="stylesheet" href="../../../easemotion.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="ease-center">
  <div class="fluid-demo-card ease-card" em="fade-in duration-medium">
    <h1 class="fluid-heading" em="fluid-text(1.2rem, 3.5vw, 3rem) slide-up">
      Fluid Responsive Title
    </h1>
    <p class="fluid-text">
      Automatically scales font-size fluidly across viewports directly via <code>em="fluid-text(...)"</code> attributes.
    </p>
  </div>
  <script type="module" src="../../../easemotion/index.js"></script>
</body>
</html>
