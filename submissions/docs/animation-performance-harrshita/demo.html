<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Animation Performance | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="docs-wrapper">
    <h1>Animation Performance Guide</h1>
    <p>Learn how to create silky smooth 60fps animations.</p>

    <section class="docs-section">
      <h2>The Golden Rule</h2>
      <p>Only animate <strong>transform</strong> and <strong>opacity</strong>.</p>

      <div class="card good-card">
        <h3>✅ Good Performance</h3>
        <code>transform: translateX(100px);</code>
      </div>

      <div class="card bad-card">
        <h3>❌ Bad Performance</h3>
        <code>margin-left: 100px;</code>
      </div>
    </section>
  </main>

  <div class="pad"></div><div class="pad"></div>
  <div class="pad"></div><div class="pad"></div>
  <div class="pad"></div><div class="pad"></div>
</body>
</html>
