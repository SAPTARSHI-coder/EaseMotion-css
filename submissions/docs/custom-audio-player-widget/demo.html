<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentation: Custom Audio Player Widget - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-demo-container">
        <!-- Pure CSS Custom Audio Player Widget Responsive Layout Documentation Showcase -->
        <header class="em-audio-doc-card" role="region" aria-label="Custom Audio Player Widget Documentation Showcase" tabindex="0">
            <div class="em-audio-header-bar">
                <span class="em-card-badge">COMPONENT DOCS</span>
                <span class="em-brand-logo">AudioMotion</span>
            </div>
            <h1 class="em-card-title">Custom Audio Player Widget</h1>
            <p class="em-card-desc">Complete responsive breakpoints layout guide, markup examples, and live demo for the EaseMotion Custom Audio Player Widget component.</p>
            <div class="em-audio-wrapper">
                <div class="ease-custom-audio-player" aria-label="Custom Audio Player Widget Element" tabindex="0">
                    <button class="em-audio-play-btn" aria-label="Play or Pause Audio">▶</button>
                    <div class="em-audio-info">
                        <span class="em-audio-title">Ambient Synths // Track 01</span>
                        <div class="em-audio-progress-bar" role="slider" aria-label="Audio Playback Progress" aria-valuenow="35" aria-valuemin="0" aria-valuemax="100" tabindex="0">
                            <div class="em-audio-progress-fill" style="width: 35%;"></div>
                        </div>
                    </div>
                    <span class="em-audio-time">01:45</span>
                </div>
            </div>
        </header>
    </div>
</body>
</html>
