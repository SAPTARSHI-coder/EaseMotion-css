<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glowing Badge — Showcase & Usage</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="ease-container">
    <p class="ease-eyebrow">UI Showcase</p>
    <h1 class="ease-heading">Glowing Badge</h1>
    <p class="ease-subtitle">Pure CSS status badge featuring ambient neon glow, subtle pulse animations, and custom color variants.</p>

    <div class="ease-card" role="region" aria-label="Glowing badge showcase card">
      <div class="ease-badge-group">
        <!-- Live Badge -->
        <span class="ease-badge ease-badge-success" role="status">
          <span class="ease-badge-dot" aria-hidden="true"></span>
          <span class="ease-badge-text">SYSTEM ONLINE</span>
        </span>

        <!-- Warning Badge -->
        <span class="ease-badge ease-badge-warning" role="status">
          <span class="ease-badge-dot" aria-hidden="true"></span>
          <span class="ease-badge-text">HIGH CPU LOAD</span>
        </span>

        <!-- Alert Badge -->
        <span class="ease-badge ease-badge-danger" role="status">
          <span class="ease-badge-dot" aria-hidden="true"></span>
          <span class="ease-badge-text">CRITICAL BREACH</span>
        </span>
      </div>
    </div>
  </main>
</body>
</html>
