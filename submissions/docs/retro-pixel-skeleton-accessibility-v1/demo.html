<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Pixel Skeleton</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo">
    <h1>Retro Pixel Skeleton</h1>

    <section
      class="retro-skeleton"
      aria-label="Loading content"
      aria-busy="true"
    >
      <div class="retro-skeleton__avatar" aria-hidden="true"></div>

      <div class="retro-skeleton__content">
        <div class="retro-skeleton__line retro-skeleton__line--title"
             aria-hidden="true"></div>

        <div class="retro-skeleton__line"
             aria-hidden="true"></div>

        <div class="retro-skeleton__line retro-skeleton__line--short"
             aria-hidden="true"></div>
      </div>
    </section>

    <p class="sr-only" role="status">
      Content is loading. Please wait.
    </p>
  </main>

</body>
</html>
