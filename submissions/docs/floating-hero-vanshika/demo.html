<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Floating Hero Section</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <section class="floating-hero">
    <div class="hero-content">
      <span class="hero-badge">EaseMotion CSS</span>

      <h1>
        Build Beautiful
        <span>Experiences</span>
      </h1>

      <p>
        Create modern and engaging interfaces with a floating hero section
        enhanced by smooth CSS animations.
      </p>

      <div class="hero-actions">
        <a href="#" class="hero-button">Get Started</a>
        <a href="#" class="hero-link">Learn More →</a>
      </div>
    </div>

    <div class="floating-card card-one">
      <strong>+42%</strong>
      <span>Growth</span>
    </div>

    <div class="floating-card card-two">
      <span>✨</span>
      <strong>Creative</strong>
    </div>

    <div class="floating-card card-three">
      <span>⚡</span>
      <strong>Fast & Smooth</strong>
    </div>
  </section>

</body>
</html>
