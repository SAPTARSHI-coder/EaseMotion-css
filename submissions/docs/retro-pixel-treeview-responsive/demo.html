<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Pixel Treeview (Responsive) Demo</title>
    <link rel="stylesheet" href="style.css">
    <!-- Load a pixel-art font from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <main>
        <!-- The responsive modifier class is applied to the root container -->
        <div class="pixel-treeview pixel-treeview--responsive">
            <h2 class="tree-title">INVENTORY</h2>
            
            <ul class="tree-list" role="tree">
                
                <!-- Expanded by default using the 'open' attribute -->
                <li role="treeitem" aria-expanded="true">
                    <details open>
                        <summary class="tree-node">
                            <span class="icon folder-icon"></span>
                            WEAPONS
                        </summary>
                        <ul role="group">
                            <li role="treeitem">
                                <a href="#" class="tree-node tree-leaf">
                                    <span class="icon file-icon"></span>
                                    SWORD_LV1
                                </a>
                            </li>
                            <li role="treeitem">
                                <a href="#" class="tree-node tree-leaf">
                                    <span class="icon file-icon"></span>
                                    BOW_LV3
                                </a>
                            </li>
                        </ul>
                    </details>
                </li>

                <!-- Collapsed by default -->
                <li role="treeitem" aria-expanded="false">
                    <details>
                        <summary class="tree-node">
                            <span class="icon folder-icon"></span>
                            POTIONS
                        </summary>
                        <ul role="group">
                            <li role="treeitem">
                                <a href="#" class="tree-node tree-leaf">
                                    <span class="icon file-icon"></span>
                                    HEALTH_POT
                                </a>
                            </li>
                            <li role="treeitem">
                                <a href="#" class="tree-node tree-leaf">
                                    <span class="icon file-icon"></span>
                                    MANA_POT
                                </a>
                            </li>
                        </ul>
                    </details>
                </li>

            </ul>
        </div>
    </main>
</body>
</html>
