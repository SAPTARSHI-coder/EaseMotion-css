<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentation: Claymorphism Dropdown Split Button - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-demo-container">
        <!-- Pure CSS Claymorphism Dropdown Split Button Documentation Showcase -->
        <header class="em-clay-doc-card" role="region" aria-label="Claymorphism Dropdown Split Button Documentation Showcase" tabindex="0">
            <div class="em-clay-header-bar">
                <span class="em-card-badge">COMPONENT DOCS</span>
                <span class="em-brand-logo">ClayMotion</span>
            </div>
            <h1 class="em-card-title">Claymorphism Dropdown Split Button</h1>
            <p class="em-card-desc">Complete integration guide, theming configuration, and live demo for the EaseMotion Claymorphism Dropdown Split Button component.</p>
            <div class="em-clay-wrapper">
                <div class="ease-clay-split-dropdown" aria-label="Claymorphism Split Dropdown Element" tabindex="0">
                    <button class="em-clay-main-btn" aria-label="Main Action Button">Action</button>
                    <button class="em-clay-toggle-btn" aria-expanded="false" aria-haspopup="true" aria-label="Toggle Dropdown Menu">
                        <span class="em-arrow">▼</span>
                    </button>
                    <div class="em-clay-menu" role="menu">
                        <a href="#" class="em-clay-item" role="menuitem">Theme Options</a>
                        <a href="#" class="em-clay-item" role="menuitem">Custom Overrides</a>
                        <a href="#" class="em-clay-item" role="menuitem">Accessibility Setup</a>
                    </div>
                </div>
            </div>
        </header>
    </div>
</body>
</html>
