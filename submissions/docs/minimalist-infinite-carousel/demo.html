<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Infinite Carousel Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="carousel-section" aria-labelledby="carousel-title">
        <h2 id="carousel-title" class="sr-only">Our Partners</h2>
        
        <!-- Accessibility toggle for motion sensitivity -->
        <button id="motion-toggle" class="motion-toggle-btn" aria-pressed="false">Pause Animation</button>
        
        <div class="infinite-carousel" role="region" aria-roledescription="carousel" aria-label="Partner Logos">
            <div class="carousel-track">
                <!-- Set 1 -->
                <div class="carousel-item" role="group" aria-roledescription="slide" aria-label="1 of 6">
                    <div class="card">Brand A</div>
                </div>
                <div class="carousel-item" role="group" aria-roledescription="slide" aria-label="2 of 6">
                    <div class="card">Brand B</div>
                </div>
                <div class="carousel-item" role="group" aria-roledescription="slide" aria-label="3 of 6">
                    <div class="card">Brand C</div>
                </div>
                <!-- Set 2 (Duplicated for seamless infinite loop) -->
                <div class="carousel-item" aria-hidden="true">
                    <div class="card">Brand A</div>
                </div>
                <div class="carousel-item" aria-hidden="true">
                    <div class="card">Brand B</div>
                </div>
                <div class="carousel-item" aria-hidden="true">
                    <div class="card">Brand C</div>
                </div>
            </div>
        </div>
    </section>

    <script>
        const btn = document.getElementById('motion-toggle');
        const track = document.querySelector('.carousel-track');
        btn.addEventListener('click', () => {
            const isPaused = btn.getAttribute('aria-pressed') === 'true';
            btn.setAttribute('aria-pressed', !isPaused);
            btn.textContent = isPaused ? 'Pause Animation' : 'Play Animation';
            track.style.animationPlayState = isPaused ? 'running' : 'paused';
        });
    </script>
</body>
</html>
