<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Kinetic Wave Motion</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="demo">
    <p class="eyebrow">EaseMotion Core Preset</p>

    <h1 class="kinetic-text" aria-label="Kinetic Wave">
      <span class="ease-anim-text-kinetic-wave-motion" style="--wave-index: 0">K</span>
      <span class="ease-anim-text-kinetic-wave-motion" style="--wave-index: 1">i</span>
      <span class="ease-anim-text-kinetic-wave-motion" style="--wave-index: 2">n</span>
      <span class="ease-anim-text-kinetic-wave-motion" style="--wave-index: 3">e</span>
      <span class="ease-anim-text-kinetic-wave-motion" style="--wave-index: 4">t</span>
      <span class="ease-anim-text-kinetic-wave-motion" style="--wave-index: 5">i</span>
      <span class="ease-anim-text-kinetic-wave-motion" style="--wave-index: 6">c</span>
      <span>&nbsp;</span>
      <span class="ease-anim-text-kinetic-wave-motion" style="--wave-index: 7">W</span>
      <span class="ease-anim-text-kinetic-wave-motion" style="--wave-index: 8">a</span>
      <span class="ease-anim-text-kinetic-wave-motion" style="--wave-index: 9">v</span>
      <span class="ease-anim-text-kinetic-wave-motion" style="--wave-index: 10">e</span>
    </h1>

    <p class="description">
      A smooth character-by-character kinetic wave animation.
    </p>
  </main>
</body>
</html>
