<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Basic dynamic cookie banner demonstration.">
  <title>Dynamic Cookie Banner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="page__header">
      <p class="eyebrow">EaseMotion CSS · #81567</p>
      <h1>Dynamic Cookie Banner</h1>
      <p>A simple consent surface with clear actions and responsive layout.</p>
    </header>

    <section class="cookie-banner" aria-labelledby="cookie-title">
      <div class="cookie-banner__content">
        <p class="cookie-banner__eyebrow">Privacy</p>
        <h2 id="cookie-title">Cookie preferences</h2>
        <p>We use cookies to improve the experience and understand site usage. Choose whether to accept optional cookies.</p>
      </div>
      <div class="cookie-banner__actions">
        <button class="cookie-banner__button cookie-banner__button--secondary" type="button">Decline</button>
        <button class="cookie-banner__button cookie-banner__button--primary" type="button">Accept</button>
      </div>
    </section>
  </main>
</body>
</html>
