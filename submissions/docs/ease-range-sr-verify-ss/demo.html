<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A11y: Dual Range Slider SR Verification</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="ease-dual-slider-widget" id="price-filter-widget" role="group" aria-labelledby="filter-title">
    <div class="ease-slider-header">
      <h2 id="filter-title" class="ease-slider-title">Price Range</h2>
      <div class="ease-slider-values" aria-hidden="true" id="visible-range">
        $10 - $90
      </div>
    </div>
    
    <div class="ease-track-container">
      <div class="ease-track-bg"></div>
      <div class="ease-track-fill" id="track-fill" style="left: 10%; right: 10%;"></div>
      
      <input 
        type="range" 
        id="min-price" 
        class="ease-sr-range" 
        min="0" 
        max="100" 
        value="10" 
        step="1" 
        aria-label="Minimum price"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="10"
        aria-valuetext="$10 minimum"
      >
      
      <input 
        type="range" 
        id="max-price" 
        class="ease-sr-range" 
        min="0" 
        max="100" 
        value="90" 
        step="1" 
        aria-label="Maximum price"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="90"
        aria-valuetext="$90 maximum"
      >
    </div>
  </main>

  <script>
    const minSlider = document.getElementById('min-price');
    const maxSlider = document.getElementById('max-price');
    const trackFill = document.getElementById('track-fill');
    const visibleRange = document.getElementById('visible-range');
    const widget = document.getElementById('price-filter-widget');

    const minGap = 5;

    function updateUI() {
      let minVal = parseInt(minSlider.value);
      let maxVal = parseInt(maxSlider.value);

      // Cross-over prevention
      if (maxVal - minVal < minGap) {
        if (document.activeElement === minSlider) {
          minSlider.value = maxVal - minGap;
          minVal = parseInt(minSlider.value);
        } else {
          maxSlider.value = minVal + minGap;
          maxVal = parseInt(maxSlider.value);
        }
      }

      // Update visual track
      const percent1 = (minVal / minSlider.max) * 100;
      const percent2 = (maxVal / maxSlider.max) * 100;
      trackFill.style.left = percent1 + '%';
      trackFill.style.right = (100 - percent2) + '%';

      // Update visible text
      visibleRange.textContent = '$' + minVal + ' - $' + maxVal;

      // Update Screen Reader Attributes (Screen Reader Verification)
      minSlider.setAttribute('aria-valuenow', minVal);
      minSlider.setAttribute('aria-valuetext', '$' + minVal + ' minimum');
      
      maxSlider.setAttribute('aria-valuenow', maxVal);
      maxSlider.setAttribute('aria-valuetext', '$' + maxVal + ' maximum');
    }

    minSlider.addEventListener('input', updateUI);
    maxSlider.addEventListener('input', updateUI);

    // KEYBOARD FOCUS TRAP
    // Locks keyboard users into the dual slider widget until explicitly bypassed
    minSlider.addEventListener('keydown', (e) => {
      if (e.key === 'Tab' && e.shiftKey) {
        e.preventDefault();
        maxSlider.focus();
      }
    });

    maxSlider.addEventListener('keydown', (e) => {
      if (e.key === 'Tab' && !e.shiftKey) {
        e.preventDefault();
        minSlider.focus();
      }
    });
  </script>
</body>
</html>
