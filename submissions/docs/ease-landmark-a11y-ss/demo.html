<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A11y: Landmark Roles & Nav Focus Trap</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 1. Skip Link -->
  <a href="#main-content" class="ease-skip-link">Skip to main content</a>

  <!-- 2. Header Landmark -->
  <header role="banner" class="ease-header">
    <strong style="font-size: 1.25rem;">EaseMotion</strong>
    
    <!-- Navigation Landmark -->
    <nav role="navigation" aria-label="Main Navigation">
      <button type="button" class="ease-nav-btn" id="menu-open" aria-expanded="false" aria-controls="mobile-menu">Menu</button>
      
      <!-- Dialog Focus Trap -->
      <div id="mobile-menu" role="dialog" aria-modal="true" aria-label="Mobile Navigation" class="ease-menu-modal">
        <button type="button" class="ease-nav-btn" id="menu-close" style="align-self: flex-end; background: transparent; color: var(--lm-text); border: 1px solid var(--lm-border);">Close</button>
        <a href="#" class="ease-menu-link">Home</a>
        <a href="#" class="ease-menu-link">Accessibility</a>
        <a href="#" class="ease-menu-link">Components</a>
      </div>
    </nav>
  </header>

  <!-- 3. Main Landmark -->
  <main role="main" id="main-content" class="ease-main" tabindex="-1">
    <h1>Landmark & Focus Trap Audit</h1>
    <p>This page demonstrates strict W3C HTML5 landmark roles combined with a secure keyboard focus trap inside the navigation modal.</p>
    <button type="button" class="ease-nav-btn" style="background: var(--lm-muted);">Dummy Button (Should be unreachable when menu is open)</button>
  </main>

  <!-- 4. Footer Landmark -->
  <footer role="contentinfo" class="ease-footer">
    <p>&copy; 2026 EaseMotion Accessibility. Verified via Axe-Core.</p>
  </footer>

  <script>
    const openBtn = document.getElementById('menu-open');
    const closeBtn = document.getElementById('menu-close');
    const modal = document.getElementById('mobile-menu');
    const mainContent = document.getElementById('main-content');
    const skipLink = document.querySelector('.ease-skip-link');

    // Skip Link Logic (Ensure focus physically moves to main)
    skipLink.addEventListener('click', (e) => {
      e.preventDefault();
      mainContent.focus();
    });

    // Modal Toggle Logic
    function openModal() {
      modal.classList.add('is-open');
      openBtn.setAttribute('aria-expanded', 'true');
      closeBtn.focus(); // Set initial focus
    }

    function closeModal() {
      modal.classList.remove('is-open');
      openBtn.setAttribute('aria-expanded', 'false');
      openBtn.focus(); // Return focus to trigger
    }

    openBtn.addEventListener('click', openModal);
    closeBtn.addEventListener('click', closeModal);

    // KEYBOARD FOCUS TRAP LOGIC
    modal.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeModal();
        return;
      }
      if (e.key !== 'Tab') return;

      const focusableElements = modal.querySelectorAll('button, a[href]');
      const firstElement = focusableElements[0];
      const lastElement = focusableElements[focusableElements.length - 1];

      if (e.shiftKey) {
        if (document.activeElement === firstElement) {
          e.preventDefault();
          lastElement.focus();
        }
      } else {
        if (document.activeElement === lastElement) {
          e.preventDefault();
          firstElement.focus();
        }
      }
    });
  </script>
</body>
</html>
