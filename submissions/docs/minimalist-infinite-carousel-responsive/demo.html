<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Infinite Carousel (Responsive) Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section class="carousel-section" aria-labelledby="carousel-title">
            <h2 id="carousel-title">Our Partners</h2>
            <p>Resize the browser to see the carousel adjust its item width, gap, and speed across mobile, tablet, and desktop breakpoints.</p>
            
            <div class="carousel-controls">
                <button id="motion-toggle" class="motion-toggle-btn" aria-pressed="false">Pause Animation</button>
            </div>
            
            <!-- Applied responsive modifier class -->
            <div class="infinite-carousel infinite-carousel--responsive" role="region" aria-roledescription="carousel" aria-label="Partner Logos">
                <div class="carousel-track">
                    <!-- Original Items -->
                    <div class="carousel-item" role="group" aria-roledescription="slide" aria-label="1 of 4">
                        <div class="card">Brand 1</div>
                    </div>
                    <div class="carousel-item" role="group" aria-roledescription="slide" aria-label="2 of 4">
                        <div class="card">Brand 2</div>
                    </div>
                    <div class="carousel-item" role="group" aria-roledescription="slide" aria-label="3 of 4">
                        <div class="card">Brand 3</div>
                    </div>
                    <div class="carousel-item" role="group" aria-roledescription="slide" aria-label="4 of 4">
                        <div class="card">Brand 4</div>
                    </div>
                    
                    <!-- Duplicated Items -->
                    <div class="carousel-item" aria-hidden="true">
                        <div class="card">Brand 1</div>
                    </div>
                    <div class="carousel-item" aria-hidden="true">
                        <div class="card">Brand 2</div>
                    </div>
                    <div class="carousel-item" aria-hidden="true">
                        <div class="card">Brand 3</div>
                    </div>
                    <div class="carousel-item" aria-hidden="true">
                        <div class="card">Brand 4</div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        const btn = document.getElementById('motion-toggle');
        const track = document.querySelector('.carousel-track');
        btn.addEventListener('click', () => {
            const isPaused = btn.getAttribute('aria-pressed') === 'true';
            btn.setAttribute('aria-pressed', !isPaused);
            btn.textContent = isPaused ? 'Pause Animation' : 'Play Animation';
            track.style.animationPlayState = isPaused ? 'running' : 'paused';
        });
    </script>
</body>
</html>
