<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EaseMotion CSS - Playwright Visual Regression Testing Harness</title>
  <link rel="stylesheet" href="../../style.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="vrt-header">
    <h1>EaseMotion VRT Test Suite</h1>
    <p>Visual Regression Test Harness for core keyframe animations and utility classes</p>
  </header>

  <main class="vrt-grid" id="vrt-container">
    <div class="vrt-card">
      <div class="vrt-box ease-fade-in" id="test-fade-in">Fade</div>
      <div class="vrt-label">.ease-fade-in</div>
    </div>

    <div class="vrt-card">
      <div class="vrt-box ease-bounce-in" id="test-bounce-in">Bounce</div>
      <div class="vrt-label">.ease-bounce-in</div>
    </div>

    <div class="vrt-card">
      <div class="vrt-box ease-zoom-in" id="test-zoom-in">Zoom</div>
      <div class="vrt-label">.ease-zoom-in</div>
    </div>

    <div class="vrt-card">
      <div class="vrt-box ease-float" id="test-float">Float</div>
      <div class="vrt-label">.ease-float</div>
    </div>

    <div class="vrt-card">
      <div class="vrt-box ease-pulse-border-emphasis" id="test-pulse-border">Pulse</div>
      <div class="vrt-label">.ease-pulse-border-emphasis</div>
    </div>

    <div class="vrt-card">
      <div class="vrt-box ease-gradient-rotation" id="test-gradient">Gradient</div>
      <div class="vrt-label">.ease-gradient-rotation</div>
    </div>
  </main>
</body>
</html>
