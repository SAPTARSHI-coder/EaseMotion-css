<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Carousel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="carousel-container">
    <h1>Responsive Carousel</h1>
    <p class="subtitle">
      A simple and responsive carousel built with HTML and CSS.
    </p>

    <div class="carousel">
      <div class="carousel-track">

        <article class="carousel-card">
          <img
            src="https://images.unsplash.com/photo-1500534623283-312aade485b7"
            alt="Mountain landscape"
          >
          <div class="card-content">
            <h2>Mountain</h2>
            <p>Explore beautiful mountain landscapes.</p>
          </div>
        </article>

        <article class="carousel-card">
          <img
            src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e"
            alt="Beach landscape"
          >
          <div class="card-content">
            <h2>Beach</h2>
            <p>Enjoy peaceful moments near the ocean.</p>
          </div>
        </article>

        <article class="carousel-card">
          <img
            src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e"
            alt="Nature landscape"
          >
          <div class="card-content">
            <h2>Nature</h2>
            <p>Discover the beauty of nature.</p>
          </div>
        </article>

        <article class="carousel-card">
          <img
            src="https://images.unsplash.com/photo-1469474968028-56623f02e42e"
            alt="Forest landscape"
          >
          <div class="card-content">
            <h2>Forest</h2>
            <p>Relax in the calmness of the forest.</p>
          </div>
        </article>

      </div>
    </div>
  </main>

</body>
</html>
