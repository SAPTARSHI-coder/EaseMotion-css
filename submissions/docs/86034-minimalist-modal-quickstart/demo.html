<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minimalist Modal — Quickstart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="page__header">
      <p class="eyebrow">EaseMotion CSS · #86034</p>
      <h1>Minimalist Modal Quickstart</h1>
      <p>A ready-to-copy semantic modal structure with a clean presentation and native controls.</p>
    </header>
    <section class="modal" role="dialog" aria-labelledby="title" aria-describedby="copy">
      <div class="modal__header">
        <h2 id="title">Welcome back</h2>
        <button class="close" type="button" aria-label="Close">×</button>
      </div>
      <p id="copy">Use this compact pattern as a starting point for dialogs, confirmations, and short forms.</p>
      <div class="actions">
        <button class="button button--secondary" type="button">Cancel</button>
        <button class="button button--primary" type="button">Continue</button>
      </div>
    </section>
  </main>
</body>
</html>
