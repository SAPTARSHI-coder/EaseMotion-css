<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive 3D Book Cover</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="demo-shell">
        <div class="book" role="img" aria-label="Interactive 3D book cover hover animation">
            <div class="cover">
                <div class="cover-content">
                    <span class="tag">GSSoC 2026</span>
                    <h1>CSS Mastery</h1>
                    <p>by Bhavesh Borse</p>
                </div>
            </div>

            <div class="pages">
                <div class="page-content">
                    <h2>Chapter 1</h2>
                    <p>Welcome to CSS Mastery! This interactive book demonstrates a 3D hover animation built with pure HTML and CSS.</p>
                    <p>Hover over the cover to reveal the pages inside.</p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
