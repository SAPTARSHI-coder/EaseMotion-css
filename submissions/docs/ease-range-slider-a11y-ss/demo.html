<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A11y: Range Slider Touch Screen Reader Feedback</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="ease-slider-card">
    <div class="ease-slider-header">
      <label for="donation-amount" class="ease-slider-label">Donation Amount</label>
      <output for="donation-amount" id="donation-output" class="ease-slider-output" aria-live="polite">$50</output>
    </div>
    
    <input 
      type="range" 
      id="donation-amount" 
      class="ease-range-input" 
      min="10" 
      max="100" 
      step="5" 
      value="50" 
      aria-valuemin="10" 
      aria-valuemax="100" 
      aria-valuenow="50" 
      aria-valuetext="$50"
    >
    
    <div style="display: flex; justify-content: space-between; margin-top: 0.75rem; font-size: 0.75rem; color: #94a3b8;" aria-hidden="true">
      <span>$10</span>
      <span>$100</span>
    </div>
  </main>

  <script>
    const slider = document.getElementById('donation-amount');
    const output = document.getElementById('donation-output');

    // Update visual output and ARIA attributes for screen reader feedback
    function updateSliderFeedback(value) {
      const formattedValue = '$' + value;
      
      // Update the visible output
      output.textContent = formattedValue;
      
      // Update strictly required ARIA states for VoiceOver/TalkBack
      slider.setAttribute('aria-valuenow', value);
      slider.setAttribute('aria-valuetext', formattedValue);
      
      // Dynamic track fill calculation using CSS gradient
      const percent = ((value - slider.min) / (slider.max - slider.min)) * 100;
      slider.style.background = `linear-gradient(to right, var(--slider-track-fill) ${percent}%, var(--slider-track) ${percent}%)`;
    }

    slider.addEventListener('input', (e) => {
      updateSliderFeedback(e.target.value);
    });

    // Initialize track fill on load
    updateSliderFeedback(slider.value);
  </script>
</body>
</html>
