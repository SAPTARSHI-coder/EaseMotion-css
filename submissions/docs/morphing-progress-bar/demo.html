<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morphing Progress Bar Demo - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="em-demo-container">
        <!-- Pure CSS Morphing Progress Bar Component Showcase -->
        <div class="em-progress-card" role="region" aria-label="Morphing Progress Bar Showcase" tabindex="0">
            <span class="em-card-badge">DOCUMENTATION</span>
            <h1 class="em-card-title">Morphing Progress Bar</h1>
            <p class="em-card-desc">A responsive, pure CSS progress component featuring smooth loading animations and frosted glassmorphism card styling.</p>
            <div class="em-progress-track">
                <div class="em-progress-fill" role="progressbar" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100"></div>
            </div>
        </div>
    </div>
</body>
</html>
