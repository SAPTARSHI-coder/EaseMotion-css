<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EaseMotion Dropdown Click Outside Test</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Reference Implementation for Vitest Target -->
  <div class="ease-dropdown-wrapper" id="dropdown-target">
    <button class="ease-dropdown-trigger" id="dropdown-trigger" aria-expanded="false">Actions</button>
    <div class="ease-dropdown-menu" id="dropdown-menu" role="menu">
      <a href="#" style="display:block; padding:0.5rem; color:#cbd5e1; text-decoration:none;">Edit</a>
      <a href="#" style="display:block; padding:0.5rem; color:#ef4444; text-decoration:none;">Delete</a>
    </div>
  </div>
  <div id="outside-target" style="margin-top: 5rem; padding: 2rem; border: 1px dashed #475569; color: #94a3b8; text-align: center;">Clicking here should close the dropdown</div>

  <script>
    const wrapper = document.getElementById('dropdown-target');
    const trigger = document.getElementById('dropdown-trigger');
    const menu = document.getElementById('dropdown-menu');

    trigger.addEventListener('click', (e) => {
      e.stopPropagation();
      const isOpen = wrapper.classList.toggle('is-open');
      trigger.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });

    document.addEventListener('click', (e) => {
      if (!wrapper.contains(e.target)) {
        wrapper.classList.remove('is-open');
        trigger.setAttribute('aria-expanded', 'false');
      }
    });
  </script>
</body>
</html>
