name: size-limit

on:
  pull_request:

jobs:
  size-limit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci
      - uses: andresz1/size-limit-action@v1.9.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          skip_step: install
