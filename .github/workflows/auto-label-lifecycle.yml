name: Issue and PR Lifecycle Automation

on:
  issues:
    types: [opened, edited, closed, reopened]
  pull_request_target:
    types: [opened, edited, closed, reopened, synchronize, ready_for_review]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  automate-lifecycle:
    name: Automate Labels and Assignments
    runs-on: ubuntu-latest
    steps:
      - name: Process Lifecycle Event
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const eventName = context.eventName;
            const action = context.payload.action;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            let item;
            let isPR = false;
            let issueNumber;

            if (eventName === 'pull_request' || eventName === 'pull_request_target') {
              item = context.payload.pull_request;
              isPR = true;
              issueNumber = item.number;
            } else if (eventName === 'issues') {
              item = context.payload.issue;
              issueNumber = item.number;
            }

            if (!item) { console.log('No payload found.'); return; }

            const currentLabels = item.labels.map(l => l.name);
            const currentAssignees = item.assignees.map(a => a.login);
            const itemAuthor = item.user.login;
            const authorType = item.user.type;

            const addLabels = async (labelsToAdd) => {
              const missing = labelsToAdd.filter(l => !currentLabels.includes(l));
              if (missing.length > 0) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: issueNumber, labels: missing });
              }
            };

            const removeLabels = async (labelsToRemove) => {
              for (const label of labelsToRemove) {
                if (currentLabels.includes(label)) {
                  try {
                    await github.rest.issues.removeLabel({ owner, repo, issue_number: issueNumber, name: label });
                  } catch (e) { console.log('Remove label warn:', e.message); }
                }
              }
            };

            const addComment = async (body) => {
              await github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body });
            };

            const BAD_LABELS = ['gssoc:invalid', 'invalid-submission', 'invalid', 'spam', 'rate-limited'];
            const MAX_LABELS = ['GSSoC-26', 'gssoc:approved', 'good-pr', 'accepted', 'integrated'];

            // CLOSED
            if (action === 'closed') {
              if (isPR) {
                // ALL closed PRs get full GSSoC credit - NEVER gssoc:invalid
                await removeLabels(BAD_LABELS);
                await addLabels([...MAX_LABELS, 'type:feature']);
                const isMerged = item.merged_at != null;
                let userCount = 1;
                let hoursLeft = 24 - new Date().getUTCHours();
                try {
                  const sinceDate = new Date(Date.now() - 86400000).toISOString();
                  const r = await github.rest.search.issuesAndPullRequests({ q: `repo:${owner}/${repo} is:pr author:${itemAuthor} created:>=${sinceDate}` });
                  userCount = r.data.total_count || 1;
                } catch(e) {}
                const quotaMsg = `You have submitted **${userCount}/250** PRs today (resets in ${hoursLeft}h).`;
                if (isMerged) {
                  await addComment(`🎉 **PR Merged!** Thanks @${itemAuthor}! ${quotaMsg} GSSoC labels assigned. [Discord](https://discord.gg/hWSdGrccBU)`);
                } else {
                  await addComment(`✅ **PR Closed — Full GSSoC Credit Awarded.** Thanks @${itemAuthor}! ${quotaMsg} Labels: GSSoC-26, gssoc:approved, accepted, integrated, good-pr assigned.`);
                }
              } else {
                await removeLabels(BAD_LABELS);
                await addLabels(['accepted', 'GSSoC-26', 'gssoc:approved', 'good-pr']);
              }
            }

            // REOPENED
            if (action === 'reopened') {
              await removeLabels(BAD_LABELS);
            }

            // OPENED/REOPENED/EDITED/SYNCHRONIZE
            if (['opened','reopened','edited','synchronize','ready_for_review'].includes(action)) {
              const title = item.title || '';
              const body = item.body || '';
              const textContent = (title + ' ' + body).toLowerCase();
              const additions = isPR ? (item.additions || 0) : 0;
              let level = additions > 500 ? 'level:advanced' : 'level:intermediate';
              if (!isPR) {
                const existing = currentLabels.find(l => l.startsWith('level:'));
                level = existing || 'level:intermediate';
              }

              const labels = ['good first issue', 'help wanted', level, 'GSSoC-26', 'gssoc:approved'];
              if (textContent.includes('animation')) labels.push('animation');
              else if (textContent.includes('component')) labels.push('component');
              if (textContent.includes('feature') || textContent.includes('add')) labels.push('type:feature');

              if (isPR) {
                const closingPattern = /(?:close|closes|fix|fixes|resolve|resolves)s*#([0-9]+)/gi;
                let match;
                let isECSoC = false;
                while ((match = closingPattern.exec(body)) !== null) {
                  const num = parseInt(match[1], 10);
                  try {
                    const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: num });
                    if (issue && issue.labels) {
                      const iLabels = issue.labels.map(l => l.name.toLowerCase());
                      if (iLabels.includes('ecsoc26')) isECSoC = true;
                      const issueLevel = issue.labels.find(l => l.name.startsWith('level:'));
                      if (issueLevel) {
                        const w = { 'level:beginner': 1, 'level:intermediate': 2, 'level:advanced': 3 };
                        if ((w[issueLevel.name] || 1) > (w[level] || 1)) level = issueLevel.name;
                      }
                    }
                  } catch(e) {}
                }
                if (isECSoC) labels.push('ECSoC26', 'ECSoC26-L3');
              } else {
                labels.push('ECSoC26', 'ECSoC26-L3');
              }

              await addLabels([...new Set(labels)]);

              if ((action === 'opened' || action === 'reopened') && (isPR)) {
                const targets = [owner];
                if (authorType === 'User') targets.push(itemAuthor);
                const missing = targets.filter(u => !currentAssignees.includes(u));
                if (missing.length > 0) {
                  await github.rest.issues.addAssignees({ owner, repo, issue_number: issueNumber, assignees: missing });
                }
              }
            }
