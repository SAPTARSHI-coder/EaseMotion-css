name: Stylelint

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.css'
      - '.github/workflows/stylelint.yml'
      - '.stylelintrc.json'
      - '.stylelintignore'
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.css'
      - '.github/workflows/stylelint.yml'
      - '.stylelintrc.json'
      - '.stylelintignore'

permissions:
  contents: read

jobs:
  lint-css:
    name: Lint CSS with Stylelint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Stylelint
        run: npm run lint
