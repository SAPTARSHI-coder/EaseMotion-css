name: Build CSS Bundle

on:
  push:
    branches:
      - main
    paths:
      - 'submissions/**'

permissions:
  contents: write

concurrency:
  group: build-css-bundle
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.repository == 'SAPTARSHI-coder/EaseMotion-css' && github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Build Minified CSS
        run: |
          npm ci || npm install
          npm run build

      - name: Commit and Push Bundle
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add easemotion.min.css
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-build minified css bundle [skip ci]"
            git push origin main
          fi
