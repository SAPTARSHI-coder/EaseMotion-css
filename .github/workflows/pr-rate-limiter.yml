name: Contribution Rate Limiter

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write
  issues: write

jobs:
  check-rate-limit:
    name: Check Daily PR Rate Limit
    runs-on: ubuntu-latest
    steps:
      - name: Check Contributor PR Count
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const prAuthor = context.payload.pull_request.user.login;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const DAILY_LIMIT = 100;
            
            console.log(`Checking daily PR rate limit for author "${prAuthor}"...`);
            
            // Exclude repository owner from rate limiting
            if (prAuthor === owner) {
              console.log("Author is the repository owner. Skipping rate limit check.");
              return;
            }

            // Calculate date 24 hours ago in ISO format
            const limitDate = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString().split('.')[0] + 'Z';
            const q = `repo:${owner}/${repo} is:pr author:${prAuthor} created:>=${limitDate}`;
            
            let totalCount = 0;
            try {
              const searchResult = await github.rest.search.issuesAndPullRequests({ q });
              totalCount = searchResult.data.total_count;
            } catch (err) {
              console.log(`Error calling search API: ${err.message}`);
              const limitMs = Date.now() - 24 * 60 * 60 * 1000;
              const pulls = await github.rest.pulls.list({ owner, repo, state: 'all', per_page: 100 });
              totalCount = pulls.data.filter(p => p.user.login === prAuthor && new Date(p.created_at).getTime() >= limitMs).length;
            }

            console.log(`User @${prAuthor} has opened ${totalCount} PRs in the last 24 hours.`);

            if (totalCount > DAILY_LIMIT) {
              console.log(`User @${prAuthor} exceeded daily limit of ${DAILY_LIMIT} PRs (${totalCount} opened).`);

              const limitComment = `### 🛑 Daily Contribution Rate Limit Exceeded\n\n` +
                `Hi @${prAuthor}! 👋\n\n` +
                `To maintain repository stability and fair contribution distribution, EaseMotion CSS enforces a rate limit of up to **100 PRs per day** per contributor.\n\n` +
                `You have submitted **${totalCount} pull requests** in the last 24 hours, exceeding the daily limit of 100 PRs/day.\n\n` +
                `This pull request has been automatically closed for now. Please wait until tomorrow or focus on reviewing your active PRs.\n\n` +
                `Thank you for your understanding and cooperation! 🚀`;

              await github.rest.issues.createComment({
                owner, repo, issue_number: prNumber, body: limitComment
              });

              try {
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: prNumber, labels: ['rate-limited']
                });
              } catch (e) {}

              await github.rest.pulls.update({
                owner, repo, pull_number: prNumber, state: 'closed'
              });
              return;
            }

            console.log(`User @${prAuthor} is within the daily limit (${totalCount}/${DAILY_LIMIT}).`);
