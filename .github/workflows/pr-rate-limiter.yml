name: Contribution Rate Limiter

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write
  issues: write

jobs:
  check-rate-limit:
    name: Check Hourly PR Rate Limit & Cooldown
    runs-on: ubuntu-latest
    steps:
      - name: Check Contributor PR Count & Cooldown
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const prAuthor = context.payload.pull_request.user.login;
            const currentPRCreated = new Date(context.payload.pull_request.created_at).getTime();
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const HOURLY_LIMIT = 10;
            const COOLDOWN_MS = 6 * 60 * 1000; // 6 minutes in milliseconds
            
            console.log(`Checking rate limit & cooldown for author "${prAuthor}"...`);
            
            // Exclude repository owner from rate limiting
            if (prAuthor === owner) {
              console.log("Author is the repository owner. Skipping rate limit check.");
              return;
            }

            // 1. Fetch user's recent PRs
            let matchingPulls = [];
            try {
              const pulls = await github.rest.pulls.list({
                owner, repo, state: 'all', per_page: 100
              });
              matchingPulls = pulls.data.filter(p => p.user.login === prAuthor);
            } catch (err) {
              console.log(`Error listing pulls: ${err.message}`);
            }

            // 2. Check 6-minute Cooldown
            const previousPRs = matchingPulls.filter(p => p.number !== prNumber);
            if (previousPRs.length > 0) {
              const latestPrevPR = previousPRs.reduce((latest, p) => {
                const t = new Date(p.created_at).getTime();
                return t > latest ? t : latest;
              }, 0);

              const timeDiff = currentPRCreated - latestPrevPR;
              if (timeDiff < COOLDOWN_MS) {
                const minutesLeft = Math.ceil((COOLDOWN_MS - timeDiff) / (60 * 1000));
                console.log(`User @${prAuthor} triggered 6-minute cooldown (${Math.round(timeDiff / 1000)}s since last PR).`);

                const cooldownComment = `### ⏳ PR Submission Cooldown Active\n\n` +
                  `Hi @${prAuthor}! 👋\n\n` +
                  `To maintain code review quality and repository stability, EaseMotion CSS enforces a **6-minute cooldown between PR submissions** per contributor.\n\n` +
                  `Your last pull request was submitted less than 6 minutes ago. Please wait **${minutesLeft} more minute(s)** before opening your next pull request.\n\n` +
                  `Thank you for your understanding! 🚀`;

                await github.rest.issues.createComment({
                  owner, repo, issue_number: prNumber, body: cooldownComment
                });

                await github.rest.pulls.update({
                  owner, repo, pull_number: prNumber, state: 'closed'
                });
                return;
              }
            }

            // 3. Check Hourly Limit (10 PRs / hour)
            const oneHourAgo = currentPRCreated - (60 * 60 * 1000);
            const hourlyPullsCount = matchingPulls.filter(p => new Date(p.created_at).getTime() >= oneHourAgo).length;

            if (hourlyPullsCount > HOURLY_LIMIT) {
              console.log(`User @${prAuthor} opened ${hourlyPullsCount} PRs in the last hour. Exceeds limit of ${HOURLY_LIMIT}.`);

              const limitComment = `### 🛑 Hourly Contribution Rate Limit Exceeded\n\n` +
                `Hi @${prAuthor}! 👋\n\n` +
                `To maintain repository stability and fair contribution distribution, EaseMotion CSS enforces a rate limit of **10 PRs per hour** per contributor.\n\n` +
                `You have submitted **${hourlyPullsCount} pull requests** in the last hour, exceeding the limit of 10 PRs/hr.\n\n` +
                `This pull request has been automatically closed. Please wait an hour before submitting new pull requests.\n\n` +
                `Thank you for your cooperation! 🚀`;

              await github.rest.issues.createComment({
                owner, repo, issue_number: prNumber, body: limitComment
              });

              await github.rest.pulls.update({
                owner, repo, pull_number: prNumber, state: 'closed'
              });
              return;
            }

            console.log(`User @${prAuthor} passed rate limit & cooldown checks.`);
