name: Contribution Rate Limiter

# DISABLED — GSSoC is over, no rate limiting needed.
# All PRs inside submissions/ are welcome.

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write
  issues: write

jobs:
  check-rate-limit:
    name: Check Daily PR Rate Limit
    runs-on: ubuntu-latest
    steps:
      - name: Rate limit check (disabled)
        uses: actions/github-script@v7
        with:
          script: |
            // Rate limiting is disabled. All contributions welcome.
            console.log(`✅ Rate limiting disabled. PR #${context.payload.pull_request.number} by @${context.payload.pull_request.user.login} is allowed.`);
