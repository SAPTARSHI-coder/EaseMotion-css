name: Update Contributor Wall

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: contributor-wall
  cancel-in-progress: false   # queue runs, never cancel — ensures every merge counts

jobs:
  update-wall:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main           # always fetch the latest main, not the triggering commit

      - name: Fetch all contributors
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in {1..5}; do
            gh api "repos/${{ github.repository }}/stats/contributors" > /tmp/contributors.json
            if [ -s /tmp/contributors.json ] && [ "$(cat /tmp/contributors.json)" != "[]" ]; then
              echo "Contributors stats fetched successfully."
              exit 0
            fi
            echo "Waiting for GitHub stats computation (attempt $i/5)..."
            sleep 6
          done

          echo "Fallback: Fetching via /contributors endpoint..."
          gh api "repos/${{ github.repository }}/contributors?per_page=100" > /tmp/contributors.json

      - name: Pull latest before building
        run: git pull --rebase origin main

      - name: Build contributor wall
        run: python3 scripts/build-contributor-wall.py

      - name: Commit if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update contributor wall [skip ci]"
          file_pattern: README.md
          push_options: --force-with-lease
